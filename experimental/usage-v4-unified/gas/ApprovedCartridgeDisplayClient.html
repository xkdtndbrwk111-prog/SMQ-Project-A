const active=new Map(); // canonical label -> approved display fields from the latest LIST
const live=window.HOJA_B_LIVE;
if(!live||typeof live.rpc!=='function')return;
const previousRpc=live.rpc.bind(live);
live.rpc=function(method,payload){
 const response=previousRpc(method,payload);
 if(method!=='LIST')return response;
 return Promise.resolve(response).then(rows=>{
  active.clear();
  const ambiguous=new Set();
  if(Array.isArray(rows))for(const row of rows){
   if(!row||!row.pkg||typeof row.name!=='string')continue;
   const known=byId[String(row.pkg.id)];
   const d=row.display;
   const unit=known&&row.name.endsWith('-'+known.sourceTitle)?known:d;
   if(!unit||typeof unit.sourceTitle!=='string'||typeof unit.title!=='string'||
     !/^\d{1,2}(?:-\d{1,2})?$/.test(String(unit.number))||
     !row.name.endsWith('-'+unit.sourceTitle))continue;
   const prev=active.get(unit.sourceTitle);
   if(prev&&(prev.number!==unit.number||prev.title!==unit.title))ambiguous.add(unit.sourceTitle);
   else active.set(unit.sourceTitle,unit);
  }
  for(const title of ambiguous)active.delete(title);
  return rows; // unchanged identity and package descriptors
 });
};
function patchCards(){
 const rail=document.getElementById('hcRail');
 if(!rail||!active.size)return;
 for(const button of rail.querySelectorAll('.hcPak.isUnit')){
  if(button.dataset.hoja15DisplayDone==='1')continue;
  const unit=active.get(button.title); // title is the original parsed LIST label
  if(!unit)continue;
  const face=button.querySelector('.hcFace');
  const label=face&&face.querySelector('strong.hcUnitName');
  if(!label)continue;
  const number=document.createElement('span');
  number.className='hoja15UnitNumber';
  number.textContent=unit.number;
  face.insertBefore(number,label);
  label.textContent=unit.title;
  label.dataset.fullLabel=unit.title; // existing word-based fitUnitNames() reads this
  button.classList.toggle('isLong',unit.title.length>19);
  button.classList.add('hoja15DisplayUnit');
  button.title=unit.number+'. '+unit.title;
  button.setAttribute('aria-label',unit.number+'단원 '+unit.title);
  const small=face.querySelector('small');
  if(small&&/^PAK[ ]+[0-9]+$/u.test(small.textContent.trim()))small.hidden=true;
  button.dataset.hoja15DisplayDone='1';
  // button.onclick and the ⓘ info handler both retain the original sheetName/title.
 }
}
function patchNextSelected(){
 const el=document.getElementById('hcNextSelected');
 if(!el||!active.size)return;
 const prior=el.textContent;
 // Match exact source labels in one pass. Substring replacement can re-match
 // the newly prefixed title (especially when sourceTitle === title for a new
 // catalog unit), recursively retriggering the MutationObserver forever.
 const next=prior.split(' · ').map(label=>{
  const unit=active.get(label);
  return unit?unit.number+'. '+unit.title:label;
 }).join(' · ');
 if(next!==prior)el.textContent=next;
}
function initialize(){
 const rail=document.getElementById('hcRail');
 const selected=document.getElementById('hcNextSelected');
 if(!rail||!selected)return;
 const style=document.createElement('style');style.id='hoja15ApprovedDisplayStyle';
 style.textContent=[
  '#hojaCatalog .hcPak.hoja15DisplayUnit .hcEmblem{display:none!important}',
  '#hojaCatalog .hcPak.hoja15DisplayUnit .hcFace{gap:9px!important;padding:8px 9px!important}',
  '#hojaCatalog .hcPak.hoja15DisplayUnit .hoja15UnitNumber{display:block;flex:0 0 auto;font-size:clamp(21px,2.2vw,31px);font-weight:1000;line-height:1.1;color:#ffe4a0}',
  '#hojaCatalog .hcPak.hoja15DisplayUnit .hcFace small[hidden]{display:none!important}'
 ].join(' ');
 document.head.appendChild(style);
 new MutationObserver(patchCards).observe(rail,{childList:true});
 new MutationObserver(patchNextSelected).observe(selected,{childList:true,characterData:true,subtree:true});
 patchCards();patchNextSelected();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initialize,{once:true});
else initialize();
window.HOJA15_APPROVED_DISPLAY=Object.freeze({version:2,get expectedUnits(){return active.size},get activeUnits(){return active.size}});
