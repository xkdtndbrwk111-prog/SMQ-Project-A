<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOJA 학급 대결 시험판</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf8ef;color:#203e36;font-family:system-ui,sans-serif;font-size:19px}header{background:#176849;color:white;padding:15px 5%;font-size:25px;font-weight:900}main{max-width:1100px;margin:auto;padding:22px}h1{font-size:32px;margin:0 0 15px}h2{font-size:24px}button,input,select{font:inherit;border-radius:12px;padding:13px;border:2px solid #bddccb}button{background:#187a54;color:white;border:0;font-weight:800;cursor:pointer}button:hover{background:#0b5f3f}button:disabled{opacity:.4;cursor:default}.secondary{background:#e4f2e9;color:#205c42}.danger{background:#9c4d4d}.card{background:white;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 3px 14px #255c2814}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.big{font-size:35px;font-weight:900}.muted{color:#60766b;font-size:16px}.people{display:grid;gap:10px}.person{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;background:#f1f8f3;border-radius:12px}.person strong{min-width:90px}.person button{padding:8px;font-size:16px}.notice{color:#9c4d4d;min-height:1.5em}#qr img{width:210px;height:210px;image-rendering:pixelated}.link{overflow-wrap:anywhere;font-size:14px}iframe{border:0;width:100%;height:calc(100vh - 120px);min-height:500px;background:#111}.game main{max-width:none;padding:0}.game header{padding:5px 15px;font-size:16px}.winner{background:#fff3be;animation:shine 1.2s infinite alternate}@keyframes shine{to{box-shadow:0 0 24px #f9c54b;transform:scale(1.01)}}.confetti{font-size:28px;letter-spacing:12px;animation:float 1s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-8px) rotate(2deg)}}
