name: HOJA 1.5 Windows Chrome baseline
on:
  push:
    branches: [work/hoja15-stability-20261127]
    paths: ['.github/workflows/hoja15-stability-windows.yml', 'experimental/usage-v4-unified/verify_stability.py', 'experimental/usage-v4-unified/approved-catalog/*.mjs', 'experimental/unified-quiz-renderer/game-trial/build_trial.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-assemble:
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3]
        condition: [A, B, C]
        include:
          - condition: A
            instrumentation: minimal
            trace: 'off'
          - condition: B
            instrumentation: detailed
            trace: 'off'
          - condition: C
            instrumentation: detailed
            trace: 'on'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 18
    steps:
      - name: Preserve repository bytes in checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: xkdtndbrwk111-prog/HOJA-QUESTION-BANK
          ref: 43df08f9a1edebb0ff4ed8c7c651cba005bb2f3c
          path: qbank-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xkdtndbrwk111-prog/HOJA-QUESTION-BANK
          ref: 8d809453fc9470aefa74c4ad9f7357574f918e5c
          path: qbank-runtime
          persist-credentials: false
      - name: Rebuild and verify exact registered candidate runtime bytes
        run: |
          P=experimental/usage-v4-unified/approved-catalog
          node "$P/build_approved_index.mjs" --qbank qbank-source
          node "$P/build_content_packages.mjs" --qbank qbank-source --packages-out "$RUNNER_TEMP/rebuilt"
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          import {qaPreviewCatalog} from './experimental/usage-v4-unified/approved-catalog/qa_preview.mjs';
          import {verifyRemoteRelease} from './experimental/usage-v4-unified/approved-catalog/build_remote_active_catalog.mjs';
          const p='experimental/usage-v4-unified/approved-catalog/',read=f=>JSON.parse(fs.readFileSync(f));
          const idx=read(p+'generated/approved-source-index.json'),report=read(p+'generated/approved-content-report.json');
          const d='game-runtime/approved-packages/v1/INDEX.json',published=read('qbank-runtime/'+d),rebuilt=read(process.env.RUNNER_TEMP+'/rebuilt/'+d);
          assert.deepEqual(published,rebuilt);assert.equal(idx.approvalUnits,29);assert.equal(idx.approvalQuestions,899);
          for(const e of published.packages){
            const raw=fs.readFileSync('qbank-runtime/'+e.path);
            assert.equal(raw.length,e.bytes);assert.equal(crypto.createHash('sha256').update(raw).digest('hex'),e.sha256);
            assert.deepEqual(raw,fs.readFileSync(process.env.RUNNER_TEMP+'/rebuilt/'+e.path));
          }
          console.log('REMOTE_RUNTIME_BYTES_PASS 29/899');
          for(const e of idx.entries.filter(e=>e.subject==='science'))console.log('SCIENCE_SOURCE_PIN',JSON.stringify({cartridgeId:e.cartridgeId,effectiveSha256:e.effectiveSha256,unit:e.unit,questionCount:e.questionCount,mediaRights:e.mediaRights.status}));
          const commit='8d809453fc9470aefa74c4ad9f7357574f918e5c';
          const qa=qaPreviewCatalog(idx,report,{schemaVersion:'hoja-qa-preview-v1',purpose:'TEST_ONLY_QA_NOT_DEPLOYMENT',sourceCommit:idx.sourceCommit,select:'ALL_READY'},{allowedScriptIds:['MOCK_ISOLATED_TEST_SCRIPT_ID_0001'],contentSource:{repo:idx.sourceRepo,commit}});
          // This deliberately uses a synthetic in-memory RELEASE shape to exercise
          // the exact production assembler. No manifest or deployment is approved.
          const {allowedScriptIds,...rest}=qa;
          const active={...rest,buildType:'RELEASE',deploymentId:'HOJA15-ISOLATED-TEST_ONLY-NOT_FOR_DEPLOYMENT',entries:rest.entries.map(e=>({...e,deploymentStatus:'DEPLOYED'}))};
          const cat=verifyRemoteRelease(active,report,published,commit,path=>{
            const raw=fs.readFileSync('qbank-runtime/'+path);return {sha256:crypto.createHash('sha256').update(raw).digest('hex'),bytes:raw.length,data:JSON.parse(raw)};
          });
          fs.writeFileSync(process.env.RUNNER_TEMP+'/test-catalog.json',JSON.stringify(cat));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/test-catalog.gs','/* LOCAL CI FIXTURE ONLY; NEVER DEPLOY */\nvar HOJA_APPROVED_ACTIVE_CATALOG_=Object.freeze('+JSON.stringify(cat,null,1)+');\n');
          JS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified source-part blob bytes
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const files=execFileSync('git',['ls-files','-z','versions/2.0.0/Game.html.parts','experimental/unified-quiz-renderer','experimental/usage-v4-unified/gas']).toString().split('\0').filter(Boolean);
          for (const file of files) writeFileSync(file,execFileSync('git',['show','HEAD:'+file],{maxBuffer:30*1024*1024}));
          console.log('RESTORED_GIT_BLOBS',files.length);
          JS
      - name: Diagnose Windows bundle builder
        env:
          PYTHONUTF8: '1'
        run: python -u experimental/usage-v4-unified/build_unified_gas.py --output "$RUNNER_TEMP/preflight-bundle" --game approved-rc
      - name: Full exact GAS bundle assembly (isolated test only; no artifact or deployment)
        run: |
          P=experimental/usage-v4-unified
          python "$P/assemble_hoja15_production.py" --catalog "$RUNNER_TEMP/test-catalog.gs" --packages qbank-runtime --out "$RUNNER_TEMP/test-bundle" --expected-units 29
          # Keep test-only bundle inside this ephemeral CI job for browser tests.
      - name: Run 29-unit catalog RPC integration on registered runtime
        run: node experimental/usage-v4-unified/verify_remote_catalog_integration.mjs qbank-runtime 29 899
      - name: Install offline browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          npm install --prefix "$RUNNER_TEMP/browser-deps" --ignore-scripts phaser@4.2.1 jsqr@1.4.0
      - name: Five-player baseline on isolated mock
        run: |
          set -euo pipefail
          P=experimental/usage-v4-unified
          mkdir "$RUNNER_TEMP/mock-extra"
          export HOJA_REMOTE_TEST_CATALOG="$RUNNER_TEMP/test-catalog.json"
          export HOJA_JOIN_TEST_URL="https://script.google.com/macros/s/TEST_ONLY_LOCAL_QR_00000000000000/exec"
          node "$P/qa_mock_gas_server.mjs" "$RUNNER_TEMP/mock-extra" 8790 qbank-runtime > "$RUNNER_TEMP/mock-server.log" 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true; cat "$RUNNER_TEMP/mock-server.log"' EXIT
          for i in $(seq 1 30); do if grep -q '^READY' "$RUNNER_TEMP/mock-server.log"; then break; fi; sleep 1; done
          grep -q '^READY' "$RUNNER_TEMP/mock-server.log"
          python -u "$P/verify_stability.py" --html "$RUNNER_TEMP/test-bundle/Game.html" --phaser "$RUNNER_TEMP/browser-deps/node_modules/phaser/dist/phaser.min.js" --github-packages qbank-runtime --port 8790 --units sci5-s2-heat-common --channel chrome --runs 10 --instrumentation '${{ matrix.instrumentation }}' --trace '${{ matrix.trace }}' | tee "$RUNNER_TEMP/stability.log"
      - name: Preserve diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-compare-windows-chrome-${{ matrix.condition }}-${{ matrix.batch }}
          path: |
            ${{ runner.temp }}/stability.log
            ${{ runner.temp }}/stability-traces/
          if-no-files-found: warn
