name: HOJA arcade movement physics diagnostic (manual trial only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned real Phaser 4.2.1
        run: |
          npm pack phaser@4.2.1 --silent
          tar -xzf phaser-4.2.1.tgz package/dist/phaser.min.js
          test -s package/dist/phaser.min.js
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Rebuild exact 25-part trial, never production
        run: |
          python3 experimental/unified-quiz-renderer/game-trial/verify_trial_build.py
          python3 experimental/unified-quiz-renderer/game-trial/build_trial.py --output "$RUNNER_TEMP/Game.MOVEMENT.TEST.html"
      - name: Diagnostic original physics — S crouch, D walk, comma run, period jump
        run: |
          python3 experimental/unified-quiz-renderer/game-trial/verify_trial_arcade_phaser_chromium.py --html "$RUNNER_TEMP/Game.MOVEMENT.TEST.html" --phaser package/dist/phaser.min.js --rounds 2 --movement-smoke
