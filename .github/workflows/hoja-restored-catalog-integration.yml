name: HOJA restored catalog integration
on:
  push:
    branches: [work/hoja15-remote-catalog-20261126]
    paths:
      - '.github/workflows/hoja-restored-catalog-integration.yml'
      - 'experimental/usage-v4-unified/verify_remote_catalog_integration.mjs'
      - 'experimental/usage-v4-unified/gas/**'
      - 'experimental/usage-v4-unified/approved-catalog/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: xkdtndbrwk111-prog/HOJA-QUESTION-BANK
          ref: 43df08f9a1edebb0ff4ed8c7c651cba005bb2f3c
          path: qbank
          persist-credentials: false
      - name: Rebuild all 29 source packages on isolated checkout
        run: |
          P=experimental/usage-v4-unified/approved-catalog
          node "$P/build_approved_index.mjs" --qbank qbank
          node "$P/build_content_packages.mjs" --qbank qbank --packages-out "$RUNNER_TEMP/runtime"
          cp -r "$RUNNER_TEMP/runtime/game-runtime/approved-packages/v1/." qbank/game-runtime/approved-packages/v1/
          git -C qbank config user.email "test@example.invalid"
          git -C qbank config user.name "Offline integration"
          git -C qbank add game-runtime/approved-packages/v1
          git -C qbank commit -m 'Isolated generated runtime; never push'
      - name: Test remote catalog RPC and durable recovery for 899 questions
        run: |
          node experimental/usage-v4-unified/verify_remote_catalog_integration.mjs qbank 29 899
      - name: Export exact new package bytes and full index for candidate registration
        run: |
          python3 - <<'PY'
          import pathlib,os,json,base64,hashlib
          p=pathlib.Path('qbank/game-runtime/approved-packages/v1')
          for name in ('sci5-s2-heat-common.json','sci5-s2-u4-common.json','INDEX.json'):
              b=(p/name).read_bytes();enc=base64.b64encode(b).decode()
              print('TRANSFER_BEGIN',name,len(b),hashlib.sha256(b).hexdigest(),flush=True)
              for i in range(0,len(enc),4000): print('TRANSFER_CHUNK',name,i//4000,enc[i:i+4000],flush=True)
              print('TRANSFER_END',name,flush=True)
          PY
