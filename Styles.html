/* v0.99.87 — responsive SOLO side panels for MacBook / iPad */

/* One shared visual system for SCORE, CORRECT and RANKING. */
:root{
  --solo-panel-w: clamp(190px, 17vw, 285px);
  --solo-side-x: clamp(12px, 1.25vw, 20px);
  --solo-side-top: clamp(18px, 2.2vh, 30px);
  --solo-score-h: clamp(112px, 15vh, 138px);
  --solo-correct-h: clamp(118px, 16vh, 146px);
  --solo-panel-gap: clamp(12px, 1.4vh, 18px);
}

body.solo-mode #soloHudLeft,
body.solo-mode #soloHudRight,
body.solo-mode.solo-game-active #soloLiveRanking{
  box-sizing:border-box !important;
  background:#0b1321 !important;
  color:#fff !important;
  border:5px solid #fbd000 !important;
  border-radius:14px !important;
  box-shadow:
    0 0 0 3px #fff,
    0 8px 0 #000 !important;
}

/* Left column */
body.solo-mode #soloHudLeft,
body.solo-mode #soloHudRight{
  position:fixed !important;
  left:var(--solo-side-x) !important;
  right:auto !important;
  width:var(--solo-panel-w) !important;
  transform:none !important;
  margin:0 !important;
  padding:clamp(12px,1.2vw,18px) !important;
  overflow:hidden !important;
  z-index:9300 !important;
  text-align:center !important;
}

body.solo-mode #soloHudLeft{
  top:var(--solo-side-top) !important;
  height:var(--solo-score-h) !important;
  min-height:0 !important;
}

body.solo-mode #soloHudRight{
  top:calc(var(--solo-side-top) + var(--solo-score-h) + var(--solo-panel-gap)) !important;
  height:var(--solo-correct-h) !important;
  min-height:0 !important;
}

body.solo-mode #soloHudLeft .solo-hud-kicker,
body.solo-mode #soloHudRight .solo-hud-kicker{

<style>
/* =========================================================
   v1.00.202 — ROOT FIX: invisible TEAM-select hitboxes
   ---------------------------------------------------------
   This is the same family of bug previously fixed in v1.00.116.
   The TEAM selector remains a full-screen fixed modal after SOLO begins.
   Its opacity/pointer-events are normally disabled, but descendants such as
   .stage-team-btn explicitly restore pointer-events:auto. With later theme/
   animation layers and pseudo-elements, an invisible question-block hitbox can
   become hit-testable over the SOLO grid.

   Hard-hide the WHOLE inactive setup modal instead of relying on hit-testing
   inheritance. No hidden descendant can intercept a SOLO tile after this.
   ========================================================= */
#setupModal:not(.active){
  display:none !important;
  visibility:hidden !important;
  opacity:0 !important;
  pointer-events:none !important;
}

/* Restore the normal modal box only while TEAM/SOLO selection is genuinely open. */
#setupModal.active{
  display:flex !important;
  visibility:visible !important;
  pointer-events:auto !important;
}

/* Belt-and-suspenders: every decorative/question layer inside an inactive
   selector is non-interactive even if a future rule changes display behavior. */
#setupModal:not(.active) *,
#setupModal:not(.active)::before,
#setupModal:not(.active)::after{
  pointer-events:none !important;
}
</style>


<style>
/* =========================================================
   v1.00.203 — keep inactive TEAM selector measurable, but untouchable
   ---------------------------------------------------------
   v202 used display:none to kill invisible hitboxes. That also removed the
   stage from layout, so map/tile builders could occasionally measure zero or
   stale geometry and render a clipped Underground/Overworld scene.

   visibility:hidden preserves layout metrics while removing the entire modal
   and every descendant from visual/hit-test interaction.
   ========================================================= */
#setupModal:not(.active){
  display:flex !important;       /* measurable even while inactive */
  visibility:hidden !important;
  opacity:0 !important;
  pointer-events:none !important;
}

/* No child or pseudo-element can resurrect an invisible hitbox. */
#setupModal:not(.active) *,
#setupModal:not(.active) *::before,
#setupModal:not(.active) *::after,
#setupModal:not(.active)::before,
#setupModal:not(.active)::after{
  visibility:hidden !important;
  pointer-events:none !important;
}

/* Active selector returns to normal rendering/hit-testing. */
#setupModal.active{
  display:flex !important;
  visibility:visible !important;
  opacity:1 !important;
  pointer-events:auto !important;
}
#setupModal.active *{
