    let c=parent.querySelector(':scope > canvas.'+cls);
    if(!c){
      c=document.createElement('canvas');
      c.className='v97-native-world-canvas '+cls;
      parent.insertBefore(c,parent.firstChild);
    }
    if(c.width!==w)c.width=w;
    if(c.height!==h)c.height=h;
    const ctx=c.getContext('2d');
    ctx.imageSmoothingEnabled=false;
    return [c,ctx];
  }

  /* ---------- OVERWORLD / UNDERGROUND ---------- */
  function prepClassic(map,type){
    if(!map || map.dataset.v97Prepared===type)return;
    map.dataset.v97Prepared=type;
    map.classList.add('v97-canvas-map');
    const selector=type==='ow'?'.ow83-tile':'.ug85-tile';
    const list=[];
    map.querySelectorAll(selector).forEach(el=>{
      const [c,r]=getCR(el);
      const rec={el,c,r,kind:'static',urls:[]};
      if(type==='ow' && el.classList.contains('ow83-question')){
        rec.kind='owq';
        rec.urls=[cssVarUrl(el,'--ow83-q1'),cssVarUrl(el,'--ow83-q2'),cssVarUrl(el,'--ow83-q3')];
      }else if(type==='ug' && el.classList.contains('ug85-coin')){
        rec.kind='ugcoin';
        rec.urls=[cssVarUrl(el,'--ug-c1'),cssVarUrl(el,'--ug-c2'),cssVarUrl(el,'--ug-c3')];
      }else rec.urls=[sourceUrl(el)];
      rec.urls.forEach(img);
      list.push(rec);
    });
    map._v97={type,list};
    activeMaps.add(map);
    sizeClassic(map);
    renderClassic(map,performance.now());
  }
  function sizeClassic(map){
    const host=map.parentElement;if(!host)return;
    const sc=(host.clientHeight||BASE_H)/BASE_H;
    map.style.setProperty('--v97-map-scale',String(sc));
    host.style.setProperty(map._v97?.type==='ug'?'--ug85-tile-px':'--ow83-tile-px',(NATIVE_TILE*sc)+'px');
  }
  function renderClassic(map,now){
    if(!map.isConnected || !map._v97)return;
    // v1.00.229 — Underground TEAM panels can be wider than one rendered
    // 688x240 native world on short/wide viewports. Raster enough repeated
    // native worlds to cover the whole panel so the right edge never exposes
    // an empty band while the two stage panels loop. Classic Overworld is untouched.
    let rasterW=BASE_W;
    const host=map.parentElement;
    const isUgTeam=map._v97.type==='ug' && map.classList.contains('ug85-team-map') && host;
    if(isUgTeam){
      const sc=(host.clientHeight||BASE_H)/BASE_H;
      const needNative=(host.clientWidth||BASE_W*sc)/Math.max(sc,0.001);
      rasterW=Math.max(BASE_W,Math.ceil(needNative/BASE_W)*BASE_W);
      map.style.setProperty('width',rasterW+'px','important');
    }
    const [canvas,ctx]=ensureCanvas(map,'v97-classic-canvas',rasterW,BASE_H);
    if(isUgTeam) canvas.style.setProperty('width',rasterW+'px','important');
    ctx.clearRect(0,0,rasterW,BASE_H);
    const pulse = (typeof getQuestionCoinPulse124 === 'function')
      ? getQuestionCoinPulse124(now)
      : {frame:-1,opacity:0};

    const repeats=Math.max(1,Math.ceil(rasterW/BASE_W));
    for(let rep=0;rep<repeats;rep++){
      const xOff=rep*BASE_W;
      for(const o of map._v97.list){
        if(o.kind==='owq' || o.kind==='ugcoin'){
          const base=img(o.urls[0]);
          if(base) ctx.drawImage(base,xOff+o.c*16,o.r*16,16,16);

          if(pulse.frame >= 1 && pulse.opacity > 0){
            const overlay=img(o.urls[pulse.frame]);
            if(overlay){
              ctx.save();
              ctx.globalAlpha=pulse.opacity;
              ctx.drawImage(overlay,xOff+o.c*16,o.r*16,16,16);
              ctx.restore();
            }
          }
          continue;
        }

        const im=img(o.urls[0]);
        if(im)ctx.drawImage(im,xOff+o.c*16,o.r*16,16,16);
      }
    }
  }

  /* ---------- UNDERWATER ---------- */
  function underwaterGrid(){
    return window.UNDERWATER_SHARED_GRID_V89 || window.UNDERWATER_SHARED_GRID_V88 || {coral:[]};
  }
  function drawUnderwater(host,mode){
    if(!host || !host.isConnected)return;
    const h=host.clientHeight||BASE_H, sc=h/BASE_H;
    const neededW=Math.max(BASE_W,Math.ceil((host.clientWidth||BASE_W*sc)/sc/16)*16);
    const [canvas,ctx]=ensureCanvas(host,'v97-underwater-canvas',neededW,BASE_H);
    canvas.style.width=(neededW*sc)+'px'; canvas.style.height=h+'px';

    ctx.fillStyle='#0058a8';ctx.fillRect(0,0,neededW,BASE_H);
    let waterline=24;
    if(mode==='intro') waterline+=20/sc; // preserve the existing +20px intro lowering
    ctx.fillStyle='#5c94fc';ctx.fillRect(0,0,neededW,Math.max(0,waterline));

    const wave=img(typeof UNDERWATER_SURFACE_TILE_V54!=='undefined'?UNDERWATER_SURFACE_TILE_V54:'');
    if(wave){for(let x=0;x<neededW;x+=16)ctx.drawImage(wave,x,Math.round(waterline-8),16,16);}
    const ground=img(typeof UNDERWATER_TEAM_GROUND_TILE!=='undefined'?UNDERWATER_TEAM_GROUND_TILE:'');
    if(ground){for(let y=208;y<240;y+=16)for(let x=0;x<neededW;x+=16)ctx.drawImage(ground,x,y,16,16);}
    const coral=img(typeof UNDERWATER_TEAM_CORAL_TILE!=='undefined'?UNDERWATER_TEAM_CORAL_TILE:'');
    if(coral){
      underwaterGrid().coral.forEach(([tx,stack])=>{
        for(let row=0;row<stack;row++)ctx.drawImage(coral,tx*16,240-32-(row+1)*16,16,16);
      });
    }
  }
  function prepUnderwater(){
    if(document.body?.dataset?.theme!=='underwater')return;
    const intro=document.getElementById('introStageBg'); if(intro)drawUnderwater(intro,'intro');
    document.querySelectorAll('#setupModal .stage-scroll-track .stage-panel').forEach(p=>drawUnderwater(p,'team'));
    document.querySelectorAll('.uw87-score-map').forEach(map=>drawUnderwater(map,'score'));
  }

  /* ---------- CASTLE ---------- */
  function parsePx(v){const n=parseFloat(v);return Number.isFinite(n)?n:0;}
  function prepCastle(map){
    if(!map || !map.isConnected)return;
    const meta=map._castle69;if(!meta)return;
    map.classList.add('v97-canvas-map');
    const tp=meta.tilePx||16;
    const renderedH=map.clientHeight||map.parentElement?.clientHeight||meta.rows*tp;
    const nativeH=Math.max(meta.rows*16,Math.round(renderedH*16/tp));
    const nativeW=meta.cols*16;
    const [canvas,ctx]=ensureCanvas(map,'v97-castle-canvas',nativeW,nativeH);
    canvas.style.width=(meta.cols*tp)+'px';canvas.style.height=renderedH+'px';
    ctx.fillStyle='#000';ctx.fillRect(0,0,nativeW,nativeH);

    const scale=16/tp;
    const els=[...map.children].filter(el=>el!==canvas && (el.classList.contains('castle69-tile')||el.classList.contains('castle74-bottom-fill')||el.classList.contains('castle70-lava-body')))
      .sort((a,b)=>(parseInt(a.style.zIndex)||0)-(parseInt(b.style.zIndex)||0));
    for(const el of els){
      const x=parsePx(el.style.left)*scale, y=parsePx(el.style.top)*scale;
      let w=parsePx(el.style.width); if(!w && el.classList.contains('castle69-tile'))w=tp;
      let hh=parsePx(el.style.height); if(!hh && el.classList.contains('castle69-tile'))hh=tp;
      if(!hh && el.style.bottom!=='')hh=Math.max(0,renderedH-parsePx(el.style.top)-parsePx(el.style.bottom));
      w*=scale;hh*=scale;
      const color=el.style.backgroundColor || (el.classList.contains('castle74-bottom-fill-lava')||el.classList.contains('castle70-lava-body')?'#D82800':'');
      if(color){ctx.fillStyle=color;ctx.fillRect(x,y,w,hh);}
      const src=sourceUrl(el), im=img(src);
      if(im){
        if(el.classList.contains('castle74-bottom-fill-brick')){
          for(let yy=y;yy<y+hh-.01;yy+=16)for(let xx=x;xx<x+w-.01;xx+=16)ctx.drawImage(im,xx,yy,Math.min(16,x+w-xx),Math.min(16,y+hh-yy));
        }else ctx.drawImage(im,x,y,w||16,hh||16);
      }
    }
    map._v97Castle={nativeW,nativeH};
  }

  function applyAll(){
    document.querySelectorAll('.ow83-map').forEach(m=>{prepClassic(m,'ow');sizeClassic(m);});
    document.querySelectorAll('.ug85-map').forEach(m=>{prepClassic(m,'ug');sizeClassic(m);});
    prepUnderwater();
    document.querySelectorAll('.castle69-map').forEach(prepCastle);
  }

  function frame(now){
    raf=requestAnimationFrame(frame);
    if(now-lastDynamic<30)return;
    lastDynamic=now;
    activeMaps.forEach(map=>{
      if(!map.isConnected){activeMaps.delete(map);return;}
      renderClassic(map,now);
    });
  }
  function schedule(){
    // v178: do not endlessly debounce classic-map registration.
    // Overworld/Underground continuously mutate classes while building/animating;
    // the old clearTimeout() pattern could keep postponing applyAll() forever
    // until the tab was backgrounded. Coalesce to one pending registration pass
    // instead, so newly-created classic maps are registered on the first paint.
    if(mutationTimer)return;
    mutationTimer=setTimeout(()=>{
      mutationTimer=0;
      requestAnimationFrame(()=>requestAnimationFrame(applyAll));
    },45);
  }

  window.applyNativeCanvasWorldsV97=applyAll;
  window.addEventListener('load',schedule);
  window.addEventListener('resize',schedule,{passive:true});
  window.addEventListener('orientationchange',schedule,{passive:true});
  document.addEventListener('DOMContentLoaded',schedule,{once:true});
  const observe=()=>{
    if(!document.body)return;
    new MutationObserver(schedule).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['data-theme','class']});
  };
  if(document.body)observe();else document.addEventListener('DOMContentLoaded',observe,{once:true});
  requestAnimationFrame(frame);
  schedule();
})();
</script>

<script>
/* =========================================================
   v1.00.98 — deterministic THEME TEST switch.
   The normal random boot chooser is left exactly as-is.
   Test switching now:
   1) removes stale stage-only world layers,
   2) applies the requested theme,
   3) explicitly rebuilds ONLY that theme,
   4) re-rasterizes the active native canvas after two paints.
   ========================================================= */
(function(){
  function testStageRoots(){
    return [
      document.getElementById('introOverlay'),
      document.getElementById('setupModal')
    ].filter(Boolean);
  }

  function purgeForeignTestStageLayers(){
    for(const root of testStageRoots()){
      root.querySelectorAll(
        '.ow83-map,' +
        '.ug85-map,' +
        '.castle69-map,' +
        '.v97-underwater-canvas,' +
        '.uw49-layer,' +
        '.uw49-coral-layer,' +
        '.uw52-panel-coral,' +
        '.uw63-team-sky,' +
        '.uw63-team-wave'
      ).forEach(el=>el.remove());
    }

    const intro=document.getElementById('introStageBg');
    const team=document.querySelector('#setupModal .team-stage-window');
    if(intro){
      delete intro._uw49Actors;
      delete intro.dataset.v97Prepared;
    }
    if(team){
      delete team._uw49Actors;
      delete team.dataset.v97Prepared;
    }
  }

  function rebuildRequestedTheme(themeId){
    if(themeId==='overworld'){
      if(typeof window.refreshOverworld83TileMaps==='function'){
        window.refreshOverworld83TileMaps();
      }
    }else if(themeId==='underground'){
      const intro=document.getElementById('introStageBg');
      if(intro && typeof window.buildUnderground86TileMap==='function'){
        window.buildUnderground86TileMap(intro,'ug85-intro-map');
      }
      if(typeof window.buildUnderground86TileMap==='function'){
        document.querySelectorAll('#setupModal .stage-panel').forEach(p=>{
          window.buildUnderground86TileMap(p,'ug85-team-map');
        });
      }
    }else if(themeId==='underwater'){
      if(typeof window.refreshUnderwaterV50==='function'){
        window.refreshUnderwaterV50();
      }
    }else if(themeId==='castle'){
      if(typeof window.refreshCastleIntro66==='function'){
        window.refreshCastleIntro66();
      }
      if(typeof window.refreshCastleTeamStageV65==='function'){
        window.refreshCastleTeamStageV65();
      }
    }
  }

  function rasterAfterThemeBuild(){
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        if(typeof window.applyNativeCanvasWorldsV97==='function'){
          window.applyNativeCanvasWorldsV97();
        }
      });
    });
  }

  /* Replace only the TEST button handler. Random boot/applyTheme behavior stays intact. */
  window.selectThemeForTest=function(event,themeId){
    event?.preventDefault?.();
    event?.stopPropagation?.();

    const theme=(typeof THEMES!=='undefined') ? THEMES[themeId] : null;
    if(!theme)return;

    const shouldResume=!isMuted;
    stopBGM();

    // v1.00.238 — retained fix: pressing a THEME TEST button means "start that scene again".
    // Keep ordinary resize/reflow rebuilds phase-preserving, but explicitly reset
    // Underwater actors and the exact TEAM scroll loop for this user action.
    if(themeId==='underwater' && typeof window.resetUnderwaterMotionV237==='function'){
      window.resetUnderwaterMotionV237();
    }
    if(typeof window.resetExactTeamLoopV237==='function'){
      window.resetExactTeamLoopV237();
    }

    /* Remove previous-theme raster/map before the body theme changes so there
       is no one-frame stale world visible underneath/above the new one. */
    purgeForeignTestStageLayers();

    applyTheme(themeId,'classic');
    bgmPlaybackRate=1;

    /* applyTheme refreshes generic actors/assets; now explicitly rebuild only
       the requested world's stage implementation. */
    rebuildRequestedTheme(themeId);
    rasterAfterThemeBuild();

    /* Async builders used by Underwater/Castle get one final deterministic pass. */
    setTimeout(()=>{
      if(document.body?.dataset?.theme!==themeId)return;
      rebuildRequestedTheme(themeId);
      rasterAfterThemeBuild();
    },100);

    if(shouldResume)setTimeout(()=>{
      if(document.body?.dataset?.theme===themeId)startBGM();
    },45);
  };

  window.purgeForeignThemeTestLayersV98=purgeForeignTestStageLayers;
  window.rebuildRequestedThemeV98=rebuildRequestedTheme;
})();
</script>

      img.onload=()=>resolve(img);
      img.onerror=reject;
      img.src=src;
    });
  }

  async function composeCanvas(srcs,cols,rows,className){
    const canvas=document.createElement('canvas');
    canvas.className=className;
    canvas.width=cols*16;
    canvas.height=rows*16;

    const ctx=canvas.getContext('2d',{alpha:true});
    ctx.imageSmoothingEnabled=false;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const imgs=await Promise.all(srcs.map(loadImage));
    imgs.forEach((img,i)=>{
      const col=i%cols;
      const row=Math.floor(i/cols);
      ctx.drawImage(img,col*16,row*16,16,16);
    });
    // v1.00.245 — remove the opaque sky matte carried by cloud/bush tiles.
    try{
      const image=ctx.getImageData(0,0,canvas.width,canvas.height);
      const d=image.data;
      const keyR=d[0], keyG=d[1], keyB=d[2], keyA=d[3];
      if(keyA>0){
        for(let i=0;i<d.length;i+=4){
          if(d[i]===keyR && d[i+1]===keyG && d[i+2]===keyB) d[i+3]=0;
        }
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.putImageData(image,0,0);
      }
    }catch(_){}
    return canvas;
  }

  async function buildSoloOverworldSceneryV102(){
    const host=document.getElementById('soloDecorLeft');
    if(!host)return;

    host.querySelectorAll(':scope > .solo-ow101-scenery, :scope > .solo-ow102-scenery')
      .forEach(el=>el.remove());

    const layer=document.createElement('div');
    layer.className='solo-ow102-scenery';

    try{
      const [cloudCanvas,bushCanvas]=await Promise.all([
        composeCanvas(CLOUD,3,2,'solo-ow102-cloud'),
        composeCanvas(BUSH,3,1,'solo-ow102-bush')
      ]);
      layer.append(cloudCanvas,bushCanvas);
      host.appendChild(layer);
    }catch(err){
      console.warn('[v1.00.102] SOLO Overworld scenery composition failed',err);
    }
  }

  window.buildSoloOverworldSceneryV102=buildSoloOverworldSceneryV102;

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>{
      requestAnimationFrame(buildSoloOverworldSceneryV102);
    },{once:true});
  }else{
    requestAnimationFrame(buildSoloOverworldSceneryV102);
  }
})();
</script>

<script>
/* =========================================================
   v1.00.104 — replace only the Castle map builder.
   Logical map: 43 cols x 15 rows, native raster: 688 x 240.
   Existing intro/team actor code continues to read _castle69 metadata.
   ========================================================= */
(function(){
  const COLS=65;
  const ROWS=15;
  const FLOOR_ROW=11;

  /* v111: restore roughly half of the width removed in v110.
     Keep old cols 21..85, so the RIGHT side remains unchanged and
     22 native 16px columns (352px) are restored on the LEFT. */
  const CROP_LEFT=21;
  const BRIDGE_START=56-CROP_LEFT;       // 35
  const BRIDGE_END=78-CROP_LEFT;         // 57
  const RAISED_WALL_START=82-CROP_LEFT;  // 61

  function tile(layer,col,row,type,tilePx,z){
    if(col<0 || col>=COLS || row<0 || row>=ROWS)return null;
    const d=document.createElement('div');
    d.className='castle69-tile castle70-'+type;
    d.style.left=(col*tilePx)+'px';
    d.style.top=(row*tilePx)+'px';
    d.style.width=tilePx+'px';
    d.style.height=tilePx+'px';
    d.style.zIndex=String(z==null?1:z);

    if(type==='bridge') d.style.backgroundImage=`url("${CASTLE69_BRIDGE_TILE}")`;
    else if(type==='lava') d.style.backgroundImage=`url("${CASTLE69_LAVA_TILE}")`;
    else if(type==='lavafill') d.style.backgroundColor='#D82800';
    else if(type==='chain') d.style.backgroundImage=`url("${CASTLE70_CHAIN_TILE}")`;
    else if(type==='axe') d.style.backgroundImage=`url("${CASTLE70_AXE_TILE}")`;
    else d.style.backgroundImage=`url("${CASTLE69_BRICK_TILE}")`;

    layer.appendChild(d);
    return d;
  }

  window.buildCastle69TileMap=function(host,extraClass){
    if(!host)return null;

    /* Exact 15-row display scale. v97 then converts this back to 16px native
       coordinates, producing an exact 43*16 x 15*16 = 688x240 canvas. */
    const tilePx=16;

    const map=document.createElement('div');
    map.className='castle69-map castle104-map '+(extraClass||'');
    map.style.setProperty('--castle69-tile',tilePx+'px');
    map.style.width=(COLS*tilePx)+'px';
    map.style.height=(ROWS*tilePx)+'px';
    map.style.background='#000';

    /* ===== Ceiling =====
       Crop old 21..85 into new 0..64.
       Old hanging section 34..42 -> new 13..21.
       Old hanging section 74..85 -> new 53..64. */
    for(let c=0;c<COLS;c++){
      tile(map,c,2,'brick',tilePx,1);
      tile(map,c,3,'brick',tilePx,1);
    }
    for(let c=13;c<=21;c++) tile(map,c,4,'brick',tilePx,1);
    for(let c=53;c<COLS;c++) tile(map,c,4,'brick',tilePx,1);

    /* ===== Approach floor =====
       v108: after raising the floor, fill every row beneath it so no
       empty black band remains under the left-side castle floor. */
    for(let c=0;c<BRIDGE_START;c++){
      for(let r=FLOOR_ROW;r<ROWS;r++){
        tile(map,c,r,'brick',tilePx,1);
      }
    }

    /* ===== v109 Bridge + lava =====
       Convert the LEFTMOST FIVE former bridge cells to solid castle wall.
       This makes cols BRIDGE_START..BRIDGE_START+4 full wall from row 11 down. */
    const BRIDGE_VISUAL_START=BRIDGE_START+5;
    for(let c=BRIDGE_START;c<BRIDGE_VISUAL_START;c++){
      for(let r=FLOOR_ROW;r<ROWS;r++){
        tile(map,c,r,'brick',tilePx,3);
      }
    }

    /* Remaining bridge starts five cells farther right.
       Lava below it fills BOTH remaining rows (13 and 14) in red. */
    for(let c=BRIDGE_VISUAL_START;c<=BRIDGE_END;c++){
      tile(map,c,FLOOR_ROW,'bridge',tilePx,4);
      tile(map,c,FLOOR_ROW+2,'lava',tilePx,2);
      tile(map,c,FLOOR_ROW+3,'lavafill',tilePx,2);
    }

    /* v109: move chain and axe EXACTLY one tile left from v108. */
    tile(map,BRIDGE_END,FLOOR_ROW-1,'chain',tilePx,5);
    tile(map,BRIDGE_END+1,FLOOR_ROW-2,'axe',tilePx,6);

    /* Rear raised wall. */
    for(let c=RAISED_WALL_START;c<COLS;c++){
      for(let r=FLOOR_ROW-1;r<ROWS;r++){
        tile(map,c,r,'brick',tilePx,1);
      }
    }

    /* Fill THREE columns beginning at the OLD chain position:
       old chain column = BRIDGE_END+1, then +2 and +3.
       Start at row 10 so these columns join the raised rear wall cleanly.
       New axe at BRIDGE_END+1 stays visible because its z-index is higher. */
    for(let c=BRIDGE_END+1;c<=BRIDGE_END+3;c++){
      for(let r=FLOOR_ROW-1;r<ROWS;r++){
        tile(map,c,r,'brick',tilePx,1);
      }
    }

    map._castle69={
      cols:COLS,
      rows:ROWS,
      floorRow:FLOOR_ROW,
      bridgeStart:BRIDGE_START+5,
      bridgeEnd:BRIDGE_END,
      raisedWallStart:RAISED_WALL_START,
      tilePx:tilePx,
      nativeTilePx:16,
      nativeWidth:1040,
      nativeHeight:240,
      version:'v111-65x15-left-restored'
    };
    return map;
  };
})();
</script>

   Do not infer the floor from the host height: measure the Castle map itself. */
(function(){

  function alignCastleIntroMarioV107(){
    if(!document.body || document.body.dataset.theme!=='castle')return;

<script>
/* =========================================================
   v1.00.111 — CASTLE INTRO FIRE
   The projectile is launched by the SAME event that accompanies the
   already-existing Bowser fire SFX. No independent random timer is added.
   ========================================================= */
(function(){
  const fires=new Set();
  let raf=0;
  let last=0;

  function introIsVisible(){
    const intro=document.getElementById('introOverlay');
    if(!intro || document.body?.dataset?.theme!=='castle') return false;
    const cs=getComputedStyle(intro);
    return cs.display!=='none' && cs.visibility!=='hidden' && parseFloat(cs.opacity||'1')>0.01;
  }

  function clear(){
    fires.forEach(p=>p.el?.remove());
    fires.clear();
    if(raf){ cancelAnimationFrame(raf); raf=0; }
    last=0;
  }

  function tick(now){
    if(!introIsVisible()){
      clear();
      return;
    }
    const dt=Math.min(.05,Math.max(0,(now-(last||now))/1000));
    last=now;

    for(const p of [...fires]){
      p.x-=p.speed*dt;

      if(now-p.frameAt>=95){
        p.frame=1-p.frame;
        p.frameAt=now;
        p.el.src=BOWSER_FIRE_FRAMES[p.frame];
      }

      p.el.style.transform=`translate3d(${p.x}px,${p.y}px,0)`;

      if(p.x < -p.width-8){
        p.el.remove();
        fires.delete(p);
      }
    }

    if(fires.size) raf=requestAnimationFrame(tick);
    else { raf=0; last=0; }
  }

  function spawn(){
    if(!introIsVisible() || !BOWSER_FIRE_FRAMES || BOWSER_FIRE_FRAMES.length<2) return;

    const host=document.getElementById('introStageBg');
    if(!host || host.clientWidth<20 || host.clientHeight<20) return;

    const hostRect=host.getBoundingClientRect();
    const board=document.querySelector('#introOverlay .nes-title-board');
    const boardRect=board?.getBoundingClientRect();

    /* v112: derive scale from the ACTUALLY RENDERED Castle map, not merely
       from introStageBg.clientHeight. This includes the map's CSS transform. */
    const castleMap=host.querySelector('.castle69-map');
    const mapRect=castleMap?.getBoundingClientRect();
    const visualScale=(mapRect && mapRect.height>1)
      ? (mapRect.height/240)
      : ((host.getBoundingClientRect().height||240)/240);
    const tile=16*visualScale;
    const floorTop=11*tile;

    const img=document.createElement('img');
    img.className='castle111-intro-fire';
    img.src=BOWSER_FIRE_FRAMES[0];
    img.alt='';
    img.setAttribute('aria-hidden','true');

    /* Native Bowser fire frames are 24x9 px.
       Scale them by the exact rendered Castle-map multiplier. */
    const fireW=Math.max(24,24*visualScale);
    const fireH=Math.max(9,9*visualScale);

    /* v113: v111 CSS has width:auto/height:auto !important.
       Ordinary inline width/height therefore lost the cascade.
       Apply the calculated rendered-map size as IMPORTANT inline values. */
    img.style.setProperty('width',fireW+'px','important');
    img.style.setProperty('height',fireH+'px','important');

    host.appendChild(img);

    /* Bowser-mouth-like height, but never visually over the title sign:
       title board has z-index 8 while fire is z-index 4, and when there is
       enough room we keep the projectile physically below the board too. */
    let y=floorTop - fireH - Math.max(6,tile*.55);
    if(boardRect){
      const boardBottom=boardRect.bottom-hostRect.top;
      const belowBoard=boardBottom+Math.max(6,tile*.35);
      const maxY=floorTop-fireH-2;
      if(belowBoard<=maxY) y=Math.max(y,belowBoard);
    }
    y=Math.max(0,Math.min(y,host.clientHeight-fireH));

    const p={
      el:img,
      x:host.clientWidth+fireW*.15,
      y,
      width:fireW,
      speed:Math.max(190,host.clientWidth*.22),
      frame:0,
      frameAt:performance.now()
    };
    img.style.transform=`translate3d(${p.x}px,${p.y}px,0)`;
    fires.add(p);

    if(!raf){
      last=0;
      raf=requestAnimationFrame(tick);
    }
  }

  window.spawnCastleIntroFireV111=spawn;
  window.addEventListener('castleBowserFireSfxV111',spawn);

  /* Theme/intro exit cleanup. */
  const observe=()=>{
    if(!document.body)return;
    new MutationObserver(()=>{
      if(document.body.dataset.theme!=='castle') clear();
    }).observe(document.body,{attributes:true,attributeFilter:['data-theme']});
  };
  if(document.body) observe();
  else document.addEventListener('DOMContentLoaded',observe,{once:true});

  window.addEventListener('beforeunload',clear);
})();
</script>

<script>

  function scaleMap(host,map){
    if(!host||!map)return;
    const h=host.clientHeight||NATIVE_H;
    const scale=h/NATIVE_H;
    map.style.transform=`scale(${scale})`;
    host.style.setProperty('--ow83-tile-px',(TILE*scale)+'px');

  function makeQuestion(c,r){
    const box=document.createElement('div');
    box.className='ow2-v127-q';
    box.style.left=(c*TILE)+'px';

    const frames=(typeof EMBEDDED_PIXEL_ASSETS!=='undefined')

      : [];

    const f1=document.createElement('img');
    const f2=document.createElement('img');

    f1.setAttribute('aria-hidden','true');
    f2.setAttribute('aria-hidden','true');
    f3.setAttribute('aria-hidden','true');

    if(frames[0])f1.src=frames[0];
    if(frames[1])f2.src=frames[1];
    if(frames[2])f3.src=frames[2];

    box.append(f1,f2,f3);
    return box;
  }

  function build(host,extraClass){
    if(!host)return null;

    host.querySelectorAll(':scope > .ow2-v127-map').forEach(x=>x.remove());

    if(!isPart2())return null;

    const map=document.createElement('div');
    map.className='ow2-v127-map '+(extraClass||'');
    map.style.backgroundImage=`url("${OW2_MAP_COMPOSITE_V255}")`;

    /* v1.00.258 — Killer owns a real native 16x16 tile slot INSIDE every
       688x240 OW2 map, exactly like the other map-space objects.
       NES_KILLER_IMG itself is 16x14, so keep the artwork undistorted inside
       a 16x16 transparent tile box instead of stretching it. */
    const killerSlot258=document.createElement('div');
    killerSlot258.className='ow2-killer-tile258';
    killerSlot258.setAttribute('aria-hidden','true');
    killerSlot258.style.cssText=[
      'position:absolute',
      'left:592px',
      'top:144px',
      'width:16px',
      'height:16px',
      'display:none',
      'pointer-events:none',
      'z-index:8',

    ].join(';');

    killerSprite258.src=NES_KILLER_IMG;
    killerSprite258.alt='';
    killerSprite258.setAttribute('aria-hidden','true');
    killerSprite258.style.cssText=[
      'position:absolute',
      'left:0',
      'top:1px',
      'width:16px',
      'height:14px',
      'max-width:none',
      'max-height:none',
      'image-rendering:pixelated',
      'pointer-events:none'
    ].join(';');
    killerSlot258.appendChild(killerSprite258);
    map.appendChild(killerSlot258);

    Q_POS.forEach(([c,r])=>map.appendChild(makeQuestion(c,r)));

    host.insertBefore(map,host.firstChild);
    scaleMap(host,map);

    map._ow2v127={
      cols:COLS,
      rows:ROWS,
      floorRow:FLOOR_ROW,
      tile:TILE,
      nativeW:NATIVE_W,
      nativeH:NATIVE_H
    };

    return map;
  }

  function refresh(){
    if(!isPart2()){
      document.querySelectorAll('.ow2-v127-map').forEach(x=>x.remove());
      return;

    const intro=document.getElementById('introStageBg');
    if(intro)build(intro,'ow2-v127-intro-map');

    document.querySelectorAll('#setupModal .stage-panel')
      .forEach(p=>build(p,'ow2-v127-team-map'));

  function rescale(){
    if(!isPart2())return;
    document.querySelectorAll('.ow2-v127-map')
      .forEach(map=>scaleMap(map.parentElement,map));
  }

  function paintQuestions(){
    if(isPart2() && typeof getQuestionCoinPulse124==='function'){
      const pulse=getQuestionCoinPulse124();

      document.querySelectorAll('.ow2-v127-q').forEach(box=>{
        const f1=box.querySelector(':scope > .ow2-v127-q-base');
        const f2=box.querySelector(':scope > .ow2-v127-q-2');
        const f3=box.querySelector(':scope > .ow2-v127-q-3');

        if(f1)f1.style.opacity='1';
        if(f2)f2.style.opacity=pulse.frame===1 ? String(pulse.opacity) : '0';
        if(f3)f3.style.opacity=pulse.frame===2 ? String(pulse.opacity) : '0';
      });
    }
    requestAnimationFrame(paintQuestions);
  }

  // Rebuild after the normal Overworld init has run, so Part 2 wins only at map level.
  const oldIntro=window.initIntroStage;
  if(typeof oldIntro==='function'){
    window.initIntroStage=function(){
      const result=oldIntro.apply(this,arguments);
      requestAnimationFrame(refresh);
      return result;
    };
  }

  const oldTeam=window.initTeamSelectStage;
  if(typeof oldTeam==='function'){
    window.initTeamSelectStage=function(){
      const result=oldTeam.apply(this,arguments);
      requestAnimationFrame(refresh);
      return result;
    };
  }

  window.buildOverworldPart2V127=build;
  window.refreshOverworldPart2V127=refresh;
  window.OVERWORLD_PART2_V127={
    cols:COLS,rows:ROWS,floorRow:FLOOR_ROW,tile:TILE,nativeW:NATIVE_W,nativeH:NATIVE_H
  };

  window.addEventListener('load',()=>setTimeout(refresh,180));
  window.addEventListener('resize',()=>requestAnimationFrame(rescale),{passive:true});
  window.addEventListener('orientationchange',()=>requestAnimationFrame(rescale),{passive:true});
  document.addEventListener('DOMContentLoaded',()=>setTimeout(refresh,80),{once:true});

  const observe=()=>{
    if(!document.body)return;
    let timer=0;
    new MutationObserver(()=>{
      clearTimeout(timer);
      timer=setTimeout(refresh,35);
    }).observe(document.body,{
      subtree:true,
      childList:true,
      attributes:true,
      attributeFilter:['data-theme','data-stage-variant']
    });
  };

  if(document.body)observe();
  else document.addEventListener('DOMContentLoaded',observe,{once:true});

  requestAnimationFrame(paintQuestions);
})();
</script>

<script>
(function(){
  function isOw2(){
    return document.body?.dataset?.theme==='overworld' &&
           document.body?.dataset?.stageVariant==='part2';
  }

  function normalizeOw2TeamLoop133(){
    if(!isOw2()) return;

    const stage=document.querySelector('#setupModal .team-stage-window');
    const track=document.querySelector('#setupModal .stage-scroll-track');
    if(!stage || !track) return;

    const panels=[...track.querySelectorAll(':scope > .stage-panel')];
    if(!panels.length) return;

    // Part-2 native world is exactly 688x240.
    // It is displayed from stage height, so calculate the actual rendered width
    // from that same scale and use it as the physical panel/loop distance.
    const stageH=stage.clientHeight || panels[0].clientHeight || 240;
    const scale=stageH/240;
    const mapW=688*scale;

    track.style.setProperty('width',(mapW*panels.length)+'px','important');
    track.style.setProperty('--ow2-loop-shift-133',(-mapW)+'px');

    panels.forEach(panel=>{
      panel.style.setProperty('flex','0 0 '+mapW+'px','important');
      panel.style.setProperty('width',mapW+'px','important');
      panel.style.setProperty('min-width',mapW+'px','important');
      panel.style.setProperty('max-width',mapW+'px','important');

      const map=panel.querySelector(':scope > .ow2-v127-map');
      if(map){
        // Same scale used by the existing v127 map renderer.
        map.style.setProperty('transform','scale('+scale+')','important');
        map.style.setProperty('transform-origin','0 0','important');
      }
    });
  }

  function schedule(){
    requestAnimationFrame(()=>{
      requestAnimationFrame(normalizeOw2TeamLoop133);
    });
  }

  const oldRefresh=window.refreshOverworldPart2V127;
  if(typeof oldRefresh==='function'){
    window.refreshOverworldPart2V127=function(){
      const r=oldRefresh.apply(this,arguments);
      schedule();
      return r;
    };
  }

  const oldTeam=window.initTeamSelectStage;
  if(typeof oldTeam==='function'){
    window.initTeamSelectStage=function(){
      const r=oldTeam.apply(this,arguments);
      schedule();
      return r;
    };
  }

  window.normalizeOw2TeamLoop133=normalizeOw2TeamLoop133;

  window.addEventListener('load',()=>setTimeout(schedule,180));
  window.addEventListener('resize',schedule,{passive:true});
  window.addEventListener('orientationchange',schedule,{passive:true});

  const observe=()=>{
    if(!document.body)return;
    new MutationObserver(schedule).observe(document.body,{
      attributes:true,
      attributeFilter:['data-theme','data-stage-variant'],
      childList:true,
      subtree:true
    });
  };
  if(document.body)observe();
  else document.addEventListener('DOMContentLoaded',observe,{once:true});
})();
</script>

<script>
(function(){
  /* =========================================================
     v1.00.258 — OVERWORLD2 KILLER: TRUE NATIVE MAP PHASE
     ---------------------------------------------------------
     v256/v257 still treated Killer as a separately projected screen object.
     That is why it could lose phase when the browser moved between monitors.

     v258 rule:
     - Every OW2 688x240 map owns a permanent 16x16 Killer TILE slot.
     - The visible Killer is rendered only by moving that tile slot in native
       map coordinates. No stage-pixel left/top, no cached monitor scale.
     - Sprite artwork is 16x14, centered inside the 16x16 native tile box.
     - Spawn tile = (37,9) => native (592,144), exact 16px grid.
     - During flight, only native X changes. Native Y never leaves row 9.
     - On any viewport/helper-panel rebuild we re-select the repeated world copy
       whose CURRENT projected Killer position is nearest the last visible one.
       The flight state itself contains no DOM node and survives map replacement.
     - New launches are allowed only when the cannon/Killer spawn tile is
       actually visible in the CURRENT stage.
     - Exit is decided from the CURRENT map projection crossing CURRENT stage left.
     ========================================================= */

  const NATIVE_W=688;
  const NATIVE_H=240;
  const TILE=16;
  const SPAWN_X=37*TILE; // 592
  const SPAWN_Y=9*TILE;  // 144
  const EXTRA_NATIVE_SPEED=NATIVE_W/15; // map 1x + projectile 1x = visible ~2x

  let launchTimer=0;
  let flightRaf=0;
  let flight=null;

  function isOw2(){
    return document.body?.dataset?.theme==='overworld' &&
           document.body?.dataset?.stageVariant==='part2';
  }
  function setupActive(){
    return !!document.getElementById('setupModal')?.classList.contains('active');
  }
  function stage(){
    return document.querySelector('#setupModal .team-stage-window');
  }

  function hideLegacy(){
    const old=document.getElementById('flyingKiller');
    if(!old)return;
    old.style.setProperty('opacity','0','important');
    old.style.setProperty('visibility','hidden','important');
  }

  function mapInfos(){
    const s=stage();
    if(!s)return [];
    return [...s.querySelectorAll('.ow2-v127-map')].map((map,index)=>{
      const r=map.getBoundingClientRect();
      if(!(r.width>1 && r.height>1))return null;
      return {
        map,index,r,

    })).filter(o=>
      o.p.left>=sr.left-0.5 &&
      o.p.left+o.p.width<=sr.right+0.5 &&
      o.p.top>=sr.top-0.5 &&
      o.p.top+o.p.height<=sr.bottom+0.5
    );

    if(!candidates.length)return null;
    candidates.sort((a,b)=>b.p.left-a.p.left);
    return candidates[0].info;

    const infos=mapInfos();

        Math.abs(projectedRect(a,nativeX).left-lastScreenX) -
        Math.abs(projectedRect(b,nativeX).left-lastScreenX)
      );
      return infos[0];
    }

    return rightmostVisibleSpawn() || infos[0];

    }

    if(!launchWorld){
      // Geometry is currently between monitors/rebuild states. Do not create
      // a projectile from an off-screen or stale cannon.
      scheduleLaunch(180);
      return;
    }

    hideAllSlots();
    hideLegacy();

    const first=projectedRect(launchWorld,SPAWN_X);
    flight={
      nativeX:SPAWN_X,
      lastNow:performance.now(),
      lastScreenX:first.left

    }

      flightRaf=0;
      if(!flight || !isOw2() || !setupActive()){

        return;
      }

      const s=stage();
      if(!s){
        stopFlight(false);
        return;
      }
      const sr=s.getBoundingClientRect();

         Never calculate a rendered px speed and never cache monitor scale. */
      const dt=Math.min(0.05,Math.max(0,(now-flight.lastNow)/1000));
      flight.lastNow=now;
      flight.nativeX-=EXTRA_NATIVE_SPEED*dt;

      const world=chooseCurrentWorld(flight.nativeX,flight.lastScreenX);
      if(!world){
        // During the tiny helper-panel rebuild gap, keep the flight state alive.
        hideAllSlots();
        flightRaf=requestAnimationFrame(frame);
        return;
      }

      const p=projectedRect(world,flight.nativeX);

      hideAllSlots();

      /* The actual element lives INSIDE the native 688x240 map.
         left/top/size therefore use native values only. */
      world.slot.style.setProperty('left',flight.nativeX+'px','important');
      world.slot.style.setProperty('top',SPAWN_Y+'px','important');
      world.slot.style.setProperty('width',TILE+'px','important');
      world.slot.style.setProperty('height',TILE+'px','important');
      world.slot.style.setProperty('display','block','important');

      flight.lastScreenX=p.left;

      // Only CURRENT stage + CURRENT map geometry may terminate the flight.
      if(p.left+p.width<=sr.left){
        stopFlight(true);
        return;
      }

      flightRaf=requestAnimationFrame(frame);
    };

    flightRaf=requestAnimationFrame(frame);
  }

  function ensure(){
    hideLegacy();

    if(!isOw2() || !setupActive()){
      stopAll();
      return;
    }

    /* A map rebuild may replace every slot. Flight state is intentionally kept;
       next RAF simply selects the matching new map copy and continues. */
    if(!flight && !launchTimer)scheduleLaunch(900);
  }

  const oldRefresh=window.refreshOverworldPart2V127;
  if(typeof oldRefresh==='function'){
    window.refreshOverworldPart2V127=function(){

  window.addEventListener('orientationchange',()=>requestAnimationFrame(ensure),{passive:true});
  if(window.visualViewport){

  }

  if(setup){

  window.addEventListener('load',()=>setTimeout(ensure,220));
})();

<script>
/* =========================================================

   - One loop unit is always one complete 688x240 native world.
   - Viewport width never decides where a world is cut.
   - Enough whole-world copies are kept to cover the viewport + next loop step.
   - One continuous rAF timebase moves exactly one rendered native-world width
     every 15 seconds, so the wrap lands on identical pixels.

   Stable Overworld Classic / Castle remain untouched.
   v259 adds Underground to the same exact 688x240 world-loop geometry so its
   loop boundary is never derived from viewport width after monitor changes.
   v261 prebuilt Underground coverage in the resize event itself.
   v262 removes the remaining transient gap: Underground helper worlds are now

(function(){
  const NATIVE_W=688;
  const NATIVE_H=240;
  const LOOP_MS=15000;
  const S={raf:0,start:0,key:'',distance:0,settle:0,prepRaf:0};

  function modeKey(){
    const b=document.body;
    if(!b)return '';
    if(b.dataset.theme==='overworld' && b.dataset.stageVariant==='part2')return 'ow2';

    // Its authored 688x240 map was previously left on the legacy CSS loop,
    // which could briefly expose the right edge before the next world painted.
    if(b.dataset.theme==='overworld')return 'ow1';
    if(b.dataset.theme==='underground')return 'ug';
    if(b.dataset.theme==='underwater')return 'uw';

  function setupActive(){
    const setup=document.getElementById('setupModal');

  function roots(){
    const stage=document.querySelector('#setupModal .team-stage-window');
    const track=stage?.querySelector(':scope > .stage-scroll-track');

  }

  function phase(now){
    if(!S.start)return 0;
    return (((now-S.start)%LOOP_MS)+LOOP_MS)%LOOP_MS/LOOP_MS;
  }

  function clearHelperClones(track){
    track.querySelectorAll(':scope > .stage-panel[data-v230-panel="1"],:scope > .stage-panel[data-v233-panel="1"]')
      .forEach(x=>x.remove());

  /* v1.00.263 — Underground retained-helper lifecycle cleanup.
     v262 intentionally keeps helper worlds alive throughout an ACTIVE TEAM screen
     so monitor-transfer seams can never expose the end of the track. They should
     not, however, survive after Underground exact-loop ownership ends. */

    if(!track)return;

    clearHelperClones(track);

    /* Restore the authored two panels to CSS ownership. This is important when
       changing from Underground to a non-exact-loop theme such as Classic. */
    track.querySelectorAll(':scope > .stage-panel').forEach(panel=>{
      panel.style.removeProperty('flex');
      panel.style.removeProperty('width');
      panel.style.removeProperty('min-width');
      panel.style.removeProperty('max-width');

      const map=panel.querySelector(':scope > .ug85-map');
      if(map){
        map.style.removeProperty('width');
        map.style.removeProperty('height');
        map.style.removeProperty('transform');
        map.style.removeProperty('transform-origin');
      }
    });

    track.style.removeProperty('min-width');
    track.style.removeProperty('max-width');

    const h=stage.clientHeight||NATIVE_H;
    const scale=h/NATIVE_H;
    const worldW=NATIVE_W*scale;
    if(!(worldW>1))return 0;

    /* v1.00.262 — Underground seam-transfer guard.
       Do NOT delete helper worlds first during a monitor/viewport resize.
       The old v259/v261 path removed the currently visible right-side helper
       before the replacement coverage was ready. If the seam was on-screen,
       Chromium could briefly composite that empty edge during monitor transfer.

       For Underground, retain existing helper panels, resize them in place,
       append any extra worlds needed for the destination viewport, and never
       shrink the helper pool during the active TEAM screen. This guarantees
       continuous coverage across the resize paint boundary. Other exact-loop
       themes keep their proven clear/rebuild behavior. */

    // solved Underground path: never delete the right-side safety worlds while
    // the TEAM selector is visible. This prevents a one-frame empty edge.
    if(key!=='ug' && key!=='ow1') clearHelperClones(track);

    let originals=[...track.querySelectorAll(':scope > .stage-panel')];
    if(!originals.length)return 0;

    if(key==='ug'){

         are valid repeat worlds and should participate in the resize pass. */
      originals=originals.filter(panel=>!panel.dataset.v230Panel);
    }

    originals.forEach(panel=>{
      panel.style.setProperty('flex','0 0 '+worldW+'px','important');
      panel.style.setProperty('width',worldW+'px','important');
      panel.style.setProperty('min-width',worldW+'px','important');
      panel.style.setProperty('max-width',worldW+'px','important');

      if(key==='ow2'){
        const map=panel.querySelector(':scope > .ow2-v127-map');
        if(map){
          map.style.setProperty('width',NATIVE_W+'px','important');
          map.style.setProperty('height',NATIVE_H+'px','important');
          map.style.setProperty('transform','scale('+scale+')','important');
          map.style.setProperty('transform-origin','0 0','important');
          map.style.setProperty('background-repeat','no-repeat','important');
          map.style.setProperty('background-size',NATIVE_W+'px '+NATIVE_H+'px','important');

        }
      }
    });

    // Keep enough complete copies for: current loop step + viewport + one spare.

    /* Underground gets two additional complete worlds of safety coverage.
       This is intentionally based on WORLD count, not viewport pixels. During
       cross-monitor movement the destination viewport/scale may arrive over
       several resize events; keeping spare complete worlds means the visible
       seam never reaches an unrendered track edge between those events. */
    if(key==='ug') need=Math.max(need,6);
    if(key==='ow1') need=Math.max(need,4);

    const seed=originals[0];
    let total=originals.length;
    while(total<need){
      const cl=seed.cloneNode(true);
      cl.dataset.v233Panel='1';
      cl.style.setProperty('flex','0 0 '+worldW+'px','important');
      cl.style.setProperty('width',worldW+'px','important');
      cl.style.setProperty('min-width',worldW+'px','important');
      cl.style.setProperty('max-width',worldW+'px','important');
      track.appendChild(cl);
      originals.push(cl);
      total++;
    }

    /* Resize EVERY retained Underground world, including old helpers. */
    if(key==='ug' || key==='ow1'){
      [...track.querySelectorAll(':scope > .stage-panel')].forEach(panel=>{
        panel.style.setProperty('flex','0 0 '+worldW+'px','important');
        panel.style.setProperty('width',worldW+'px','important');
        panel.style.setProperty('min-width',worldW+'px','important');
        panel.style.setProperty('max-width',worldW+'px','important');
      });
      total=track.querySelectorAll(':scope > .stage-panel').length;
    }

    track.style.setProperty('width',(worldW*total)+'px','important');
    track.style.setProperty('min-width',(worldW*total)+'px','important');
    track.style.setProperty('max-width','none','important');
    track.style.setProperty('animation','none','important');
    track.style.setProperty('will-change','transform');

    if(key==='ow2'){

      // also decorates any original panel rebuilt immediately before this pass.
      if(typeof window.refreshOverworldPart2PropsV134==='function'){

      }

      // Underground's .ug85-map and Underwater's native canvas both therefore
      // share the same world boundary as the scrolling panel itself.
      if(key==='ug'){
        track.querySelectorAll(':scope > .stage-panel > .ug85-map').forEach(map=>{
          map.style.setProperty('width',NATIVE_W+'px','important');
          map.style.setProperty('height',NATIVE_H+'px','important');
          map.style.setProperty('transform','scale('+scale+')','important');
          map.style.setProperty('transform-origin','0 0','important');
        });
      }

      // canvas-backed layers and harmless for native-tile Underground maps.
      if(typeof window.applyNativeCanvasWorldsV97==='function'){
        try{window.applyNativeCanvasWorldsV97();}catch(_){ }
      }
    }

  }

    const {stage,track}=roots();

    return true;
  }

  function stop(clearInline){
    const stoppedKey=S.key;

    if(S.raf)cancelAnimationFrame(S.raf);
    S.raf=0;
    if(S.prepRaf)cancelAnimationFrame(S.prepRaf);
    S.prepRaf=0;
    clearTimeout(S.settle);

    const {track}=roots();
    if(clearInline && track){
      track.style.removeProperty('animation');
      track.style.removeProperty('transform');
      track.style.removeProperty('will-change');
    }

    /* v1.00.263 — v262's retained Underground helper worlds are session-local.
       Remove them only when leaving/stopping Underground, never during resize.
       This preserves the solved seam behavior while preventing retained clones
       or native-width inline geometry from leaking into later TEAM/theme visits. */
    if(stoppedKey==='ug' && track){
      cleanupUndergroundHelpers263(track);
    }
    if(stoppedKey==='ow1' && track){
      clearHelperClones(track);
      track.querySelectorAll(':scope > .stage-panel').forEach(panel=>{
        panel.style.removeProperty('flex');
        panel.style.removeProperty('width');
        panel.style.removeProperty('min-width');
        panel.style.removeProperty('max-width');
      });
      track.style.removeProperty('width');
      track.style.removeProperty('min-width');
      track.style.removeProperty('max-width');
    }

    S.start=0; S.key=''; S.distance=0;
  }

  function tick(now){
    S.raf=0;
    const key=modeKey();
    const {track}=roots();
    if(!key || key!==S.key || !setupActive() || !track || !(S.distance>1)){
      stop(true);
      return;
    }

    const p=phase(now);
    track.style.setProperty('transform','translate3d('+(-p*S.distance)+'px,0,0)','important');
    S.raf=requestAnimationFrame(tick);
  }

  function start(preserve){
    if(!prepare(!!preserve))return;
    if(S.raf)cancelAnimationFrame(S.raf);
    S.raf=requestAnimationFrame(tick);
  }

    S.prepRaf=requestAnimationFrame(()=>{

        S.prepRaf=0;
        start(!!preserve);

    // restart an already-running loop from phase 0.

      // layout settles (~140ms). Only the FIRST call may establish phase 0.
      // Any later initializer pass for the same active mode must preserve phase.
      schedule(S.key===modeKey());

        // spare worlds exist before the browser's first TEAM-selector paint.
        if(key==='ow1') start(S.key===key);

  }

    }).observe(document.body,{attributes:true,attributeFilter:['data-theme','data-stage-variant']});
  }

    const key=modeKey();
    if(!setupActive() || !key)return;

    /* v1.00.261 — Underground monitor-transfer first-paint guard.
       When the browser crosses monitors, stage height/scale can change before the
       old helper-world coverage is rebuilt. If the loop seam is currently visible,
       that one paint can expose the end of the old world.

       Rebuild Underground's exact 688x240 world geometry synchronously inside the
       viewport event (phase preserved) so enough whole-world copies exist BEFORE
       the browser gets a chance to paint the new viewport. The normal two-rAF +
       delayed settle still follows for the final geometry. OW2/UW keep their
       proven deferred path unchanged. */
    if(key==='ug'){

      start(true);
    }

    window.visualViewport.addEventListener('resize',onViewport,{passive:true});
  }

  window.getExactTeamLoopStatsV263=function(){

    return {

  // settles. Reset the exact TEAM loop to phase 0 only when explicitly requested.
  window.resetExactTeamLoopV237=function(){
    stop(true);
    if(setupActive() && modeKey()) schedule(false);
  };
})();

  function getSoloStyleSource274(){

  function returnCartridgeToIntro274(){

      if(String(x.grade)!==String(selectedGrade151) || x.subject!==selectedSubject152) return false;
      if(selectedSubject152==='영어') return x.publisher===selectedPublisher154;

  function returnSoloGuideToSetup274(){

  function returnTeamGameToSetup274(){

    try{stopSpecialAudio();}catch(_){}

    try{stopBowserFireAnimation();}catch(_){}

  function representativeCard274(root,selectors){

  function ensureScreenBacks274(){
    const cart=document.getElementById('cartridgeSelectModal');

  function findMixerBox274(mode){
    if(mode==='SOLO') return document.getElementById('soloAudioMixer') || document.getElementById('soloBgmVolume')?.closest('div');
    const input=document.getElementById('teamBgmVolume');
    if(!input) return null;
    let p=input.parentElement;
    for(let i=0;i<4 && p;i++,p=p.parentElement){
      const r=p.getBoundingClientRect();
      if(r.width>120 && r.height>45) return p;
    }
    return input.parentElement;
  }
  function ensureGameBack274(mode){
    const key=mode==='SOLO'?'solo-game':'team-game';
    let btn=btnRegistry.get(key);
    if(!btn || !btn.isConnected){
      btn=document.createElement('button');
      btn.type='button';
      btn.className='smq-back274 game274';
      btn.dataset.smqBack274=key;
      btn.textContent=ARROW;

    const mixer=findMixerBox274(mode);

      ? document.body.classList.contains('solo-game-active')
      : (gameMode==='TEAM' && gameSessionStarted && !document.getElementById('setupModal')?.classList.contains('active'));
    if(!visible || !mixer){btn.style.display='none';return;}

  function refreshNav274(){

  // Existing cartridge toolbar back button: same curved-arrow box language.

  const boot274=()=>{
    decorateLegacyBacks274();
    refreshNav274();

    // v1.00.276 — performance fix.
    // v274 observed the entire document subtree for class mutations and also scanned
    // all navigation UI every 1.5s. Animated game DOM changes can fire hundreds of
    // class mutations, repeatedly invoking querySelectorAll/getComputedStyle/layout.
    // Watch only the handful of elements whose visibility/theme can change navigation.
    let navRaf276=0;
    const scheduleNav276=()=>{
      if(navRaf276) return;
      navRaf276=requestAnimationFrame(()=>{
        navRaf276=0;
        refreshNav274();
      });
    };
    const obs=new MutationObserver(scheduleNav276);
    [
      document.body,
      document.getElementById('cartridgeSelectModal'),
      document.getElementById('setupModal'),
      document.getElementById('soloGuideModal'),
      document.getElementById('modal'),
      document.getElementById('winnerModal'),
      document.getElementById('soloGameOverModal')
    ].filter(Boolean).forEach(el=>{
      obs.observe(el,{attributes:true,attributeFilter:['class','style','data-theme','data-stage-variant']});
    });

    window.addEventListener('resize',scheduleNav276,{passive:true});
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize',scheduleNav276,{passive:true});
      window.visualViewport.addEventListener('scroll',scheduleNav276,{passive:true});
    }
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)scheduleNav276();},{passive:true});
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot274,{once:true}); else boot274();

  // Keep back buttons recolored whenever a theme test/random-theme change occurs.
  window.addEventListener('smq-theme-change274',refreshNav274);
})();

<script>
/* =========================================================
   v1.00.276 — FINAL SOLO AUDIO + UI + CARTRIDGE/NAV POLISH

(function(){
  let soloFinalStretch276=false;
  let soloGameOverMusicPlayed276=false;

  function resetSoloFinalAudio276(){
    soloFinalStretch276=false;
    soloGameOverMusicPlayed276=false;
    if(gameMode==='SOLO') bgmPlaybackRate=1.0;
  }

  function maybeStartSoloFinalStretch276(){
    if(gameMode!=='SOLO' || !soloState.started || soloFinalStretch276) return;
    const total=Array.isArray(soloState.activeQuestions)?soloState.activeQuestions.length:0;
    if(total<=0) return;
    const answered=soloState.answeredQuestions instanceof Set ? soloState.answeredQuestions.size : 0;
    const remaining=Math.max(0,total-answered);
    if(remaining<=0 || (remaining/total)>0.10) return;

    soloFinalStretch276=true;
    stopSpecialAudio();
    stopBGM();
    bgmPlaybackRate=1.5;
    if(isMuted) return;

    // Same hurry-up cue and fast-BGM transition used by TEAM FINAL ROUND,
    // without touching TEAM's finalRoundActive state.
    playEmbeddedSfx('hurryup',{
      volume:0.45,
      onEnded:()=>{
        if(gameMode==='SOLO' && soloState.started && soloFinalStretch276 &&
           !document.body.classList.contains('solo-gameover-open') && !isMuted){
          startBGM();
        }
      }
    });
  }

  const originalStartSolo276=window.startSoloGameFromGuide;
  if(typeof originalStartSolo276==='function'){
    window.startSoloGameFromGuide=function(){
      resetSoloFinalAudio276();
      return originalStartSolo276.apply(this,arguments);
    };
  }

  const originalRestartSolo276=window.restartSoloChallengeNow156;
  if(typeof originalRestartSolo276==='function'){
    window.restartSoloChallengeNow156=function(){
      resetSoloFinalAudio276();
      return originalRestartSolo276.apply(this,arguments);
    };
  }

  const originalCloseSoloResult276=window.closeSoloResult;
  if(typeof originalCloseSoloResult276==='function'){
    window.closeSoloResult=function(){
      // Trigger the hurry-up cue only when the result screen is dismissed.
      // This avoids stacking it on top of the correct-coin / wrong-bump SFX.
      try{ maybeStartSoloFinalStretch276(); }catch(err){ console.warn('SOLO final stretch:',err); }
      return originalCloseSoloResult276.apply(this,arguments);
    };
  }

  const originalSoloGameOver276=window.showSoloGameOver;
  if(typeof originalSoloGameOver276==='function'){
    window.showSoloGameOver=function(){
      const result=originalSoloGameOver276.apply(this,arguments);
      if(!soloGameOverMusicPlayed276){
        soloGameOverMusicPlayed276=true;
        // Exactly the same completion BGM used when TEAM reveals the final winner.
        try{ playSpecialMidi('levelComplete',false); }catch(err){ console.warn('SOLO GAME OVER BGM:',err); }
      }
      return result;
    };
  }

      const cs=getComputedStyle(title);
      let size=parseFloat(cs.fontSize)||24;
      const min=11;

      const availableH=Math.max(28,(label.clientHeight||100)-(header?.offsetHeight||0)-8);

  function subjects277(grade){

  }
  function gradeLabel277(v){

    }

  const oldGrade277=window.showGradeSelect151;
  if(typeof oldGrade277==='function')window.showGradeSelect151=function(){

  const oldSubject277=window.showSubjectSelect152;

<script>
(function(){
  function setCatalogStage280(stage){
    const nodes = {
      grade: document.getElementById('gradeSelectList'),
      subject: document.getElementById('subjectSelectWrap153'),
      publisher: document.getElementById('publisherSelectWrap154'),
      toolbar: document.getElementById('cartridgeToolbar151'),
      cartridge: document.getElementById('cartridgeList')

    Object.keys(nodes).forEach(key=>{

      const active =
        key===stage ||
        (stage==='cartridge' && (key==='toolbar' || key==='cartridge'));
      el.classList.toggle('smq-catalog-hidden280', !active);

    /* Keep v278's rail activation classes synchronized. */
    if(nodes.grade) nodes.grade.classList.toggle('smq-catalog-active278',stage==='grade');
    if(nodes.subject) nodes.subject.classList.toggle('smq-catalog-active278',stage==='subject');

  wrap280('showGradeSelect151','grade');

  wrap280('showPublisherSelect154','publisher');

<script>
(function(){
  let lastGradeRailRect281=null;

  function captureGradeRail281(){
    const grade=document.getElementById('gradeSelectList');
    if(!grade)return;
    const r=grade.getBoundingClientRect();
    if(r.width>100 && r.height>100){
      lastGradeRailRect281={
        left:r.left, top:r.top, width:r.width, height:r.height
      };
    }
  }

  function removeOldFloating281(except){
    document.querySelectorAll('#smqSubjectFloating281').forEach(el=>{
      if(el!==except) el.remove();
    });
  }

  function anchorSubjectRail281(){
    const modal=document.getElementById('cartridgeSelectModal');
    const wrap=document.getElementById('subjectSelectWrap153');
    if(!modal || !wrap || !wrap.classList.contains('smq-catalog-active278'))return;

    /* showSubjectSelect152/renderSubjects277 creates the live list inside the
       legacy wrapper. Move that list out of the old layout context completely. */
    const list=wrap.querySelector('.smq-subject-list274');
    if(!list)return;

    removeOldFloating281(list);

    const modalRect=modal.getBoundingClientRect();
    let target=lastGradeRailRect281;

    /* Defensive fallback for direct/cached entry into SUBJECT. */
    if(!target || target.width<100 || target.height<100){
      const viewportW=(window.visualViewport&&window.visualViewport.width)||window.innerWidth;
      target={
        left:Math.max(40,(viewportW-Math.min(viewportW-80,1320))/2),
        top:180,
        width:Math.min(viewportW-80,1320),
        height:348
      };
    }

    list.id='smqSubjectFloating281';
    modal.appendChild(list);

    list.style.setProperty('position','absolute','important');
    list.style.setProperty('left',Math.round(target.left-modalRect.left)+'px','important');
    list.style.setProperty('top',Math.round(target.top-modalRect.top)+'px','important');
    list.style.setProperty('width',Math.round(target.width)+'px','important');
    list.style.setProperty('max-width',Math.round(target.width)+'px','important');
    list.style.setProperty('height',Math.round(target.height)+'px','important');
    list.style.setProperty('min-height',Math.round(target.height)+'px','important');
    list.style.setProperty('max-height',Math.round(target.height)+'px','important');
    list.style.setProperty('display','flex','important');

    /* The legacy wrapper now owns only the fixed grade badge and must not
       reserve a second vertical band in the modal's flex flow. */
    wrap.style.setProperty('height','0px','important');
    wrap.style.setProperty('min-height','0px','important');
    wrap.style.setProperty('max-height','0px','important');
    wrap.style.setProperty('margin','0','important');
    wrap.style.setProperty('padding','0','important');
  }

  function hideFloatingSubject281(){
    const list=document.getElementById('smqSubjectFloating281');
    if(list) list.style.setProperty('display','none','important');
  }

  const oldSelectGrade281=window.selectGrade151;
  if(typeof oldSelectGrade281==='function'){
    window.selectGrade151=function(){
      captureGradeRail281();
      return oldSelectGrade281.apply(this,arguments);
    };
  }

  const oldShowGrade281=window.showGradeSelect151;
  if(typeof oldShowGrade281==='function'){
    window.showGradeSelect151=function(){
      hideFloatingSubject281();
      const r=oldShowGrade281.apply(this,arguments);
      requestAnimationFrame(captureGradeRail281);
      return r;
    };
  }

  const oldShowSubject281=window.showSubjectSelect152;
  if(typeof oldShowSubject281==='function'){
    window.showSubjectSelect152=function(){
      const r=oldShowSubject281.apply(this,arguments);
      requestAnimationFrame(()=>requestAnimationFrame(anchorSubjectRail281));
      return r;
    };
  }

  ['showPublisherSelect154','showCartridgeSelect154'].forEach(name=>{
    const old=window[name];
    if(typeof old!=='function')return;
    window[name]=function(){
      hideFloatingSubject281();
      return old.apply(this,arguments);
    };
  });

  function reanchor281(){
    if((document.getElementById('cartridgeSelectTitle')?.textContent||'').trim()!=='SELECT SUBJECT')return;
    anchorSubjectRail281();
  }
  window.addEventListener('resize',()=>requestAnimationFrame(reanchor281),{passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>requestAnimationFrame(reanchor281),{passive:true});
  }
})();
</script>

<script>
/* =========================================================
   v1.00.282 — subject-screen placement / SOLO ranking back removal
                  / Mario starts the same question-block action
   ========================================================= */
(function(){
  let subjectLayoutRaf282=0;

  function isSubjectStage282(){
    return (document.getElementById('cartridgeSelectTitle')?.textContent||'').trim()==='SELECT SUBJECT';
  }

  function ensureSubjectDivider282(){
    const modal=document.getElementById('cartridgeSelectModal');
    if(!modal)return null;
    let line=document.getElementById('smqSubjectDivider282');
    if(!line){
      line=document.createElement('div');
      line.id='smqSubjectDivider282';
      line.setAttribute('aria-hidden','true');
      modal.appendChild(line);
    }
    return line;
  }

  function applySubjectLayout282(){
    const modal=document.getElementById('cartridgeSelectModal');
    if(!modal)return;

    const subjectMode=isSubjectStage282();
    modal.classList.toggle('smq-subject-layout282',subjectMode);

    const line=ensureSubjectDivider282();
    if(line) line.style.display=subjectMode?'block':'none';

    if(!subjectMode)return;

    /* Ensure the inactive grade host cannot leave the large blue/black-edged
       rectangle visible behind the subject rail. */
    const grade=document.getElementById('gradeSelectList');
    if(grade){
      grade.classList.add('smq-catalog-hidden280');
      grade.classList.remove('smq-catalog-active278');
      grade.style.setProperty('display','none','important');
      grade.style.setProperty('visibility','hidden','important');
    }

    const list=document.getElementById('smqSubjectFloating281')
      || modal.querySelector('.smq-subject-list274');
    if(!list)return;

    const vv=window.visualViewport;
    const viewportW=Math.max(320,Number(vv&&vv.width)||window.innerWidth||0);
    const viewportH=Math.max(480,Number(vv&&vv.height)||window.innerHeight||0);
    const modalRect=modal.getBoundingClientRect();

    /* Same outer margins as the cartridge rail rather than the old centered
       grade panel. The cards themselves keep their fixed 270x300 shell. */
    const left=20;
    const top=258;
    const width=Math.max(280,viewportW-40);
    const maxRailH=Math.max(322,viewportH-top-28);
    const railH=Math.min(382,maxRailH);

    list.style.setProperty('position','absolute','important');
    list.style.setProperty('left',Math.round(left-modalRect.left)+'px','important');
    list.style.setProperty('top',Math.round(top-modalRect.top)+'px','important');
    list.style.setProperty('right','auto','important');
    list.style.setProperty('bottom','auto','important');
    list.style.setProperty('width',Math.round(width)+'px','important');
    list.style.setProperty('max-width',Math.round(width)+'px','important');
    list.style.setProperty('height',Math.round(railH)+'px','important');
    list.style.setProperty('min-height',Math.round(railH)+'px','important');
    list.style.setProperty('max-height',Math.round(railH)+'px','important');
    list.style.setProperty('display','flex','important');
    list.style.setProperty('background','transparent','important');
    list.style.setProperty('border','0','important');
    list.style.setProperty('box-shadow','none','important');

    const badge=document.getElementById('subjectGradeBadge153');
    if(badge){
      /* v281 moved the list out of the wrapper; move the badge too so its
         legacy fixed positioning cannot be clipped by the zero-size host. */
      if(badge.parentElement!==modal) modal.appendChild(badge);
    }
  }

  function scheduleSubjectLayout282(){
    if(subjectLayoutRaf282)cancelAnimationFrame(subjectLayoutRaf282);
    subjectLayoutRaf282=requestAnimationFrame(()=>{
      subjectLayoutRaf282=requestAnimationFrame(()=>{
        subjectLayoutRaf282=0;
        applySubjectLayout282();
      });
    });
  }

  /* Run after the v281 anchoring wrapper so these final coordinates win. */
  ['showSubjectSelect152','showGradeSelect151','showPublisherSelect154','showCartridgeSelect154'].forEach(name=>{
    const old=window[name];
    if(typeof old!=='function')return;
    window[name]=function(){
      const r=old.apply(this,arguments);
      scheduleSubjectLayout282();
      return r;
    };
  });

  /* Mario and the question block are two controls for the exact same action.
     Trigger the existing hit button rather than reimplementing qNum selection. */
  function bindSoloMarioQuestion282(){
    if(gameMode!=='SOLO')return;
    const grid=document.getElementById('grid');
    if(!grid)return;
    const mario=grid.querySelector('.solo-mario267');
    const hit=grid.querySelector('.solo-question-hit267');
    if(!mario||!hit||mario.dataset.questionTrigger282==='1')return;

    mario.dataset.questionTrigger282='1';
    mario.setAttribute('role','button');
    mario.setAttribute('tabindex','0');
    mario.setAttribute('aria-label','문제 시작');
    mario.style.cursor=hit.disabled?'default':'pointer';

    const trigger=()=>{
      if(hit.disabled)return;
      hit.click();
    };
    mario.addEventListener('click',trigger);
    mario.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){
        e.preventDefault();
        trigger();
      }
    });
  }

  const oldRenderSoloGrid282=window.renderSoloGrid;
  if(typeof oldRenderSoloGrid282==='function'){
    window.renderSoloGrid=function(){
      const r=oldRenderSoloGrid282.apply(this,arguments);
      requestAnimationFrame(bindSoloMarioQuestion282);
      return r;
    };
  }

  /* Existing rendered SOLO stage in a hot/cached deployment. */
  requestAnimationFrame(bindSoloMarioQuestion282);

  window.addEventListener('resize',scheduleSubjectLayout282,{passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',scheduleSubjectLayout282,{passive:true});
  }
  document.addEventListener('DOMContentLoaded',scheduleSubjectLayout282,{once:true});
  setTimeout(scheduleSubjectLayout282,0);
})();
</script>
