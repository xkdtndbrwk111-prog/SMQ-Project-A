  if (!quizModal207 || !quizModal207.classList.contains('active')) return;

  const resultSection = document.getElementById('resultSection');
  const box = document.getElementById('resIconBox');
  const bowser = box ? box.querySelector('.bowser-result-img') : null;

  if (!resultSection || !box || !bowser) return;

  const sectionVisible =
    getComputedStyle(resultSection).display !== 'none' &&
    resultSection.getBoundingClientRect().width > 0 &&
    resultSection.getBoundingClientRect().height > 0;

  const bRect = bowser.getBoundingClientRect();
  const bowserReady =
    sectionVisible &&
    bowser.complete &&
    bowser.naturalWidth > 0 &&
    bRect.width > 20 &&
    bRect.height > 20;

  if (!bowserReady) {
    if (attempt < 12) {
      setTimeout(() => startBowserFireAfterLayout(attempt + 1, retryToken207), 40);
    }
    return;
  }

  // Give the now-visible modal two full paint frames before measuring the mouth.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      if (retryToken207 !== bowserFireRetryToken207) return;
      const freshRect = bowser.getBoundingClientRect();
      if (freshRect.width > 20 && freshRect.height > 20) {
        startBowserFireAnimation();
      } else if (attempt < 12) {
        setTimeout(() => startBowserFireAfterLayout(attempt + 1, retryToken207), 40);
      }
    });
  });
}

function startBowserFireAnimation() {
  stopBowserFireAnimation();

  const box = document.getElementById('resIconBox');
  const bowser = box ? box.querySelector('.bowser-result-img') : null;
  if (!box || !bowser || !BOWSER_FIRE_FRAMES || BOWSER_FIRE_FRAMES.length < 2) return;

  box.classList.add('bowser-fire-active');

  const fire = document.createElement('img');
  fire.className = 'bowser-fire-sprite';
  fire.alt = '';
  fire.setAttribute('aria-hidden','true');
  fire.src = BOWSER_FIRE_FRAMES[0];

  // Prevent the browser from briefly painting the sprite at its default
  // position before the fixed item modal finishes layout.
  fire.style.visibility = 'hidden';
  box.appendChild(fire);

  let frame = 0;
  let x = 0;
  let y = 0;

  const getMouthPosition = () => {
    const boxRect = box.getBoundingClientRect();
    const bRect = bowser.getBoundingClientRect();
    const fireW = fire.offsetWidth || 28;
    return {
      x: (bRect.left - boxRect.left) - fireW * 0.38,
      y: (bRect.top - boxRect.top) + bRect.height * 0.33
    };
  };

  const spawnAtMouth = (withSound = true) => {
    const p = getMouthPosition();
    x = p.x;
    y = p.y;
    fire.style.left = `${x}px`;
    fire.style.top = `${y}px`;
    if (withSound) {
      playEmbeddedSfx('fire', { volume: 0.82 });
    }
  };

  const begin = () => {
    // Start the first visible flame as soon as the modal geometry is stable.
    spawnAtMouth();
    fire.style.visibility = 'visible';

    bowserFireFrameTimer = setInterval(() => {
      frame = 1 - frame;
      fire.src = BOWSER_FIRE_FRAMES[frame];
    }, 80);

    // 2x original movement speed.
    bowserFireMoveTimer = setInterval(() => {
      x -= 4.0;
      fire.style.left = `${x}px`;
      fire.style.top = `${y}px`;

      const fireW = fire.offsetWidth || 28;
      if (x < -fireW) {
        spawnAtMouth();
      }
    }, 30);
  };

  // Two render frames are enough for the fixed item modal to settle,
  // while starting the visible flame slightly earlier than before.
  requestAnimationFrame(() => {
    requestAnimationFrame(begin);
  });
}

<script>
/* =========================================================
   v1.00.89 — UNDERWATER TRUE 16px GRID DATA
   INTRO / TEAM / SCORE share one exact tile map.
   Coral X positions are integer tile columns only: no legacy image offsets.
   ========================================================= */
window.UNDERWATER_SHARED_GRID_V89 = Object.freeze({
  cols:43,
  rows:15,
  tile:16,
  // [tileX, stackHeight] — tileX is the exact LEFT edge of a 16x16 grid cell.
  coral:Object.freeze([
    Object.freeze([2,2]), Object.freeze([6,3]),
    Object.freeze([11,2]), Object.freeze([17,3]),
    Object.freeze([22,2]), Object.freeze([28,3]),
    Object.freeze([34,2]), Object.freeze([39,3])
  ])
});
// Backward-compatible alias for older underwater helper blocks.
window.UNDERWATER_SHARED_GRID_V88 = window.UNDERWATER_SHARED_GRID_V89;
</script>

<script>
/* =========================================================
   v1.00.50 — UNDERWATER motion controller (freeze fix)
   ========================================================= */
(function(){
  const state={
    raf:0,
    started:0,
    fishTick:0,
    fishFrame:0,
    lastTheme:'',
    resizeStamp:0
  };

  function uw(){ return document.body.dataset.theme==='underwater'; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  function removeAll(){
    if(state.raf){cancelAnimationFrame(state.raf);state.raf=0;}
    document.querySelectorAll('.uw49-layer,.uw49-coral-layer,.uw52-panel-coral,.uw63-team-sky,.uw63-team-wave').forEach(x=>x.remove());
    state.started=0;
  }

  function actor(host,cls,src){
    let layer=host.querySelector('.uw49-layer');
    if(!layer){
      layer=document.createElement('div');
      layer.className='uw49-layer';
      host.appendChild(layer);
    }
    const im=document.createElement('img');
    im.className='uw49-actor '+cls;
    im.src=src;
    im.alt='';
    layer.appendChild(im);
    return im;
  }

  function buildCoral(host){
    const h=host.clientHeight||480;
    // Ground band is 2 logical tile rows high. One logical 16x16 tile = h / 15.
    const grid=window.UNDERWATER_SHARED_GRID_V89 || window.UNDERWATER_SHARED_GRID_V88 || {rows:15,tile:16,coral:[]};
    const tile=h/grid.rows;
    const groundTop=tile*2;

    // v1.00.88 — INTRO / TEAM / SCORE now read the exact same authoritative grid data.
    const columns=grid.coral;
    function populate(layer, panelMode){
      columns.forEach(([tileX,stack])=>{
        for(let row=0;row<stack;row++){
          const im=document.createElement('img');
          im.className='uw49-coral-tile';
          im.src=UNDERWATER_TEAM_CORAL_TILE;
          im.alt='';
          im.style.width=tile+'px';
          im.style.height=tile+'px';
          // Exact tile-grid placement: coral sits on the same column edges as ground tiles.
          im.style.left=(tileX*tile)+'px';
          im.style.bottom=(groundTop + row*tile)+'px';
          layer.appendChild(im);
        }
      });
    }

    const isTeam=host.matches && host.matches('#setupModal .team-stage-window');

    if(isTeam){
      // IMPORTANT: the real scrolling element is .stage-scroll-track.
      // Put coral INSIDE each .stage-panel so it physically scrolls with
      // the stage background. No transform mirroring or guessed selectors.
      host.querySelectorAll('.stage-panel .uw52-panel-coral').forEach(x=>x.remove());

      const panels=[...host.querySelectorAll('.stage-scroll-track .stage-panel')];
      panels.forEach(panel=>{
        // v1.00.63: same water-surface treatment as intro.
        // These live INSIDE the scrolling panel, so they are true background scenery.
        panel.querySelectorAll('.uw63-team-sky,.uw63-team-wave').forEach(x=>x.remove());

        const sky=document.createElement('div');
        sky.className='uw63-team-sky';
        panel.appendChild(sky);

        const wave=document.createElement('div');
        wave.className='uw63-team-wave';
        wave.style.backgroundImage=`url("${UNDERWATER_SURFACE_TILE_V54}")`;
        wave.style.setProperty('--uw63-team-tile-px', tile+'px');
        panel.appendChild(wave);

        const layer=document.createElement('div');
        layer.className='uw49-coral-layer uw52-panel-coral';
        layer.style.position='absolute';
        layer.style.inset='0';
        layer.style.zIndex='3';
        layer.style.pointerEvents='none';
        layer.style.overflow='visible';
        populate(layer,true);
        panel.appendChild(layer);
      });
      return;
    }

    // Intro does not use the scrolling stage track.
    const old=host.querySelector(':scope > .uw49-coral-layer');
    if(old) old.remove();

    const layer=document.createElement('div');
    layer.className='uw49-coral-layer';
    populate(layer,false);
    host.appendChild(layer);
  }

  function buildIntro(){
    const host=document.getElementById('introStageBg');
    if(!host)return null;
    host.querySelectorAll('.uw49-layer').forEach(x=>x.remove());
    buildCoral(host);

    const mario=actor(host,'uw49-mario',SOLO_THEME_MARIO_FRAMES.underwater[0]);
    const red=actor(host,'uw49-fish uw49-redfish',UNDERWATER_RED_FISH_FRAMES[0]);
    const green=actor(host,'uw49-fish uw49-greenfish',UNDERWATER_GREEN_FISH_FRAMES[0]);
    const blooper=actor(host,'uw49-blooper',SOLO_UNDERWATER_BLOOPER_FRAMES[0]);

    mario.style.width='48px';
    red.style.width=red.style.height='48px';
    green.style.width=green.style.height='48px';
    blooper.style.width='46px';

    return {host,mario,red,green,blooper};
  }

  function buildTeam(){
    const host=document.querySelector('#setupModal .team-stage-window');
    if(!host)return null;
    host.querySelectorAll('.uw49-layer').forEach(x=>x.remove());
    buildCoral(host);

    const mario=actor(host,'uw49-mario',SOLO_THEME_MARIO_FRAMES.underwater[0]);
    const red=actor(host,'uw49-fish uw49-redfish',UNDERWATER_RED_FISH_FRAMES[0]);
    const green=actor(host,'uw49-fish uw49-greenfish',UNDERWATER_GREEN_FISH_FRAMES[0]);

    const blooper1=actor(host,'uw49-blooper',SOLO_UNDERWATER_BLOOPER_FRAMES[0]);
    const blooper2=actor(host,'uw49-blooper',SOLO_UNDERWATER_BLOOPER_FRAMES[0]);

    mario.style.width='44px';
    red.style.width=red.style.height='44px';
    green.style.width=green.style.height='42px';
    blooper1.style.width='42px';
    blooper2.style.width='38px';

    return {host,mario,red,green,blooper1,blooper2};
  }

  function fishProgress(t){
    // Variable speed but monotonic. Never bobs vertically.
    // Derivative stays positive because wobble amplitude is small.
    return clamp(t + Math.sin(t*Math.PI*4)*0.028,0,1);
  }

  function setFish(el,w,h,t,dir,y,frames,elapsed,phase=0){
    const p=fishProgress(t);
    const x=dir>0 ? (-55+(w+110)*p) : (w+55-(w+110)*p);
    el.style.transform=`translate3d(${x}px,${h*y}px,0) scaleX(${dir>0?-1:1})`;

    // v1.00.81 — flap in a short burst, pause on one frame, then flap again.
    // One cycle = 4 quick 260ms frame steps + 950ms resting hold.
    // The fish keeps swimming horizontally during the pause; only its body/tail
    // animation rests, matching the calmer main-game HUD fish cadence.
    if(Array.isArray(frames) && frames.length >= 2){
      const local=Math.max(0,elapsed+phase);
      const flapSpan=260*4;
      const restSpan=950;
      const cycle=flapSpan+restSpan;
      const ct=local%cycle;
      let fi;
      if(ct<flapSpan){
        fi=Math.floor(ct/260)%2;
      }else{
        /* Keep the final flap pose frozen during the rest. */
        fi=1;
      }
      el.src=frames[fi];
    }
  }

  function setMario(el,w,h,t,tileRow,snapToGridTile=false){
    // v1.00.183 — the intro swimmer is treated as one native 16x16 grid tile.
    // CSS pixels are derived from the rendered 15-row underwater grid, so the
    // sprite remains exactly one block tall/wide at every viewport size.
    const x=-58+(w+116)*t;
    const grid=window.UNDERWATER_SHARED_GRID_V88 || {rows:15};
    const tilePx=h/grid.rows;
    if(snapToGridTile){
      el.style.width=tilePx+'px';
      el.style.height=tilePx+'px';
    }
    const y=tilePx*(tileRow + Math.sin(t*Math.PI*8)*0.45);
    el.style.transform=`translate3d(${x}px,${y}px,0)`;
    const seq=[0,1,2,1];
    const fi=Math.floor(t*32)%seq.length;
    el.src=SOLO_THEME_MARIO_FRAMES.underwater[seq[fi]%SOLO_THEME_MARIO_FRAMES.underwater.length];
  }

  function setBlooper(el,w,h,t,variant){
    /*
      No 급발진:
      0-.22  open  : diagonal up-left
      .22-.38 closed: SAME X, slow sink
      .38-.60 open  : diagonal up-left
      .60-.76 closed: SAME X, slow sink
      .76-1.00 open : diagonal up-left and exits naturally off the LEFT edge
      Reset happens only after it is already off-screen.
    */
    // v1.00.89: TEAM variants 3/4 live in a permanently lower corridor than Mario.
    // This is spatial separation, not a fragile timing-only phase trick.
    const base = variant===4 ? .70 : variant===3 ? .68 : variant===2 ? .69 : .60;
    const high = variant===4 ? .62 : variant===3 ? .60 : variant===2 ? .54 : .43;

    let x,y,open;
    if(t<.22){
      const p=t/.22;
      x=1.10-(.31*p);
      y=base+(high-base)*p;
      open=true;
    }else if(t<.38){
      const p=(t-.22)/.16;
      x=.79;
      y=high+(base-high)*p;
      open=false;
    }else if(t<.60){
      const p=(t-.38)/.22;
      x=.79-(.36*p);
      y=base+(high-base)*p;
      open=true;
    }else if(t<.76){
      const p=(t-.60)/.16;
      x=.43;
      y=high+(base-high)*p;
      open=false;
    }else{
      const p=(t-.76)/.24;
      x=.43-(.55*p);   // ends at -12%: fully off-screen
      y=base+(high-base)*p;
      open=true;
    }

    el.src=SOLO_UNDERWATER_BLOOPER_FRAMES[open?0:1] || SOLO_UNDERWATER_BLOOPER_FRAMES[0];
    el.style.transform=`translate3d(${w*x}px,${h*y}px,0)`;
  }

  function frame(now){
    if(!uw()){removeAll();return;}
    if(!state.started)state.started=now;

    const elapsed=now-state.started;
    const intro=document.getElementById('introStageBg');
    const teamHost=document.querySelector('#setupModal .team-stage-window');

    let I=intro && intro._uw49Actors;
    let T=teamHost && teamHost._uw49Actors;

    if(intro && !I){
      I=buildIntro();
      intro._uw49Actors=I;
    }
    if(teamHost && !T){
      T=buildTeam();
      teamHost._uw49Actors=T;
    }

    if(I){
      const w=I.host.clientWidth,h=I.host.clientHeight;
      // v1.00.183 — one-tile Mario uses a dedicated upper-middle swim lane.
      // Row 5 keeps the enlarged sprite clear of the upper green fish (around row 3),
      // the Blooper corridor (rows 6.45-9), and the lower red fish (row 11.7).
      // The bubble emitter reads Mario's live bounding box, so bubbles follow this lane automatically.
      setMario(I.mario,w,h,((elapsed+2200)%17500)/17500,5,true);
      setFish(I.red,w,h,((elapsed+3900)%17000)/17000,-1,11.7/15,UNDERWATER_RED_FISH_FRAMES,elapsed,0);
      {
        const surfacePx=parseFloat(getComputedStyle(I.host).getPropertyValue('--uw55-surface-y'))||h*.105;
        const tilePx=parseFloat(getComputedStyle(I.host).getPropertyValue('--uw55-tile-px'))||h/15;
        // v62 waterline is v55 surface + 20px. Keep fish at least one tile below it.
        const safeGreenY=Math.max(.20,(surfacePx+20+tilePx*1.15)/h);
        setFish(I.green,w,h,((elapsed+9300)%18500)/18500,1,safeGreenY,UNDERWATER_GREEN_FISH_FRAMES,elapsed,130);
      }
      setBlooper(I.blooper,w,h,((elapsed+5200)%30000)/30000,1);
    }

    if(T){
      const w=T.host.clientWidth,h=T.host.clientHeight;

      // v1.00.229 — TEAM underwater actors use the exact same rendered
      // 16x16 logical tile as the background grid. This removes viewport/monitor
      // dependent actor enlargement caused by the old fixed 38~44 CSS-pixel sizes.
      const teamTilePx=h/((window.UNDERWATER_SHARED_GRID_V89 || window.UNDERWATER_SHARED_GRID_V88 || {rows:15}).rows||15);
      // v1.00.230 — 16px is the native WIDTH scale, not a forced square box.
      // Mario/fish are 16x16 sprites, while Blooper is naturally taller.
      // Keeping Blooper's intrinsic aspect ratio restores the intended visual scale.
      // v1.00.231 — TEAM-only Mario scale correction.
      // The embedded underwater Mario WebP frames are physically 18x16 because
      // the converted assets retain 1px transparent padding on each side of the
      // original 16x16 sprite cell. Rendering that 18x16 file inside a forced
      // square with object-fit:contain shrinks the visible 16px artwork by 16/18.
      // Keep one native sprite pixel equal to one background-grid pixel here only;
      // INTRO is intentionally left untouched because its displayed size is already good.
      if(T.mario){
        T.mario.style.width=(teamTilePx*(18/16))+'px';
        T.mario.style.height=teamTilePx+'px';
      }
      [T.red,T.green].forEach(el=>{
        if(!el)return;
        el.style.width=teamTilePx+'px';
        el.style.height=teamTilePx+'px';
      });
      [T.blooper1,T.blooper2].forEach(el=>{
        if(!el)return;
        el.style.width=teamTilePx+'px';
        el.style.height='auto';
      });

      // Mario deliberately raised to clear the question blocks.
      setMario(T.mario,w,h,((elapsed+1800)%18500)/18500,6.45,false);

      // Two fish, separate straight lanes and phases.
      setFish(T.red,w,h,((elapsed+3600)%17500)/17500,-1,11.7/15,UNDERWATER_RED_FISH_FRAMES,elapsed,0);
      setFish(T.green,w,h,((elapsed+11200)%19500)/19500,-1,9.9/15,UNDERWATER_GREEN_FISH_FRAMES,elapsed,130);

      // Two Blooper N paths, lower than before and phase-separated.
      setBlooper(T.blooper1,w,h,((elapsed+6200)%31000)/31000,3);
      setBlooper(T.blooper2,w,h,((elapsed+20500)%33500)/33500,4);
    }

    state.raf=requestAnimationFrame(frame);
  }

  let rebuildTimer=0;
  let forceResetOnNextRebuild237=false;

  function rebuild(){
    if(!uw())return;
    if(state.raf){cancelAnimationFrame(state.raf);state.raf=0;}

    // v1.00.235 — geometry/DOM rebuilds must not restart the shared Underwater
    // motion timeline. v203 and other layout-settle hooks can legitimately rebuild
    // the scene after it is already visible; preserving started prevents every
    // swimmer from jumping back to its initial phase.
    const preservedStarted=forceResetOnNextRebuild237 ? 0 : state.started;
    forceResetOnNextRebuild237=false;

    document.querySelectorAll('.uw49-layer,.uw49-coral-layer,.uw52-panel-coral,.uw63-team-sky,.uw63-team-wave').forEach(x=>x.remove());
    const intro=document.getElementById('introStageBg');
    const team=document.querySelector('#setupModal .team-stage-window');
    if(intro)delete intro._uw49Actors;
    if(team)delete team._uw49Actors;

    state.started=preservedStarted || 0;
    state.raf=requestAnimationFrame(frame);
  }

  function scheduleRebuild(delay){
    if(!uw())return;
    clearTimeout(rebuildTimer);
    rebuildTimer=setTimeout(rebuild,delay||0);
  }

  window.refreshUnderwaterV50=function(){
    scheduleRebuild(0);
  };
  window.refreshUnderwaterV49=window.refreshUnderwaterV50;

  // v1.00.238 — retained fix: explicit THEME TEST restart only.
  // Geometry/resize rebuilds keep the live motion epoch, but pressing the test
  // button is a deliberate new scene start and must return swimmers to phase 0.
  window.resetUnderwaterMotionV237=function(){
    forceResetOnNextRebuild237=true;
    state.started=0;
  };

  window.addEventListener('load',()=>scheduleRebuild(100));
  window.addEventListener('resize',()=>{
    if(!uw())return;
    clearTimeout(state.resizeStamp);
    state.resizeStamp=setTimeout(()=>scheduleRebuild(0),140);
  });

  const obs=new MutationObserver(()=>{
    if(uw())scheduleRebuild(20);
  });
  obs.observe(document.body,{attributes:true,attributeFilter:['data-theme']});

  // IMPORTANT:
  // Do NOT observe style mutations in the body subtree.
  // Actor positions are updated every animation frame via style.transform.
  // Watching those style changes would continuously call rebuild() and freeze
  // every actor at its starting position.

  // Rebuild only when the setup modal itself changes open/closed state.
  const setupModal=document.getElementById('setupModal');
  if(setupModal){
    const setupObs=new MutationObserver(()=>{
      if(uw())scheduleRebuild(60);
    });
    setupObs.observe(setupModal,{
      attributes:true,
      attributeFilter:['class']
    });
  }

  // Also hook the existing team-stage initializer so cartridge -> team select
  // always gets a fresh underwater layer without watching actor style changes.
  const originalInitTeamSelectStage=window.initTeamSelectStage;
  if(typeof originalInitTeamSelectStage==='function'){
    window.initTeamSelectStage=function(){
      const result=originalInitTeamSelectStage.apply(this,arguments);
      if(uw())scheduleRebuild(60);
      return result;
    };
  }
})();
</script>

<script>
/* v1.00.54 — safe intro sky + theme WORLD number */
(function(){
  function worldValue(){
    const theme=document.body.dataset.theme;
    if(theme==='underground') return '1-2';
    if(theme==='underwater') return '1-3';
    if(theme==='castle') return '1-4';
    return '1-1';
  }

  function updateWorld(){
    const value=document.querySelector(
      '#introOverlay .nes-intro-top .nes-stat-block:nth-child(3) .nes-stat-value'
    );
    if(value) value.textContent=worldValue();
  }

  function ensureUnderwaterUpper(){
    const host=document.getElementById('introStageBg');
    if(!host) return;

    const oldSky=host.querySelector('.uw54-sky-band');
    const oldSurface=host.querySelector('.uw54-surface-strip');

    if(document.body.dataset.theme!=='underwater'){
      if(oldSky) oldSky.remove();
      if(oldSurface) oldSurface.remove();
      return;
    }

    if(!oldSky){
      const sky=document.createElement('div');
      sky.className='uw54-sky-band';
      host.insertBefore(sky,host.firstChild);
    }

    if(!oldSurface){
      const surface=document.createElement('div');
      surface.className='uw54-surface-strip';
      host.appendChild(surface);
    }

    // Match one 16x16 surface tile to one 16x16 ground/coral logical tile.
    // Ground scale in this stage is stageHeight / 15.
    const rows=(window.UNDERWATER_SHARED_GRID_V89 && window.UNDERWATER_SHARED_GRID_V89.rows) || 15;
    const tilePx=(host.clientHeight || 480)/rows;
    host.style.setProperty('--uw55-tile-px', tilePx+'px');

    // Raise water surface close under the MARIO / WORLD / TIME HUD.
    // Keep a small responsive minimum gap below the HUD.
    const hud=document.querySelector('#introOverlay .nes-intro-top');
    const hostRect=host.getBoundingClientRect();
    let surfaceY=(host.clientHeight || 480)*0.105;
    if(hud){
      const hr=hud.getBoundingClientRect();
      const hudBottom=hr.bottom-hostRect.top;
      surfaceY=Math.max(surfaceY, hudBottom + tilePx*0.02);
    }
    surfaceY=Math.min(surfaceY,(host.clientHeight || 480)*0.122);
    host.style.setProperty('--uw55-surface-y', surfaceY+'px');
  }

  function refresh(){
    updateWorld();
    ensureUnderwaterUpper();
  }

  window.refreshIntroThemeV54=refresh;
  window.addEventListener('load',()=>setTimeout(refresh,80));
  document.addEventListener('DOMContentLoaded',()=>setTimeout(refresh,20));

  const ob=new MutationObserver(()=>setTimeout(refresh,0));
  ob.observe(document.body,{attributes:true,attributeFilter:['data-theme']});

  let resizeTimer=0;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(refresh,100);
  });
  window.addEventListener('orientationchange',()=>setTimeout(refresh,180));
})();
</script>

<script>
/* v1.00.89 — bubble emitter: rise until the CENTER of the visible 4x4 bubble reaches wave midpoint */
(function(){
  let timer=0;
  const active=new Set();

  function isUw(){ return document.body.dataset.theme==='underwater'; }

  function surfaceMidY(host){
    if(host.id==='introStageBg'){
      const css=parseFloat(getComputedStyle(host).getPropertyValue('--uw55-surface-y'));
      if(Number.isFinite(css)) return css;
      return (host.clientHeight||480)*.105;
    }
    // TEAM wave tile is centered on 10% of the stage height.
    return (host.clientHeight||480)*.10;
  }

  function removeBubble(b){
    active.delete(b);
    if(b && b.isConnected) b.remove();
  }

  function animateBubble(b){
    const host=b._uwHost;
    if(!host || !host.isConnected || !b.isConnected || !isUw()){ removeBubble(b); return; }
    const now=performance.now();
    const sec=(now-b._uwBorn)/1000;
    const rise=38*sec;
    const drift=Math.sin(sec*2.6+b._uwPhase)*6 + Math.sin(sec*1.15+b._uwPhase*.7)*2;
    const top=b._uwStartY-rise;
    b.style.transform=`translate3d(${drift}px,${-rise}px,0)`;

    // Asset canvas = 8x16, but visible pixels occupy y=2..5; visible center is y=4.
    // Remove at the MIDDLE of the wave tile, not its lower edge.
    if(top + 4 <= surfaceMidY(host)){ removeBubble(b); return; }
    b._uwRaf=requestAnimationFrame(()=>animateBubble(b));
  }

  function emitBubbleFromMario(mario){
    if(!mario || !mario.isConnected) return;
    const host=mario.closest('#introStageBg, .team-stage-window');
    if(!host) return;

    const mr=mario.getBoundingClientRect();
    const hr=host.getBoundingClientRect();
    if(!mr.width || !mr.height) return;
    if(mr.right < hr.left || mr.left > hr.right || mr.bottom < hr.top || mr.top > hr.bottom) return;

    const bubble=document.createElement('img');
    bubble.className='uw56-bubble';
    bubble.src=SOLO_UNDERWATER_BUBBLE;
    bubble.alt='';

    const x=(mr.left-hr.left) + mr.width*.72;
    const y=(mr.top-hr.top) + mr.height*.28;
    bubble.style.left=x+'px';
    bubble.style.top=y+'px';
    host.appendChild(bubble);

    bubble._uwHost=host;
    bubble._uwStartY=y;
    bubble._uwBorn=performance.now();
    bubble._uwPhase=Math.random()*Math.PI*2;
    active.add(bubble);
    bubble._uwRaf=requestAnimationFrame(()=>animateBubble(bubble));
  }

  function clearAll(){
    active.forEach(b=>{ if(b._uwRaf) cancelAnimationFrame(b._uwRaf); if(b.isConnected)b.remove(); });
    active.clear();
    document.querySelectorAll('.uw56-bubble').forEach(x=>x.remove());
  }

  function tick(){
    if(!isUw()) return;
    emitBubbleFromMario(document.querySelector('#introStageBg .uw49-mario'));
    emitBubbleFromMario(document.querySelector('#setupModal .team-stage-window .uw49-mario'));
  }

  function start(){
    clearTimeout(timer);
    clearAll();
    if(!isUw()) return;
    function schedule(){
      clearTimeout(timer);
      if(!isUw()) return;
      const delay=2600 + Math.random()*900;
      timer=setTimeout(()=>{ tick(); schedule(); },delay);
    }
    schedule();
  }

  window.refreshUnderwaterMarioBubblesV56=start;
  window.addEventListener('load',()=>setTimeout(start,250));
  const obs=new MutationObserver(()=>setTimeout(start,80));
  obs.observe(document.body,{attributes:true,attributeFilter:['data-theme']});
})();
</script>

<script>
/* =========================================================
   v1.00.65 — CASTLE TEAM SELECT BOWSER ENCOUNTER
   Scroll castle -> reach lava bridge -> Mario stops -> Bowser patrol/jump/fire.
   Reuses the existing 4-frame NES_BOWSER_FRAMES and BOWSER_FIRE_FRAMES.
   ========================================================= */
(function(){
  const C65={
    raf:0,
    start:0,
    host:null,
    layer:null,
    map:null,
    mario:null,
    bowser:null,
    projectiles:[],
    nextFireAt:0,
    fireFrameTick:0,
    marioFrameTick:0,
    marioFrame:0,
    bowserFrameTick:0,
    bowserFrame:0,
    lastNow:0
  };

  function isCastle(){
    return document.body.dataset.theme==='castle';
  }

  // v1.00.142 — Castle ambient fire SFX belongs only to the presentation stages:
  // INTRO and TEAM SELECT. The hidden team-stage animation may keep running after
  // game start, but it must not leak its fire sound into the main game.
  function castleStageSfxAllowed142(){
    const intro=document.getElementById('introOverlay');
    const setup=document.getElementById('setupModal');

    const introVisible=!!intro &&
      getComputedStyle(intro).display!=='none' &&
      getComputedStyle(intro).visibility!=='hidden' &&
      parseFloat(getComputedStyle(intro).opacity||'1')>0.01;

    const setupVisible=!!setup && setup.classList.contains('active');

    return introVisible || setupVisible;
  }

  function clearCastle65(){
    if(C65.raf){
      cancelAnimationFrame(C65.raf);
      C65.raf=0;
    }
    C65.projectiles.forEach(p=>{
      if(p.el && p.el.remove) p.el.remove();
    });
    C65.projectiles=[];
    document.querySelectorAll('.castle65-layer').forEach(x=>x.remove());

    C65.start=0;
    C65.host=null;
    C65.layer=null;
    C65.map=null;
    C65.mario=null;
    C65.bowser=null;
    C65.nextFireAt=0;
    C65.lastNow=0;
  }

  function makeImg(cls,src){
    const el=document.createElement('img');
    el.className=cls;
    el.src=src;
    el.alt='';
    el.setAttribute('aria-hidden','true');
    return el;
  }

  function build(){
    clearCastle65();
    if(!isCastle()) return false;

    const host=document.querySelector('#setupModal .team-stage-window');
    if(!host || host.clientWidth<20 || host.clientHeight<20) return false;

    const layer=document.createElement('div');
    layer.className='castle65-layer';
    // v1.00.245 — hide any stale/final Castle frame until phase-0 geometry lands.
    layer.style.visibility='hidden';

    const map=window.buildCastle69TileMap(layer,'castle69-team-map');
    const mario=makeImg('castle65-actor castle65-mario',
      (SOLO_THEME_MARIO_FRAMES.castle || TEAM_SELECT_MARIO_FRAMES)[0]);
    const bowser=makeImg('castle65-actor castle65-bowser',NES_BOWSER_FRAMES[0]);

    layer.appendChild(map);
    layer.appendChild(mario);
    layer.appendChild(bowser);
    host.appendChild(layer);

    C65.host=host;
    C65.layer=layer;
    C65.map=map;
    C65.mario=mario;
    C65.bowser=bowser;

    // v1.00.244 — prevent the newly-appended Bowser from ever painting at its
    // default DOM position before the first Castle geometry frame lands.
    // He is still fully opaque once positioned; this is not a fade/pop effect.
    bowser.style.opacity='1';
    bowser.style.visibility='hidden';
    bowser.style.transform='translate3d(200vw,0,0)';

    C65.start=performance.now();
    C65.nextFireAt=C65.start+7600;

    C65.raf=requestAnimationFrame(frame);
    return true;
  }

  function stageGeometry(){
    const w=C65.host.clientWidth;
    const h=C65.host.clientHeight;
    const meta=C65.map && C65.map._castle69;

    /* v111: Castle is 1040x240 (65x15), restored only on the LEFT.
       All actor/scroll geometry below is calculated in DISPLAY pixels. */
    const nativeTilePx=16;
    const nativeH=240;
    const scale=h/nativeH;
    const tilePx=nativeTilePx*scale;
    const mapW=(meta ? meta.cols : 65)*nativeTilePx*scale;
    const bridgeLeft=(meta ? meta.bridgeStart : 40)*nativeTilePx*scale;
    const desiredBridgeScreenX=w*.34;
    const targetOffset=Math.max(0,Math.min(mapW-w,bridgeLeft-desiredBridgeScreenX));

    return {w,h,tilePx,mapW,targetOffset,scale};
  }

  function smoothstep(t){
    t=Math.max(0,Math.min(1,t));
    return t*t*(3-2*t);
  }

  /* =========================================================
     v1.00.260 — Castle Bowser fire: TRUE CASTLE MAP PHASE
     ---------------------------------------------------------
     The old flame stored DISPLAY-pixel x/y/speed at launch time. A monitor move
     changed Castle scale/offset while the projectile kept the old monitor's
     coordinates, so its path jumped.

     The flame now lives inside .castle69-map and stores only NATIVE castle-world
     coordinates. The map's own translate + scale transform moves/rescales it
     together with bricks, bridge and lava on every monitor.
     ========================================================= */
  function spawnFire(now, bowserWorldXNative, bowserYNative, bowserWNative, bowserHNative){
    if(!C65.map || !C65.map.isConnected || !C65.bowser) return;

    const fire=makeImg('castle65-fire castle65-fire260',BOWSER_FIRE_FRAMES[0]);

    /* Keep the projectile artwork's own aspect ratio. Its wrapper coordinate is
       native-world space; the Castle map supplies all rendered scaling. */
    fire.style.setProperty('position','absolute','important');
    fire.style.setProperty('left','0','important');
    fire.style.setProperty('top','0','important');
    /* v1.00.261 — BOWSER_FIRE_FRAMES are natively 24x9.
       Keep that exact native size; .castle69-map supplies the only display scale. */
    fire.style.setProperty('width','24px','important');
    fire.style.setProperty('height','9px','important');
    fire.style.setProperty('max-width','none','important');
    fire.style.setProperty('max-height','none','important');
    fire.style.setProperty('pointer-events','none','important');
    fire.style.setProperty('image-rendering','pixelated','important');
    fire.style.setProperty('z-index','12','important');
    fire.style.setProperty('transform','none','important');

    C65.map.appendChild(fire);

    const item={
      el:fire,
      /* Convert Bowser mouth to native Castle coordinates ONCE.
         From here on there are no screen-pixel projectile coordinates. */
      nativeX:bowserWorldXNative - Math.max(9,bowserWNative*.16),
      nativeY:bowserYNative + bowserHNative*.34,
      frame:0,
      frameAt:now,
      /* Preserve the former visual speed (~11.5% viewport/sec) but express it
         in native-world units using CURRENT geometry each frame. */
      speedNative:0
    };

    fire.style.setProperty('left',item.nativeX+'px','important');
    fire.style.setProperty('top',item.nativeY+'px','important');
    C65.projectiles.push(item);

    if(castleStageSfxAllowed142() && typeof playEmbeddedSfx==='function'){
      try{ playEmbeddedSfx('fire',{volume:.185}); }catch(_){}
    }

    if(castleStageSfxAllowed142()){
      try{
        window.dispatchEvent(new CustomEvent('castleBowserFireSfxV111'));
      }catch(_){}
    }
  }

  function updateProjectiles(now,dt,geometry){
    const {w,scale}=geometry || stageGeometry();
    const stageRect=C65.host?.getBoundingClientRect?.();

    for(let i=C65.projectiles.length-1;i>=0;i--){
      const p=C65.projectiles[i];

      if(!p.el || !p.el.isConnected || !C65.map?.isConnected){
        if(p.el?.remove) p.el.remove();
        C65.projectiles.splice(i,1);
        continue;
      }

      /* Convert desired visual speed to CURRENT native units each frame.
         Because scale is recalculated after a monitor move, velocity remains
         continuous in the new Castle world instead of retaining old pixels. */
      p.speedNative=Math.max(115,w*.115)/Math.max(scale,.001);
      p.nativeX-=p.speedNative*dt;

      if(now-p.frameAt>95){
        p.frame=1-p.frame;
        p.frameAt=now;
        p.el.src=BOWSER_FIRE_FRAMES[p.frame];
      }

      p.el.style.setProperty('left',p.nativeX+'px','important');
      p.el.style.setProperty('top',p.nativeY+'px','important');

      /* Despawn only after the CURRENT transformed projectile has fully crossed
         the CURRENT TEAM-stage left edge. No cached monitor threshold. */
      const pr=p.el.getBoundingClientRect();
      if(stageRect && pr.right<=stageRect.left){
        p.el.remove();
        C65.projectiles.splice(i,1);
      }
    }
  }

  function frame(now){
    if(!isCastle() || !C65.host || !C65.host.isConnected){
      clearCastle65();
      return;
    }

    const dt=Math.min(.05,Math.max(0,(now-(C65.lastNow||now))/1000));
    C65.lastNow=now;

    const geometry=stageGeometry();
    const {w,h,tilePx,targetOffset,scale}=geometry;
    // v1.00.229 — bind Castle actors to the same native tile scale as the map.
    // Mario = 1 tile, Bowser = 2 tiles. Avoid vh/clamp sizing drifting between monitors.
    C65.mario.style.height=tilePx+'px';
    C65.mario.style.width='auto';
    C65.bowser.style.height=(tilePx*2)+'px';
    C65.bowser.style.width='auto';
    const elapsed=now-C65.start;

    /* Phase 1: 0~8.4 sec
       Stage scrolls toward the final bridge while Mario advances.
       Phase 2: bridge scene remains stopped. */
    const travelDuration=8400;
    const rawTravel=Math.min(1,elapsed/travelDuration);
    const travel=smoothstep(rawTravel);

    // Castle map moves right -> left and then stays stopped.
    C65.map.style.transform=`translate3d(${-targetOffset*travel}px,0,0) scale(${scale})`;

    // Bridge top in source image ≈ y132/207 of stage.
    const bridgeY=((C65.map && C65.map._castle69) ? C65.map._castle69.floorRow : 10)*tilePx;

    // v109: same walk, but final stop is exactly FIVE Castle tiles farther right.
    const marioX=w*(.11 + .30*travel) + (5*tilePx*travel);
    const marioH=C65.mario.getBoundingClientRect().height || 40;
    // v1.00.75: team-select Mario is 1px lower than v1.00.74.
    const marioY=bridgeY-marioH-2;

    const frames=SOLO_THEME_MARIO_FRAMES.castle || TEAM_SELECT_MARIO_FRAMES;
    if(rawTravel<1){
      if(now-C65.marioFrameTick>135){
        C65.marioFrameTick=now;
        C65.marioFrame=(C65.marioFrame+1)%4;
        C65.mario.src=frames[C65.marioFrame%frames.length];
      }
    }else{
      // v1.00.73: after arriving, stop completely on the standing frame.
      C65.marioFrame=0;
      C65.mario.src=frames[0];
    }
    C65.mario.style.transform=`translate3d(${marioX}px,${marioY}px,0)`;

    const bowserH=C65.bowser.getBoundingClientRect().height || 84;
    const bowserW=C65.bowser.getBoundingClientRect().width || 84;

    /* v1.00.73: Bowser no longer fades/pops in.
       He is placed in castle WORLD coordinates, so the scrolling map naturally
       brings him in from the right edge. Patrol/jump starts after arrival. */
    C65.bowser.style.opacity='1';
    const meta=C65.map && C65.map._castle69;
    /* v110: Bowser exactly one Castle tile left from v109. */
    const bowserWorldX=((meta ? meta.bridgeEnd : 35)-3)*tilePx;
    const mapOffset=targetOffset*travel;
    const encounterTime=Math.max(0,elapsed-travelDuration);
    const patrol=(rawTravel>=1) ? Math.sin(encounterTime/1150)*w*.018 : 0;

    const jumpCycle=(encounterTime%6200)/6200;
    let jump=0;
    if(rawTravel>=1 && jumpCycle>.62 && jumpCycle<.84){
      const p=(jumpCycle-.62)/.22;
      jump=Math.sin(p*Math.PI)*Math.min(34,h*.07);
    }

    const bowserX=bowserWorldX-mapOffset+patrol;
    const bowserY=bridgeY-bowserH-2-jump;

    if(now-C65.bowserFrameTick>175){
      C65.bowserFrameTick=now;
      C65.bowserFrame=(C65.bowserFrame+1)%NES_BOWSER_FRAMES.length;
      C65.bowser.src=NES_BOWSER_FRAMES[C65.bowserFrame];
    }
    C65.bowser.style.transform=`translate3d(${bowserX}px,${bowserY}px,0)`;
    // Reveal only after map + actors have all received this frame's transforms.
    C65.bowser.style.visibility='visible';
    if(C65.layer) C65.layer.style.visibility='visible';

    // Fire only after Mario reaches the bridge.
    if(rawTravel>=1 && now>=C65.nextFireAt){
      /* Bowser is rendered in display space, but derive the mouth from the SAME
         native Castle world before creating the flame. Patrol/jump are converted
         back through the current scale so a monitor change cannot change phase. */
      const bowserWorldXNative=
        ((meta ? meta.bridgeEnd : 35)-3)*16 +
        (patrol/Math.max(scale,.001));
      const bowserYNative=
        (bridgeY/Math.max(scale,.001)) -
        (bowserH/Math.max(scale,.001)) -
        (2/Math.max(scale,.001)) -
        (jump/Math.max(scale,.001));
      const bowserWNative=bowserW/Math.max(scale,.001);
      const bowserHNative=bowserH/Math.max(scale,.001);

      spawnFire(
        now,
        bowserWorldXNative,
        bowserYNative,
        bowserWNative,
        bowserHNative
      );
      C65.nextFireAt=now + 2600 + Math.random()*1500;
    }

    updateProjectiles(now,dt,geometry);
    C65.raf=requestAnimationFrame(frame);
  }

  let rebuildTimer=0;
  function scheduleBuild(delay=60,preserveProgress=false){
    const savedElapsed=(preserveProgress && C65.start>0) ? Math.max(0,performance.now()-C65.start) : 0;
    clearTimeout(rebuildTimer);
    rebuildTimer=setTimeout(()=>{
      if(isCastle()){
        build();
        // v1.00.229 — a monitor/viewport resize must relayout the finite Castle
        // world, not restart its 8.4s journey from frame zero.
        if(preserveProgress && savedElapsed>0 && C65.start>0){
          const now=performance.now();
          C65.start=now-savedElapsed;
          if(savedElapsed>=8400) C65.nextFireAt=Math.max(C65.nextFireAt,now+500);
        }
      }else clearCastle65();
    },delay);
  }

  window.refreshCastleTeamStageV65=function(){
    scheduleBuild(0);
  };

  window.addEventListener('load',()=>scheduleBuild(160));
  // v1.00.260 — Castle map, Bowser actors and live fire now all recalculate from
  // the current Castle-world geometry. Never rebuild a healthy live encounter on
  // monitor resize; the next animation frame reprojects the same native phase.
  window.addEventListener('resize',()=>{
    if(isCastle() && (!C65.host || !C65.host.isConnected || !C65.raf)) scheduleBuild(80,true);
  },{passive:true});
  window.addEventListener('orientationchange',()=>{
    if(isCastle() && (!C65.host || !C65.host.isConnected || !C65.raf)) scheduleBuild(120,true);
  },{passive:true});

  // Theme test / actual random theme change.
  const themeObserver=new MutationObserver(()=>scheduleBuild(80));
  themeObserver.observe(document.body,{
    attributes:true,
    attributeFilter:['data-theme']
  });

  // Team select opens after cartridge selection.
  const setup=document.getElementById('setupModal');
  if(setup){
    const setupObserver=new MutationObserver(()=>{
      // v1.00.245 — setup can paint before the delayed Castle rebuild.
      // Hide a parked right-side/final frame immediately on visibility change.
      if(C65.layer) C65.layer.style.visibility='hidden';
      if(setup.classList.contains('active') && isCastle()) scheduleBuild(0);
      else scheduleBuild(100);
    });
    setupObserver.observe(setup,{
      attributes:true,
      attributeFilter:['class']
    });
  }

  // Hook the existing stage initializer without watching actor style changes.
  const oldInit=window.initTeamSelectStage;
  if(typeof oldInit==='function'){
    window.initTeamSelectStage=function(){
      const result=oldInit.apply(this,arguments);
      scheduleBuild(90);
      return result;
    };
  }
})();
</script>

<script>
/* v1.00.42 — keep LEFT/RIGHT team score rows perfectly aligned.
   This is measurement-based, so iPad, desktop, browser zoom and font loading
   cannot make the audio panel overlap the first team card. */
(function(){
  let hudAlignRaf = 0;

  function alignTeamHudStart(){
    const leftBar = document.getElementById('leftGameBar');
    const rightBar = document.getElementById('rightGameBar');
    if (!leftBar || !rightBar) return;

    /* v1.00.167 — 질문/결과 모달이 열려 있을 때는 오디오 믹서가
       display:none으로 숨겨진다. 이 상태에서 다시 측정하면 왼쪽 HUD의
       시작점이 side-brand 기준으로 축소되어 점수 카드가 위로 튀어 오른다.
       모달이 닫힐 때 body class 변화로 다시 측정되므로, 열린 동안에는
       직전의 정상 위치를 그대로 유지한다. */
    const quizModal = document.getElementById('modal');
    if (quizModal && quizModal.classList.contains('active')) return;

    const leftAudio = document.getElementById('teamAudioMixer');
    const leftBrand = leftBar.querySelector('.side-brand');
    const rightRound = document.getElementById('sideRoundDisplay');
    const rightLabel = rightBar.querySelector('.side-round-label');

    const leftRect = leftBar.getBoundingClientRect();
    const rightRect = rightBar.getBoundingClientRect();

    function visibleBottom213(el, hostRect){
      if (!el) return 0;
      const cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden') return 0;
      const r = el.getBoundingClientRect();
      if (r.width <= 0 || r.height <= 0) return 0;
      return r.bottom - hostRect.top;
    }

    /* RC2 — TEAM header stack contains brand + audio only. */
    const leftBottom = Math.max(
      visibleBottom213(leftBrand, leftRect),
      visibleBottom213(leftAudio, leftRect)
    );

    const rightBottom = Math.max(
      visibleBottom213(rightLabel, rightRect),
      visibleBottom213(rightRound, rightRect)
    );

    /* 18px breathing room below the taller top section.
       Both score columns receive the exact same start line. */
    const start = Math.max(leftBottom, rightBottom) + 18;
    const px = Math.max(0, Math.round(start)) + 'px';

    leftBar.style.setProperty('--hud-header-zone-dynamic', px);
    rightBar.style.setProperty('--hud-header-zone-dynamic', px);

    /* v1.00.225 — fit every TEAM score card inside the actually visible
       sidebar height. The board already follows visualViewport; the side HUD
       now follows the same rule instead of allowing lower team cards to clip. */
    const leftHud = document.getElementById('scoreHudLeft');
    const rightHud = document.getElementById('scoreHudRight');
    const leftCount = leftHud ? leftHud.children.length : 0;
    const rightCount = rightHud ? rightHud.children.length : 0;
    const maxCount = Math.max(leftCount, rightCount, 1);

    const vv = window.visualViewport;
    const visibleH = (vv && vv.height) ? vv.height : window.innerHeight;
    const barBottomSafety = visibleH <= 650 ? 8 : 14;
    const availableScoreH = Math.max(
      120,
      Math.min(leftRect.height, rightRect.height, visibleH - 24) - start - barBottomSafety
    );

    let gap225 = visibleH <= 650 ? 7 : (visibleH <= 760 ? 9 : 14);
    let cardH225 = Math.floor(
      (availableScoreH - gap225 * Math.max(0, maxCount - 1)) / maxCount
    );

    /* If many teams share a short viewport, reduce gaps before reducing cards. */
    if (cardH225 < 58 && gap225 > 5) {
      gap225 = 5;
      cardH225 = Math.floor(
        (availableScoreH - gap225 * Math.max(0, maxCount - 1)) / maxCount
      );
    }

    cardH225 = Math.max(44, Math.min(126, cardH225));
    const scale225 = Math.max(.52, Math.min(1, cardH225 / 100));

    [leftBar, rightBar].forEach(function(bar){
      bar.style.setProperty('--team-score-card-h-225', Math.round(cardH225) + 'px');
      bar.style.setProperty('--team-score-gap-225', Math.round(gap225) + 'px');
      bar.style.setProperty('--team-score-scale-225', scale225.toFixed(3));
    });
  }

  function queueTeamHudAlign(){
    if (hudAlignRaf) cancelAnimationFrame(hudAlignRaf);
    hudAlignRaf = requestAnimationFrame(function(){
      hudAlignRaf = 0;
      alignTeamHudStart();
    });
  }

  window.addEventListener('resize', queueTeamHudAlign, {passive:true});
  window.addEventListener('teamhudfit225', queueTeamHudAlign);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', queueTeamHudAlign, {passive:true});
  }
  window.addEventListener('orientationchange', function(){
    setTimeout(queueTeamHudAlign, 120);
  });

  document.addEventListener('DOMContentLoaded', function(){
    queueTeamHudAlign();
    setTimeout(queueTeamHudAlign, 250);
    setTimeout(queueTeamHudAlign, 900);

    if ('ResizeObserver' in window){
      const ro = new ResizeObserver(queueTeamHudAlign);
      [
        document.getElementById('leftGameBar'),
        document.getElementById('rightGameBar'),
        document.getElementById('teamAudioMixer'),
        document.querySelector('#leftGameBar .side-brand'),
        document.getElementById('sideRoundDisplay')
      ].filter(Boolean).forEach(function(el){ ro.observe(el); });
    }

    if (document.fonts && document.fonts.ready){
      document.fonts.ready.then(queueTeamHudAlign).catch(function(){});
    }
  });

  /* Theme switching can change font metrics/colors and image dimensions. */
  const bodyObserver = new MutationObserver(queueTeamHudAlign);
  function watchBody(){
    if (document.body){
      bodyObserver.observe(document.body, {
        attributes:true,
        attributeFilter:['class','data-theme','data-stage-variant']
      });
    }
  }
  if (document.body) watchBody();
  else document.addEventListener('DOMContentLoaded', watchBody, {once:true});
})();
</script>

<script>
/* v1.00.38 — shrink team-select caption only when necessary.
   This measures the real rendered white strip, so iPad / wide monitor /
   browser zoom differences cannot push the text outside it. */
function fitTeamSelectCaption(){
  const el = document.querySelector('#setupModal .stage-select-caption');
  if (!el) return;

  const maxPx = Math.max(12, Math.min(24, window.innerWidth * 0.015));
  const minPx = 9;

  el.style.fontSize = maxPx + 'px';

  const fits = () =>
    el.scrollWidth <= el.clientWidth - 2 &&
    el.scrollHeight <= el.clientHeight - 2;

  if (fits()) return;

  let lo = minPx;
  let hi = maxPx;
  for (let i = 0; i < 12; i++) {
    const mid = (lo + hi) / 2;
    el.style.fontSize = mid + 'px';
    if (fits()) lo = mid;
    else hi = mid;
  }
  el.style.fontSize = Math.max(minPx, lo - 0.25) + 'px';
}

let teamCaptionFitRaf = 0;
function queueTeamCaptionFit(){
  if (teamCaptionFitRaf) cancelAnimationFrame(teamCaptionFitRaf);
  teamCaptionFitRaf = requestAnimationFrame(() => {
    teamCaptionFitRaf = 0;
    fitTeamSelectCaption();
  });
}

window.addEventListener('resize', queueTeamCaptionFit, {passive:true});
window.addEventListener('orientationchange', () => setTimeout(queueTeamCaptionFit, 120));

document.addEventListener('DOMContentLoaded', () => {
  queueTeamCaptionFit();
  const caption = document.querySelector('#setupModal .stage-select-caption');
  if (caption && 'ResizeObserver' in window) {
    const ro = new ResizeObserver(queueTeamCaptionFit);
    ro.observe(caption);
    const card = document.querySelector('#setupModal .setup-card.mario-stage-select');
    if (card) ro.observe(card);
  }
});
</script>

<script>
/* v1.00.40 — escape ancestor stacking contexts while a question/result is open. */
(function(){
  let modalHome = null;
  let modalNextSibling = null;

  function liftQuizModal(){
    const modal = document.getElementById('modal');
    if (!modal) return;

    const active = modal.classList.contains('active');

    if (active && modal.parentElement !== document.body){
      modalHome = modal.parentElement;
      modalNextSibling = modal.nextSibling;
      document.body.appendChild(modal);
    } else if (!active && modalHome && modal.parentElement === document.body){
      if (modalNextSibling && modalNextSibling.parentNode === modalHome){
        modalHome.insertBefore(modal, modalNextSibling);
      } else {
        modalHome.appendChild(modal);
      }
      modalHome = null;
      modalNextSibling = null;
    }
  }

  function initQuizModalTopLayer(){
    const modal = document.getElementById('modal');
    if (!modal) return;
    liftQuizModal();
    const observer = new MutationObserver(liftQuizModal);
    observer.observe(modal, {attributes:true, attributeFilter:['class']});
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initQuizModalTopLayer, {once:true});
  } else {
    initQuizModalTopLayer();
  }
})();
</script>

  function refreshCastleIntro66(){
    const host=document.getElementById('introStageBg');
    if(!host)return;

    if(document.body.dataset.theme!=='castle') return;

      const offset=Math.max(0,Math.min(Math.max(0,mapW-w),bridgeX-desired));

    const introMario=document.getElementById('introWalkingMario');

})();

<script>
/* v1.00.75 — Castle ceiling down 2 tiles, intro Mario up 4px,
   team Mario/Bowser down 1px, chain/axe right 1 tile.
   Uses only the user's uploaded exact 16x16 Castle tiles. */
(function(){
  const COLS=76;
  const ROWS=13;
  const FLOOR_ROW=11;
  const BRIDGE_START=52;
  /* v73 extends the bridge farther right so Bowser never floats above a hole. */
  const BRIDGE_END=69;
  const RAISED_WALL_START=71;

  function tile(layer,col,row,type,tilePx,z){
    const d=document.createElement('div');
    d.className='castle69-tile castle70-'+type;
    d.style.left=(col*tilePx)+'px';
    d.style.top=(row*tilePx)+'px';
    d.style.zIndex=String(z==null?1:z);

    if(type==='bridge') d.style.backgroundImage=`url("${CASTLE69_BRIDGE_TILE}")`;
    else if(type==='lava') d.style.backgroundImage=`url("${CASTLE69_LAVA_TILE}")`;
    else if(type==='chain') d.style.backgroundImage=`url("${CASTLE70_CHAIN_TILE}")`;
    else if(type==='axe') d.style.backgroundImage=`url("${CASTLE70_AXE_TILE}")`;
    else d.style.backgroundImage=`url("${CASTLE69_BRICK_TILE}")`;

    layer.appendChild(d);
    return d;
  }

  window.buildCastle69TileMap=function(host,extraClass){
    if(!host)return null;

    const tilePx=Math.max(16,Math.round((host.clientHeight||416)/ROWS));
    const map=document.createElement('div');
    map.className='castle69-map '+(extraClass||'');
    map.style.setProperty('--castle69-tile',tilePx+'px');
    map.style.width=(COLS*tilePx)+'px';
    /* v74: map itself always covers the full visible stage height. */
    map.style.height='100%';

    function bottomFill(leftCol,rightCol,topPx,kind){
      const d=document.createElement('div');
      d.className='castle74-bottom-fill castle74-bottom-fill-'+kind;
      d.style.position='absolute';
      d.style.left=(leftCol*tilePx)+'px';
      d.style.top=topPx+'px';
      d.style.width=((rightCol-leftCol)*tilePx)+'px';
      d.style.bottom='0';
      d.style.zIndex='0';
      if(kind==='brick'){
        d.style.backgroundImage=`url("${CASTLE69_BRICK_TILE}")`;
        d.style.backgroundRepeat='repeat';
        d.style.backgroundSize=tilePx+'px '+tilePx+'px';
        d.style.imageRendering='pixelated';
      }else{
        d.style.background='#D82800';
      }
      map.appendChild(d);
      return d;
    }

    /* These backing fills continue to the REAL bottom of the stage, not merely
       to the last logical tile row. This removes the large black void on tall
       team-select layouts. */
    bottomFill(0,BRIDGE_START,FLOOR_ROW*tilePx,'brick');
    bottomFill(BRIDGE_START,RAISED_WALL_START,(FLOOR_ROW+1)*tilePx + 48,'lava');
    bottomFill(RAISED_WALL_START,COLS,(FLOOR_ROW-1)*tilePx,'brick');

    /* ===== Ceiling =====
       v1.00.75: move the complete ceiling structure DOWN exactly 2 tiles.
       Rows 0-1 are intentionally left empty so the top remains black. */
    for(let c=0;c<COLS;c++){
      tile(map,c,2,'brick',tilePx,1);
      tile(map,c,3,'brick',tilePx,1);
    }
    for(let c=4;c<=11;c++) tile(map,c,4,'brick',tilePx,1);
    for(let c=29;c<=34;c++) tile(map,c,4,'brick',tilePx,1);
    for(let c=68;c<COLS;c++) tile(map,c,4,'brick',tilePx,1);

    /* ===== Left / approach floor =====
       Flat walking line, and EVERY cell below it is filled with Castle brick.
       No black pits remain underneath. */
    for(let c=0;c<BRIDGE_START;c++){
      for(let r=FLOOR_ROW;r<ROWS;r++){
        tile(map,c,r,'brick',tilePx,1);
      }
    }

    /* ===== Lava bridge + lower lava fill =====
       Bridge continues under Bowser. Everything below the bridge is lava,
       so there is no empty black cavity under Bowser or the bridge. */
    for(let c=BRIDGE_START;c<BRIDGE_END;c++){
      tile(map,c,FLOOR_ROW,'bridge',tilePx,4);
      /* v1.00.77: leave one clean black gap under the bridge, then start lava lower. */
      const lavaTop=(FLOOR_ROW+1)*tilePx + 48;
      const lavaSurface=document.createElement('div');
      lavaSurface.className='castle69-tile castle70-lava';
      lavaSurface.style.left=(c*tilePx)+'px';
      lavaSurface.style.top=lavaTop+'px';
      lavaSurface.style.zIndex='2';
      lavaSurface.style.backgroundImage=`url("${CASTLE69_LAVA_TILE}")`;
      map.appendChild(lavaSurface);
      const lavaFill=document.createElement('div');
      lavaFill.className='castle74-bottom-fill castle74-bottom-fill-lava';
      lavaFill.style.position='absolute';
      lavaFill.style.left=(c*tilePx)+'px';
      lavaFill.style.top=(lavaTop+tilePx)+'px';
      lavaFill.style.width=tilePx+'px';
      lavaFill.style.bottom='0';
      lavaFill.style.background='#D82800';
      lavaFill.style.zIndex='1';
      map.appendChild(lavaFill);
    }

    /* ===== Axe / chain / rear wall =====
       Exactly ONE chain tile. The rear castle wall starts ONE TILE HIGHER than
       the bridge and the chain visually links the bridge end to that wall. */
    tile(map,BRIDGE_END+1,FLOOR_ROW-1,'chain',tilePx,5);
    tile(map,BRIDGE_END+2,FLOOR_ROW-2,'axe',tilePx,6);

    /* Fill underneath the one-cell chain/axe gap with lava so nothing floats. */
    function addLoweredLavaColumn(col){
      const lavaTop=(FLOOR_ROW+1)*tilePx + 48;
      const surf=document.createElement('div');
      surf.className='castle69-tile castle70-lava';
      surf.style.left=(col*tilePx)+'px';
      surf.style.top=lavaTop+'px';
      surf.style.zIndex='2';
      surf.style.backgroundImage=`url("${CASTLE69_LAVA_TILE}")`;
      map.appendChild(surf);
      const fill=document.createElement('div');
      fill.className='castle74-bottom-fill castle74-bottom-fill-lava';
      fill.style.position='absolute';
      fill.style.left=(col*tilePx)+'px';
      fill.style.top=(lavaTop+tilePx)+'px';
      fill.style.width=tilePx+'px';
      fill.style.bottom='0';
      fill.style.background='#D82800';
      fill.style.zIndex='1';
      map.appendChild(fill);
    }

    if(FLOOR_ROW<ROWS) tile(map,BRIDGE_END,FLOOR_ROW,'bridge',tilePx,4);
    addLoweredLavaColumn(BRIDGE_END);

    /* v74: close the final one-tile black gap immediately before the raised wall. */
    if(FLOOR_ROW<ROWS) tile(map,BRIDGE_END+1,FLOOR_ROW,'bridge',tilePx,4);
    addLoweredLavaColumn(BRIDGE_END+1);

    /* Rear wall: top edge is one tile higher than bridge. Fill all the way down. */
    for(let c=RAISED_WALL_START;c<COLS;c++){
      for(let r=FLOOR_ROW-1;r<ROWS;r++){
        tile(map,c,r,'brick',tilePx,1);
      }
    }

    map._castle69={
      cols:COLS,
      rows:ROWS,
      floorRow:FLOOR_ROW,
      bridgeStart:BRIDGE_START,
      bridgeEnd:BRIDGE_END,
      raisedWallStart:RAISED_WALL_START,
      tilePx:tilePx
    };
    return map;
  };
})();
</script>

  function addTile(map,c,r,src,cls){
    const d=document.createElement('div');
    d.className='ow83-tile '+cls;
    d.style.left=(c*16)+'px';
    d.style.top=(r*16)+'px';
    d.style.backgroundImage=`url("${src}")`;
    map.appendChild(d);
    return d;
  }

  function build(host,extraClass){
    if(!host) return null;
    const old=host.querySelector(':scope > .ow83-map');
    if(old) old.remove();
    const map=document.createElement('div');
    map.className='ow83-map '+(extraClass||'');

    TILE_PLACEMENTS.forEach(([c,r,id])=>addTile(map,c,r,TILE_ASSETS[id],'ow83-static'));

    // Ground is two true 16x16 logical rows, reconstructed to match the old
    // repeated 16x15 ground strip at native 688x240 resolution.
    for(let c=0;c<COLS;c++){
      addTile(map,c,FLOOR_ROW,GROUND_ROWS[0],'ow83-ground');
      addTile(map,c,FLOOR_ROW+1,GROUND_ROWS[1],'ow83-ground');
    }

    Q_POSITIONS.forEach(([c,r])=>{
      const q=addTile(map,c,r,Q_FRAMES[0],'ow83-question');
      q.style.setProperty('--ow83-q1',`url("${Q_FRAMES[0]}")`);
      q.style.setProperty('--ow83-q2',`url("${Q_FRAMES[1]}")`);
      q.style.setProperty('--ow83-q3',`url("${Q_FRAMES[2]}")`);
    });

    host.insertBefore(map,host.firstChild);
    scaleMap(host,map);
    map._ow83={cols:COLS,rows:ROWS,floorRow:FLOOR_ROW,nativeW:NATIVE_W,nativeH:NATIVE_H};
    return map;
  }

  function scaleMap(host,map){
    if(!host||!map)return;
    const h=host.clientHeight||NATIVE_H;
    const scale=h/NATIVE_H;
    map.style.transform=`scale(${scale})`;
    // Expose the common 16px grid in rendered pixels for later actor binding.
    host.style.setProperty('--ow83-tile-px',(16*scale)+'px');
    host.style.setProperty('--ow83-floor-px',(32*scale)+'px');
  }

  function refresh(){
    if(!document.body || document.body.dataset.theme!=='overworld'){
      document.querySelectorAll('.ow83-map').forEach(x=>x.remove());
      return;
    }
    const intro=document.getElementById('introStageBg');
    if(intro) build(intro,'ow83-intro-map');
    document.querySelectorAll('#setupModal .stage-panel').forEach(p=>build(p,'ow83-team-map'));
  }

  function rescale(){
    if(!document.body || document.body.dataset.theme!=='overworld')return;
    document.querySelectorAll('.ow83-map').forEach(map=>{
      const host=map.parentElement;
      scaleMap(host,map);
    });
  }

  window.buildOverworld83TileMap=build;
  window.refreshOverworld83TileMaps=refresh;
  window.OVERWORLD83_MAP={cols:COLS,rows:ROWS,floorRow:FLOOR_ROW,tile:16};

  window.addEventListener('load',()=>setTimeout(refresh,220));
  window.addEventListener('resize',()=>requestAnimationFrame(rescale),{passive:true});
  document.addEventListener('DOMContentLoaded',()=>setTimeout(refresh,100),{once:true});

  const startObserver=()=>{
    if(!document.body)return;
    let queued=false;
    const schedule=()=>{
      if(queued)return; queued=true;
      setTimeout(()=>{queued=false;refresh();},80);
    };
    new MutationObserver(muts=>{
      for(const m of muts){
        if(m.type==='attributes' || Array.from(m.addedNodes||[]).some(n=>n.nodeType===1 && (n.matches?.('.stage-panel')||n.querySelector?.('.stage-panel')))){
          schedule(); break;
        }
      }
    }).observe(document.body,{attributes:true,attributeFilter:['data-theme'],childList:true,subtree:true});
  };
  if(document.body) startObserver(); else document.addEventListener('DOMContentLoaded',startObserver,{once:true});
})();
</script>

<script>
(function(){
  const TILE=16, NATIVE_H=240, FLOOR_ROW=13;
  // Native-grid placement. Integer tile coordinate first; any legacy visual nudge is
  // isolated in offsetX/offsetY instead of being scattered through percentage CSS.
  const TEAM_ACTORS={
    walkingMario:    {tileX:3,  offsetX:3.6,  floorOffset:0, hTiles:1},
    walkingGoomba:   {tileX:10, offsetX:15.4, floorOffset:0, hTiles:1},
    walkingKoopa:    {tileX:18, offsetX:11.3, floorOffset:0, hTiles:1.5},
    walkingSpike:    {tileX:26, offsetX:3.7,  floorOffset:0, hTiles:1.125},
    walkingMushroom: {tileX:35, offsetX:7.6,  floorOffset:0, hTiles:1},
  };

  function nativeScale(host){ return (host?.clientHeight || NATIVE_H)/NATIVE_H; }
  function setImp(el,k,v){ if(el) el.style.setProperty(k,v,'important'); }

  function bindTeamActors(){
    if(!document.body || document.body.dataset.theme!=='overworld') return;
    const host=document.querySelector('#setupModal .team-stage-window');
    if(!host) return;
    const scale=nativeScale(host);
    const floorBottom=(NATIVE_H - FLOOR_ROW*TILE)*scale; // 32 native px
    Object.entries(TEAM_ACTORS).forEach(([id,a])=>{
      const el=document.getElementById(id); if(!el)return;
      setImp(el,'left',((a.tileX*TILE+a.offsetX)*scale)+'px');
      setImp(el,'bottom',(floorBottom+a.floorOffset*scale)+'px');
      setImp(el,'height',(a.hTiles*TILE*scale)+'px');
    });
    // Killer is airborne, but its X/Y anchor is still expressed in the same tile grid.
    const killer=document.getElementById('flyingKiller');
    if(killer){
      setImp(killer,'left',(43*TILE*scale)+'px');
      setImp(killer,'right','auto');
      setImp(killer,'bottom',(6*TILE*scale)+'px');
      setImp(killer,'height',(1*TILE*scale)+'px');
    }
  }

  function bindIntroMario(){
    if(!document.body || document.body.dataset.theme!=='overworld') return;
    const host=document.getElementById('introStageBg');
    const mario=document.getElementById('introWalkingMario');
    if(!host||!mario)return;
    const scale=nativeScale(host);
    const floorBottom=(NATIVE_H - FLOOR_ROW*TILE)*scale;
    // 1x1 native tile. Horizontal walk/run keyframes remain untouched.
    setImp(mario,'bottom',floorBottom+'px');
    setImp(mario,'height',(TILE*scale)+'px');
  }

  function buildScoreMap(){
    if(!document.body || document.body.dataset.theme!=='overworld') return;
    const stage=document.getElementById('soloRankingStage');
    if(!stage || typeof window.buildOverworld83TileMap!=='function') return;
    window.buildOverworld83TileMap(stage,'ow84-score-map');
    // Ranking screen can be wider than one 688px native map. Clone enough copies
    // side-by-side while reusing the exact same tile DOM/data.
    const first=stage.querySelector(':scope > .ow84-score-map');
    if(!first)return;
    const scale=nativeScale(stage);
    const renderedW=688*scale;
    const need=Math.max(1,Math.ceil((stage.clientWidth||renderedW)/renderedW));
    for(let i=1;i<need;i++){
      const clone=first.cloneNode(true);
      clone.classList.add('ow84-score-clone');
      clone.style.left=(688*i)+'px';
      stage.insertBefore(clone,stage.firstChild);
    }
  }

  function applyAll(){
    if(!document.body || document.body.dataset.theme!=='overworld')return;
    bindIntroMario(); bindTeamActors();
  }

  // Reuse the tile map in the SOLO score/game-over screen.
  const prevInitSoloRankingScene=initSoloRankingScene;
  initSoloRankingScene=function(){
    prevInitSoloRankingScene();
    if(document.body?.dataset?.theme==='overworld'){
      const stage=document.getElementById('soloRankingStage');
      if(stage){
        stage.style.setProperty('--solo-rank-stage-img','none');
        stage.style.setProperty('--solo-rank-q1','none');
        stage.style.setProperty('--solo-rank-ground','none');
      }
      requestAnimationFrame(buildScoreMap);
    }
  };

  // Team init can rewrite legacy percentage positions; re-bind immediately afterwards.
  const prevInitTeamSelectStage=initTeamSelectStage;
  initTeamSelectStage=function(){
    prevInitTeamSelectStage();
    requestAnimationFrame(bindTeamActors);
  };
  const prevInitIntroStage=initIntroStage;
  initIntroStage=function(){
    prevInitIntroStage();
    requestAnimationFrame(bindIntroMario);
  };

  window.OVERWORLD84_ACTOR_GRID={tile:TILE,floorRow:FLOOR_ROW,team:TEAM_ACTORS};
  window.addEventListener('load',()=>setTimeout(applyAll,260));
  window.addEventListener('resize',()=>requestAnimationFrame(()=>{applyAll(); if(document.body?.dataset?.theme==='overworld' && document.body.classList.contains('solo-gameover-open')) buildScoreMap();}),{passive:true});
  document.addEventListener('DOMContentLoaded',()=>setTimeout(applyAll,120),{once:true});
  const start=()=>{
    if(!document.body)return;
    new MutationObserver(()=>setTimeout(applyAll,80)).observe(document.body,{attributes:true,attributeFilter:['data-theme']});
  };
  if(document.body)start(); else document.addEventListener('DOMContentLoaded',start,{once:true});
})();
</script>

<script>
/* v1.00.90 — native SOLO underwater bubble motion.
   No lifetime timer: bubbles keep rising and are removed only after the visible
   4×4 center leaves the top of the easter-egg grid. */
(function(){
  function ensureSoloBubbleLayer(host){
    if(!host)return null;
    let layer=Array.from(host.children||[]).find(el=>el.classList&&el.classList.contains('solo-bubble-layer'));
    if(!layer){
      layer=document.createElement('div');
      layer.className='solo-bubble-layer';
      host.appendChild(layer);
    }
    return layer;
  }

  function riseNativeSoloBubble(bubble, host, speed=34, drift=5){
    let y=parseFloat(bubble.style.top)||0;
    const x0=parseFloat(bubble.style.left)||0;
    const phase=Math.random()*Math.PI*2;
    let last=performance.now();
    function tick(now){
      if(!bubble.isConnected)return;
      const dt=Math.min(.04,(now-last)/1000); last=now;
      y-=speed*dt;
      const x=x0+Math.sin(now/430+phase)*drift;
      bubble.style.left=x+'px';
      bubble.style.top=y+'px';
      // visible 4×4 pixels sit within the native 8×16 canvas; cull by its center.
      if(y+8<=0){bubble.remove();return;}
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  emitSoloUnderwaterBubble=function(){
    if(getCurrentSoloThemeId()!=='underwater')return;
    const mario=document.getElementById('soloDecorMario');
    const host=document.getElementById('soloDecorLeft');
    if(!mario||!host)return;
    const layer=ensureSoloBubbleLayer(host); if(!layer)return;
    // v270: easter-egg Mario may have only one of HIS bubbles on screen at once.
    if(layer.querySelector('.solo-air-bubble[data-mario-easter="1"]'))return;
    const mr=mario.getBoundingClientRect(), hr=host.getBoundingClientRect();
    const bubble=document.createElement('img');
    bubble.className='solo-air-bubble'; bubble.src=SOLO_UNDERWATER_BUBBLE; bubble.alt='';
    bubble.dataset.marioEaster='1';
    bubble.style.left=((mr.left-hr.left)+mr.width*(soloUnderwaterFacingLeft ? .20 : .80))+'px';
    bubble.style.top=((mr.top-hr.top)+mr.height*.30)+'px';
    layer.appendChild(bubble);
    riseNativeSoloBubble(bubble,host,32,3.5);
  };

  emitSoloBlooperBubbleBurst=function(blooper,count=18){
    if(getCurrentSoloThemeId()!=='underwater'||!blooper)return;
    const host=document.getElementById('soloDecorLeft'); if(!host)return;
    const layer=ensureSoloBubbleLayer(host); if(!layer)return;
    const br=blooper.getBoundingClientRect(), hr=host.getBoundingClientRect();
    const cx=(br.left-hr.left)+br.width*.52, cy=(br.top-hr.top)+br.height*.42;
    for(let i=0;i<count;i++){
      const bubble=document.createElement('img');
      bubble.className='solo-air-bubble'; bubble.src=SOLO_UNDERWATER_BUBBLE; bubble.alt='';
      bubble.style.left=(cx+(Math.random()-.5)*br.width*.75)+'px';
      bubble.style.top=(cy+(Math.random()-.5)*br.height*.40)+'px';
      layer.appendChild(bubble);
      riseNativeSoloBubble(bubble,host,28+Math.random()*16,3+Math.random()*4);
    }
  };

  window.SOLO_EASTER_GRID_V90={nativeTile:16,renderTile:32,cols:7,rows:5,bubbleCanvas:[8,16],bubbleVisible:[4,4],bubbleScale:1};
})();
</script>

<script>
/* v1.00.94 — measure the rendered SCORE panel and scale the 7-column
   easter-egg tile grid to exactly the same left/right width. */
(function(){
  function fitSoloEasterEggToScore(){
    if(!document.body || !document.body.classList.contains('solo-mode')) return;
    const score=document.getElementById('soloHudLeft');
    const decor=document.getElementById('soloDecorLeft');
    if(!score || !decor) return;

    const r=score.getBoundingClientRect();
    if(!(r.width>0)) return;

    const cols=7;
    const tile=r.width/cols;

    /* One authoritative display tile. All v90+ actor/floor/coral positions
       are already expressed as multiples of --solo-ee-tile. */
    decor.style.setProperty('--solo-ee-tile', tile+'px');
    decor.style.setProperty('--solo-ee-scale', String(tile/16));
    decor.style.setProperty('width', r.width+'px', 'important');
    decor.style.setProperty('height', (tile*5)+'px', 'important');
    decor.style.setProperty('left', r.left+'px', 'important');
  }

  window.fitSoloEasterEggToScore=fitSoloEasterEggToScore;

  const run=()=>requestAnimationFrame(()=>requestAnimationFrame(fitSoloEasterEggToScore));
  window.addEventListener('resize',run,{passive:true});
  window.addEventListener('orientationchange',run,{passive:true});
  document.addEventListener('DOMContentLoaded',run);

  if(window.ResizeObserver){
    const ro=new ResizeObserver(run);
    const attach=()=>{
      const score=document.getElementById('soloHudLeft');
      if(score) ro.observe(score);
    };
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',attach,{once:true});
    else attach();
  }

  /* Re-fit when SOLO is entered/rebuilt. */
  const mo=new MutationObserver(run);
  const startObserve=()=>{
    if(document.body) mo.observe(document.body,{attributes:true,attributeFilter:['class','data-theme']});
  };
  if(document.body) startObserve();
  else document.addEventListener('DOMContentLoaded',startObserve,{once:true});

  run();
})();
</script>

<script>
/* =========================================================
   v1.00.96 — one integer-edge renderer for every world.
   edge(n) = round(n * renderedLogicalTileSize)
   Adjacent cells therefore share the exact same physical pixel boundary.
   ========================================================= */
(function(){
  const LOGICAL_TILE=16;
  const ROWS=15;
  let raf=0;

  function edge(index,tileFloat){ return Math.round(index*tileFloat); }
  function span(index,count,tileFloat){ return edge(index+count,tileFloat)-edge(index,tileFloat); }

  function snapNativeMap(map,tileSelector,cssVar){
    if(!map || !map.parentElement) return;
    const host=map.parentElement;
    const h=host.clientHeight||240;
    if(h<20) return;
    const tf=h/ROWS;
    const tiles=map.querySelectorAll(tileSelector);
    map.classList.add('v96-snapped');
    map.style.width=edge(43,tf)+'px';
    map.style.height=edge(ROWS,tf)+'px';
    map.style.transform='none';
    if(cssVar) host.style.setProperty(cssVar,tf+'px');

    tiles.forEach(el=>{
      if(!el.dataset.v96Col){
        const l=parseFloat(el.style.left)||0;
        const t=parseFloat(el.style.top)||0;
        el.dataset.v96Col=String(Math.round(l/LOGICAL_TILE));
        el.dataset.v96Row=String(Math.round(t/LOGICAL_TILE));
      }
      const c=+el.dataset.v96Col, r=+el.dataset.v96Row;
      const x0=edge(c,tf), x1=edge(c+1,tf);
      const y0=edge(r,tf), y1=edge(r+1,tf);
      el.style.left=x0+'px';
      el.style.top=y0+'px';
      el.style.width=(x1-x0)+'px';
      el.style.height=(y1-y0)+'px';
      if(el.classList.contains('ow83-tile') || el.classList.contains('ug85-tile')){
        el.style.backgroundSize=(x1-x0)+'px '+(y1-y0)+'px';
      }
    });
  }

  function snapUnderwaterCoral(){
    document.querySelectorAll('.uw49-coral-layer').forEach(layer=>{
      const host=layer.parentElement;
      if(!host) return;
      const h=host.clientHeight||480;
      const tf=h/ROWS;
      layer.querySelectorAll('.uw49-coral-tile').forEach(el=>{
        if(!el.dataset.v96Tx){
          el.dataset.v96Tx=String(Math.round((parseFloat(el.style.left)||0)/tf));
          el.dataset.v96BottomRow=String(Math.round((parseFloat(el.style.bottom)||0)/tf));
        }
        const tx=+el.dataset.v96Tx;
        const br=+el.dataset.v96BottomRow;
        const x0=edge(tx,tf),x1=edge(tx+1,tf);
        const b0=edge(br,tf),b1=edge(br+1,tf);
        el.style.left=x0+'px';
        el.style.width=(x1-x0)+'px';
        el.style.height=(b1-b0)+'px';
        el.style.bottom=b0+'px';
      });
    });

    document.querySelectorAll('#introStageBg').forEach(host=>{
      if(document.body?.dataset?.theme!=='underwater') return;
      const tf=(host.clientHeight||480)/ROWS;
      const snapped=Math.max(1,Math.round(tf));
      host.style.setProperty('--uw55-tile-px',snapped+'px');
      const wave=host.querySelector('.uw54-surface-strip');
      if(wave) wave.style.backgroundSize=snapped+'px '+snapped+'px';
    });

    document.querySelectorAll('.uw87-score-map').forEach(map=>{
      const host=map.parentElement;
      if(!host)return;
      const tf=(host.clientHeight||240)/ROWS;
      const snapped=Math.max(1,Math.round(tf));
      map.querySelectorAll('.uw87-score-wave,.uw87-score-ground').forEach(el=>{
        el.style.backgroundSize=snapped+'px '+snapped+'px';
      });
    });
  }

  function verifyCastle(){
    /* Castle already builds with Math.round(hostHeight / rows).
       Keep it untouched; expose the same integer-edge contract for diagnostics. */
    document.querySelectorAll('.castle69-map').forEach(map=>{
      const meta=map._castle69;
      if(meta && Number.isFinite(meta.tilePx)) map.dataset.v96TilePx=String(Math.round(meta.tilePx));
    });
  }

  function apply(){
    raf=0;
    document.querySelectorAll('.ow83-map').forEach(m=>snapNativeMap(m,'.ow83-tile','--ow83-tile-px'));
    document.querySelectorAll('.ug85-map').forEach(m=>snapNativeMap(m,'.ug85-tile','--ug85-tile-px'));
    snapUnderwaterCoral();
    verifyCastle();
  }
  function schedule(){ if(raf)return; raf=requestAnimationFrame(()=>requestAnimationFrame(apply)); }

  window.applySharedIntegerTileEdgesV96=apply;
  window.addEventListener('load',schedule);
  window.addEventListener('resize',schedule,{passive:true});
  window.addEventListener('orientationchange',schedule,{passive:true});
  document.addEventListener('DOMContentLoaded',schedule,{once:true});
  const mo=new MutationObserver(schedule);
  const observe=()=>document.body&&mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['data-theme','class']});
  if(document.body) observe(); else document.addEventListener('DOMContentLoaded',observe,{once:true});
  schedule();
})();
</script>

<script>
/* =========================================================
   v1.00.97 — native-raster compositor.
   16x16 source tiles are composited 1:1 first; browsers scale only ONE canvas.
   ========================================================= */
(function(){
  const NATIVE_TILE=16, BASE_W=688, BASE_H=240, BASE_ROWS=15;
  const imageCache=new Map();
  const activeMaps=new Set();

  function extractUrl(v){
    if(!v)return '';

    return m ? m[1] : '';
  }
  function img(src){
    if(!src || src==='none')return null;
    let rec=imageCache.get(src);
    if(rec)return rec.ok ? rec.im : null;
    const im=new Image();
    rec={im,ok:false}; imageCache.set(src,rec);
    im.onload=()=>{rec.ok=true;schedule();};
    im.onerror=()=>{rec.err=true;};
    im.src=src;
    return null;
  }
  function cssVarUrl(el,name){return extractUrl(el.style.getPropertyValue(name));}
  function sourceUrl(el){return extractUrl(el.style.backgroundImage || getComputedStyle(el).backgroundImage);}
  function getCR(el){
    let c=el.dataset.v97Col, r=el.dataset.v97Row;

      if(el.dataset.v96Col!=null && el.dataset.v96Row!=null){
        c=+el.dataset.v96Col; r=+el.dataset.v96Row;
      }else{
        c=Math.round((parseFloat(el.style.left)||0)/NATIVE_TILE);
        r=Math.round((parseFloat(el.style.top)||0)/NATIVE_TILE);
      }
      el.dataset.v97Col=String(c); el.dataset.v97Row=String(r);
