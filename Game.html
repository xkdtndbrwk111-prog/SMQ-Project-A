<script>
/* =========================================================
   v1.00.283 — CLEAN CATALOG RENDERER
   One state + one renderer. No legacy selector wrapper geometry.
   ========================================================= */
(function(){
  const state283={
    ready:false,
    stage:'grade',
    grade:null,
    subject:null,
    publisher:null,
    cartridgeRows:[],
    selectedCartridges:[],
    multiSelect:false
  };

  function esc283(value){
    return String(value??'')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }
  function gradeLabel283(value){
    const s=String(value??'').trim();
    return /^[1-6]$/.test(s)?`${s}학년`:(s||'기타');
  }
  function rows283(){
    return (Array.isArray(allGameSheets151)?allGameSheets151:[])
      .map(parseGradeSheet151).filter(Boolean);
  }
  function grades283(){
    const out=[...new Set(rows283().map(r=>String(r.grade)))];
    return out.sort((a,b)=>{
      const an=/^[1-6]$/.test(a),bn=/^[1-6]$/.test(b);
      if(an&&bn)return Number(a)-Number(b);
      if(an)return -1;if(bn)return 1;
      return a.localeCompare(b,'ko');
    });
  }
  function subjects283(grade){
    return [...new Set(rows283()
      .filter(r=>String(r.grade)===String(grade))
      .map(r=>r.subject))];
  }
  function publishers283(grade){
    return [...new Set(rows283()
      .filter(r=>String(r.grade)===String(grade)&&r.subject==='영어'&&r.publisher)
      .map(r=>r.publisher))].sort((a,b)=>a.localeCompare(b,'ko'));
  }
  function cartridges283(){
    return rows283().filter(r=>{
      if(String(r.grade)!==String(state283.grade))return false;
      if(r.subject!==state283.subject)return false;
      if(state283.subject==='영어')return r.publisher===state283.publisher;
      return true;
    });
  }

  function ensureHost283(){
    const modal=document.getElementById('cartridgeSelectModal');
    if(!modal)return null;
    modal.classList.remove('smq-subject-layout282');
    modal.classList.add('smq-catalog283-active');
    if(getComputedStyle(modal).position==='static')modal.style.position='relative';

    let host=document.getElementById('smqCatalog283');
    if(host)return host;
    host=document.createElement('section');
    host.id='smqCatalog283';
    host.setAttribute('aria-label','게임 카트리지 선택');
    host.innerHTML=`
      <button type="button" class="cat283-back" id="cat283Back" aria-label="되돌아가기">↩</button>
      <div class="cat283-top">
        <h2 class="cat283-title" id="cat283Title">SELECT GRADE</h2>
        <div class="cat283-context" id="cat283Context"></div>
        <div class="cat283-divider"></div>
      </div>
      <div class="cat283-rail" id="cat283Rail"></div>
      <div class="cat283-merge-footer" id="cat283MergeFooter">
        <button type="button" class="cat283-merge-start" id="cat283MergeStart">다중선택</button>
      </div>
      <div class="cat283-notice" id="cat283Notice" aria-hidden="true">
        <div class="cat283-notice-card" role="dialog" aria-modal="true" aria-labelledby="cat283NoticeText">
          <div class="cat283-notice-text" id="cat283NoticeText"></div>
          <button type="button" class="cat283-notice-ok" id="cat283NoticeOk">확인</button>
        </div>
      </div>`;
    modal.appendChild(host);
    return host;
  }

  function returnIntro283(){
    const modal=document.getElementById('cartridgeSelectModal');
    if(modal)modal.style.display='none';
    const intro=document.getElementById('introOverlay');
    if(intro){
      intro.style.display='';
      intro.style.opacity='1';
    }
    setupStarted=false;
    state283.ready=false;
  }

  function context283(){
    if(state283.stage==='grade')return '';
    if(state283.stage==='subject')return gradeLabel283(state283.grade);
    if(state283.stage==='publisher')return `${gradeLabel283(state283.grade)} · 영어`;
    if(state283.stage==='cartridge'){
      if(state283.subject==='영어'){
        return `${gradeLabel283(state283.grade)} · 영어 · ${state283.publisher||''}`;
      }
      return `${gradeLabel283(state283.grade)} · ${state283.subject||''}`;
    }
    return '';
  }

  function title283(){
    return ({
      grade:'SELECT GRADE',
      subject:'SELECT SUBJECT',
      publisher:'SELECT PUBLISHER',
      cartridge:'SELECT GAME CARTRIDGE'
    })[state283.stage]||'SELECT GRADE';
  }

  function back283(){
    if(state283.stage==='grade')return returnIntro283;
    if(state283.stage==='subject')return ()=>{state283.stage='grade';state283.grade=null;render283();};
    if(state283.stage==='publisher')return ()=>{state283.stage='subject';state283.subject=null;state283.publisher=null;render283();};
    return ()=>{
      state283.selectedCartridges=[];
      state283.multiSelect=false;
      if(state283.subject==='영어'){
        state283.stage='publisher';
        state283.publisher=null;
      }else{
        state283.stage='subject';
        state283.subject=null;
      }
      render283();
    };
  }

  function makeCard283(main,count,onClick,opts={}){
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='cat283-card'+(opts.selected?' is-selected-merge':'');
    btn.onclick=onClick;
    if(opts.selected) btn.setAttribute('aria-pressed','true');
    const labelClass=opts.red?'cat283-label red283':'cat283-label';
    btn.innerHTML=`
      <div class="cat283-grooves"></div>
      ${opts.pak?`<div class="cat283-pak">${esc283(opts.pak)}</div>`:''}
      <div class="${labelClass}">
        <span class="cat283-main">${esc283(main)}</span>
      </div>
      <div class="cat283-count">${esc283(count||'')}</div>
      <div class="cat283-pins"></div>`;
    return btn;
  }

  function fitCardText283(root){
    requestAnimationFrame(()=>{
      root.querySelectorAll('.cat283-main').forEach(el=>{
        let size=38;
        el.style.fontSize=size+'px';
        const box=el.parentElement;
        while(size>18 && (el.scrollWidth>box.clientWidth-18 || el.scrollHeight>box.clientHeight-18)){
          size-=2;
          el.style.fontSize=size+'px';
        }
      });
    });
  }

  function renderGrade283(rail){
    const grades=grades283();
    if(!grades.length){
      rail.innerHTML='<div class="cat283-empty">등록된 카트리지가 없습니다.</div>';
      return;
    }
    grades.forEach(g=>{
      const count=rows283().filter(r=>String(r.grade)===String(g)).length;
      rail.appendChild(makeCard283(
        gradeLabel283(g),
        `${count} CARTRIDGE${count===1?'':'S'}`,
        ()=>{
          selectedGrade151=String(g);
          selectedSubject152=null;
          selectedPublisher154=null;
          state283.grade=String(g);
          state283.subject=null;
          state283.publisher=null;
          state283.stage='subject';
          render283();
        }
      ));
    });
  }

  function renderSubject283(rail){
    const list=subjects283(state283.grade);
    if(!list.length){
      rail.innerHTML='<div class="cat283-empty">등록된 과목이 없습니다.</div>';
      return;
    }
    list.forEach(subject=>{
      const count=rows283().filter(r=>
        String(r.grade)===String(state283.grade)&&r.subject===subject).length;
      rail.appendChild(makeCard283(
        subject,
        `${count} CARTRIDGE${count===1?'':'S'}`,
        ()=>{
          selectedGrade151=String(state283.grade);
          selectedSubject152=subject;
          selectedPublisher154=null;
          state283.subject=subject;
          state283.publisher=null;
          if(subject==='영어'){
            state283.stage='publisher';
          }else{
            state283.cartridgeRows=rows283().filter(r=>
              String(r.grade)===String(state283.grade)&&r.subject===subject);
            state283.selectedCartridges=[];
            state283.multiSelect=false;
            state283.stage='cartridge';
          }
          render283();
        }
      ));
    });
  }

  function renderPublisher283(rail){
    const list=publishers283(state283.grade);
    if(!list.length){
      rail.innerHTML='<div class="cat283-empty">등록된 출판사가 없습니다.</div>';
      return;
    }
    list.forEach(publisher=>{
      const count=rows283().filter(r=>
        String(r.grade)===String(state283.grade)&&
        r.subject==='영어'&&r.publisher===publisher).length;
      rail.appendChild(makeCard283(
        publisher,
        `${count} CARTRIDGE${count===1?'':'S'}`,
        ()=>{
          selectedPublisher154=publisher;
          state283.publisher=publisher;
          state283.cartridgeRows=cartridges283();
          state283.selectedCartridges=[];
          state283.multiSelect=false;
          state283.stage='cartridge';
          render283();
        }
      ));
    });
  }

  function showNotice283(message){
    const notice=document.getElementById('cat283Notice');
    const text=document.getElementById('cat283NoticeText');
    const ok=document.getElementById('cat283NoticeOk');
    if(!notice||!text||!ok)return;
    text.textContent=String(message||'');
    notice.classList.add('is-open');
    notice.setAttribute('aria-hidden','false');
    const close=()=>{
      notice.classList.remove('is-open');
      notice.setAttribute('aria-hidden','true');
    };
    ok.onclick=close;
    notice.onclick=e=>{ if(e.target===notice)close(); };
    requestAnimationFrame(()=>ok.focus());
  }

  function renderCartridge283(rail){
    const list=cartridges283();
    if(!list.length){
      rail.innerHTML='<div class="cat283-empty">등록된 카트리지가 없습니다.</div>';
      return;
    }
    list.forEach((info,idx)=>{
      const selected=state283.multiSelect && state283.selectedCartridges.includes(info.sheetName);
      rail.appendChild(makeCard283(
        info.displayName,
        selected?'SELECTED':'',
        ()=>{
          if(!state283.multiSelect){
            // Normal mode: one click immediately starts that cartridge.
            selectGameCartridges([info.sheetName]);
            return;
          }

          const pos=state283.selectedCartridges.indexOf(info.sheetName);
          if(pos>=0) state283.selectedCartridges.splice(pos,1);
          else {
            if(state283.selectedCartridges.length>=5){
              showNotice283('카트리지는 최대 5개까지 선택할 수 있습니다.');
              return;
            }
            state283.selectedCartridges.push(info.sheetName);
          }
          render283();
        },
        {red:true,pak:`PAK #${idx+1}`,selected}
      ));
    });
  }

  function render283(){
    const host=ensureHost283();
    if(!host)return;

    // v1.00.288 — the clean catalog no longer depends on legacy gradeLoading151.
    // Visibility is owned only by catalog state. The independent BODY-level
    // cartridgeTransitionLoading228 is controlled by startCartridgeSelect().
    host.style.display=state283.ready?'block':'none';
    if(!state283.ready)return;

    const title=host.querySelector('#cat283Title');
    const context=host.querySelector('#cat283Context');
    const back=host.querySelector('#cat283Back');
    const rail=host.querySelector('#cat283Rail');
    const mergeStart=host.querySelector('#cat283MergeStart');
    const mergeFooter=host.querySelector('#cat283MergeFooter');

    title.textContent=title283();
    context.textContent=context283();
    back.onclick=e=>{
      e.preventDefault();e.stopPropagation();
      back283()();
    };
    rail.innerHTML='';
    rail.scrollLeft=0;
    if(mergeFooter) mergeFooter.style.display=state283.stage==='cartridge'?'flex':'none';
    if(mergeStart){
      const count=state283.selectedCartridges.length;
      if(!state283.multiSelect){
        mergeStart.disabled=false;
        mergeStart.textContent='다중선택';
        mergeStart.onclick=()=>{
          state283.multiSelect=true;
          state283.selectedCartridges=[];
          render283();
        };
      }else{
        mergeStart.disabled=count===0;
        mergeStart.textContent='시작';
        mergeStart.onclick=()=>{
          if(count) selectGameCartridges(state283.selectedCartridges.slice());
        };
      }
    }

    if(state283.stage==='grade')renderGrade283(rail);
    else if(state283.stage==='subject')renderSubject283(rail);
    else if(state283.stage==='publisher')renderPublisher283(rail);
    else renderCartridge283(rail);

    fitCardText283(host);
  }

  /* Source-of-truth public entry points used by the existing game. */
  window.renderGradeSelect151=function(sheets){
    // v1.00.288 — compatibility bridge only. It updates clean-catalog data/state
    // and does not touch legacy loading or toolbar DOM.
    allGameSheets151=Array.isArray(sheets)?sheets.slice():[];
    state283.ready=true;
    state283.stage='grade';
    state283.grade=null;
    state283.subject=null;
    state283.publisher=null;
    state283.selectedCartridges=[];
    state283.multiSelect=false;
    selectedGrade151=null;
    selectedSubject152=null;
    selectedPublisher154=null;
    render283();
  };

  window.showGradeSelect151=function(){
    state283.stage='grade';
    state283.grade=null;
    state283.subject=null;
    state283.publisher=null;
    selectedGrade151=null;
    selectedSubject152=null;
    selectedPublisher154=null;
    render283();
  };

  window.selectGrade151=function(grade){
    const safe=String(grade??'').trim();
    if(!grades283().includes(safe))return;
    state283.grade=safe;
    selectedGrade151=safe;
    state283.stage='subject';
    render283();
  };

  window.showSubjectSelect152=function(){
    if(!state283.grade)state283.grade=String(selectedGrade151||'');
    if(!grades283().includes(String(state283.grade))){
      showGradeSelect151();return;
    }
    state283.stage='subject';
    state283.subject=null;
    state283.publisher=null;
    selectedSubject152=null;
    selectedPublisher154=null;
    render283();
  };

  window.selectSubject152=function(subject){
    const safe=String(subject||'').trim();
    if(!subjects283(state283.grade).includes(safe))return;
    state283.subject=safe;
    selectedSubject152=safe;
    state283.publisher=null;
    selectedPublisher154=null;
    state283.stage=safe==='영어'?'publisher':'cartridge';
    render283();
  };

  window.showPublisherSelect154=function(){
    if(state283.subject!=='영어' && selectedSubject152!=='영어'){
      showSubjectSelect152();return;
    }
    state283.subject='영어';
    selectedSubject152='영어';
    state283.stage='publisher';
    state283.publisher=null;
    selectedPublisher154=null;
    render283();
  };

  window.selectPublisher154=function(publisher){
    const safe=String(publisher||'').trim();
    if(!publishers283(state283.grade).includes(safe))return;
    state283.publisher=safe;
    selectedPublisher154=safe;
    state283.stage='cartridge';
    render283();
  };

  window.showCartridgeSelect154=function(filtered){
    /* filtered is accepted for compatibility, but v283 derives the list from
       the one catalog state so stale DOM/filter objects cannot diverge. */
    state283.stage='cartridge';
    render283();
  };

  /* If a cartridge request fails, the existing failure path redisplays the
     modal. Repaint our stage as well. */
  const oldSelectGame283=window.selectGameCartridge;
  if(typeof oldSelectGame283==='function'){
    window.selectGameCartridge=function(){
      return oldSelectGame283.apply(this,arguments);
    };
  }

  function syncTheme283(){
    const host=document.getElementById('smqCatalog283');
    if(!host)return;
    /* Back control receives the same themed accent as the new catalog. */
    const back=host.querySelector('.cat283-back');
    if(back)back.style.borderColor='var(--cat-accent)';
  }

  const bodyObserver283=new MutationObserver(muts=>{
    if(muts.some(m=>m.type==='attributes'))syncTheme283();
  });
  if(document.body){
    bodyObserver283.observe(document.body,{attributes:true,attributeFilter:['data-theme','data-stage-variant']});
  }
  document.addEventListener('DOMContentLoaded',()=>{ensureHost283();syncTheme283();},{once:true});
  setTimeout(()=>{ensureHost283();syncTheme283();},0);

  window.SMQ_CATALOG_283={
    render:render283,
    state:state283
  };
})();
</script>

<script>
/* v1.00.284 — remove PAK labels at render time as well. */
(function(){
  const api=window.SMQ_CATALOG_283;
  if(!api || typeof api.render!=='function')return;

  const oldRender284=api.render;
  api.render=function(){
    const r=oldRender284.apply(this,arguments);
    requestAnimationFrame(()=>{
      document.querySelectorAll('#smqCatalog283 .cat283-pak').forEach(el=>el.remove());
    });
    return r;
  };

  /* Existing render functions call the closed-over render283(), so also
     remove labels after every catalog-stage DOM mutation without polling. */
  const rail=document.getElementById('cat283Rail');
  if(rail){
    const obs=new MutationObserver(()=>{
      rail.querySelectorAll('.cat283-pak').forEach(el=>el.remove());
    });
    obs.observe(rail,{childList:true,subtree:true});
    rail.querySelectorAll('.cat283-pak').forEach(el=>el.remove());
  }
})();
</script>

<script>
/* =========================================================
   v1.00.288 — CLEAN CATALOG LEGACY DISCONNECT
   ========================================================= */
(function(){
  function removeLegacyCatalogBacks288(){
    const modal=document.getElementById('cartridgeSelectModal');
    if(!modal)return;

    // Remove only legacy standalone navigation controls. The new cat283Back
    // lives inside smqCatalog283 and is intentionally preserved.
    [
      '#smqCatalogBack277',
      '#cartridgeBackBtn152'
    ].forEach(sel=>{
      const el=modal.querySelector(sel);
      if(el)el.remove();
    });

    modal.querySelectorAll('.smq-back274,[data-smq-back274]').forEach(el=>{

<script>
/* =========================================================
   v1.00.289 — intro-sign style capture + fit-aware centering
   ========================================================= */
(function(){
  const FALLBACK_SHADOW_DARK='#111111';
  const FALLBACK_SHADOW_LIGHT='#f4f4f4';

  function parseRgb289(s){
    const m=String(s||'').match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
    return m ? [Number(m[1]),Number(m[2]),Number(m[3])] : null;
  }
  function luminance289(rgb){
    if(!rgb)return .5;
    const v=rgb.map(x=>{
      x/=255;
      return x<=.03928 ? x/12.92 : Math.pow((x+.055)/1.055,2.4);
    });
    return .2126*v[0]+.7152*v[1]+.0722*v[2];
  }
  function contrastShadow289(color){
    return luminance289(parseRgb289(color))>.48 ? FALLBACK_SHADOW_DARK : FALLBACK_SHADOW_LIGHT;
  }

  function findIntroSignText289(){
    const board=document.querySelector('#introOverlay .nes-title-board');
    if(!board)return null;

    const candidates=[board,...board.querySelectorAll('*')]
      .filter(el=>{
        const txt=(el.textContent||'').trim();
        if(!txt)return false;
        const cs=getComputedStyle(el);
        return cs.display!=='none' && cs.visibility!=='hidden' && parseFloat(cs.opacity||'1')>.01;
      });

    let best=null, bestScore=-1;
    for(const el of candidates){
      const cs=getComputedStyle(el);
      const size=parseFloat(cs.fontSize)||0;
      const weight=parseFloat(cs.fontWeight)||400;
      const ownText=[...el.childNodes].some(n=>n.nodeType===3 && n.textContent.trim());
      const score=size*10+(weight>=700?80:0)+(ownText?120:0);
      if(score>bestScore){best=el;bestScore=score;}
    }
    return best||board;
  }

  function captureIntroTitle289(){
    const host=document.getElementById('smqCatalog283');
    const el=findIntroSignText289();
    if(!host||!el)return;

    const cs=getComputedStyle(el);
    const titleColor=cs.color;
    if(titleColor)host.style.setProperty('--cat-title',titleColor);

    /* Use the intro sign's real shadow color when it has one. If the intro
       title has no usable shadow, choose black/white from title luminance. */
    const shadow=String(cs.textShadow||'');
    const colorMatch=shadow.match(/rgba?\([^)]+\)|#[0-9a-f]{3,8}/i);
    let shadowColor=colorMatch ? colorMatch[0] : '';
    if(!shadowColor || /rgba?\([^)]*,\s*0(?:\.0+)?\s*\)/i.test(shadowColor)){
      shadowColor=contrastShadow289(titleColor);
    }
    host.style.setProperty('--cat-title-shadow',shadowColor);
  }

  function updateRailFit289(){
    const rail=document.getElementById('cat283Rail');
    if(!rail)return;
    rail.classList.remove('cat283-fits');
    requestAnimationFrame(()=>{
      const fits=rail.scrollWidth<=rail.clientWidth+2;
      rail.classList.toggle('cat283-fits',fits);
      if(fits)rail.scrollLeft=0;
    });
  }

  function refresh289(){
    captureIntroTitle289();
    updateRailFit289();
  }

  /* Capture while the intro sign still exists/has its current theme styling. */
  const oldStart=window.startCartridgeSelect;
  if(typeof oldStart==='function'){
    window.startCartridgeSelect=function(){
      captureIntroTitle289();
      return oldStart.apply(this,arguments);
    };
  }

  /* render283 changes the direct card children, so observe only that rail. */
  function attach289(){
    const rail=document.getElementById('cat283Rail');
    if(!rail)return false;
    new MutationObserver(updateRailFit289).observe(rail,{childList:true});
    updateRailFit289();
    captureIntroTitle289();
    return true;
  }

  if(!attach289()){
    document.addEventListener('DOMContentLoaded',attach289,{once:true});
    setTimeout(attach289,0);
  }
  window.addEventListener('resize',updateRailFit289,{passive:true});

  if(document.body){
    new MutationObserver(refresh289).observe(document.body,{
      attributes:true,
      attributeFilter:['data-theme','data-stage-variant']
    });
  }
})();
</script>

<script>
/* =========================================================
   v1.00.298 — SOLO DDR-STYLE JUDGEMENT + COMBO
   HARD: PERFECT <= 2.0s / GREAT <= 5.0s
   EASY: PERFECT <= 5.0s / GREAT <= 10.0s
   GOOD until timeout / MISS wrong or timeout.
   Correct judgements share one combo chain; MISS alone breaks it.
   ========================================================= */
(function(){
  let pendingElapsed298=null;
  let judgeHideTimer298=null;

  function resetCombo298(){
    soloState.combo298=0;
    soloState.maxCombo298=0;
    pendingElapsed298=null;
  }

  function grade298(isCorrect,elapsed){
    if(!isCorrect) return 'MISS';
    const ms=Number.isFinite(elapsed)?Math.max(0,elapsed):Math.max(0,performance.now()-Number(soloState.timerStartedAt||0));
    const policy=(typeof getSoloDifficultyPolicyRC2==='function')
      ? getSoloDifficultyPolicyRC2()
      : SOLO_DIFFICULTY_POLICIES_RC2.HARD;
    if(ms<=policy.perfectMs) return 'PERFECT';
    if(ms<=policy.greatMs) return 'GREAT';
    return 'GOOD';
  }

  function ensureJudge298(){
    const modal=document.getElementById('modal');
    if(!modal) return null;
    if(getComputedStyle(modal).position==='static') modal.style.position='relative';
    let box=modal.querySelector('.solo-judge298');
    if(!box){
      box=document.createElement('div');
      box.className='solo-judge298';
      box.setAttribute('aria-live','polite');
      box.innerHTML='<div class="solo-judge298-label"></div><div class="solo-judge298-combo"></div>';
      modal.appendChild(box);
    }
    return box;
  }

  function playJudgeSfx298(grade,combo){
    if(isMuted || typeof audioCtx==='undefined' || !audioCtx) return;
    try{
      if(audioCtx.state==='suspended') audioCtx.resume();
      const now=audioCtx.currentTime+0.025;
      const notes={
        PERFECT:[783.99,1046.50,1318.51],
        GREAT:[659.25,880.00],
        GOOD:[523.25],
        MISS:[196.00,146.83]
      }[grade]||[440];
      notes.forEach((freq,i)=>{
        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();
        const t=now+i*0.055;
        osc.type='square';
        osc.frequency.setValueAtTime(freq,t);
        if(grade==='MISS') osc.frequency.exponentialRampToValueAtTime(Math.max(80,freq*.72),t+.075);
        const level=grade==='PERFECT'?.045:grade==='GREAT'?.038:grade==='GOOD'?.030:.034;
        gain.gain.setValueAtTime(level,t);
        gain.gain.exponentialRampToValueAtTime(.001,t+.095);
        osc.connect(gain);
        if(typeof connectSfxNode==='function') connectSfxNode(gain); else gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t+.105);
      });
      // Milestone sparkle without turning the judgement into a large overlay.
      if(grade!=='MISS' && combo>0 && combo%5===0){
        [1567.98,2093.00].forEach((freq,i)=>{
          const osc=audioCtx.createOscillator();
          const gain=audioCtx.createGain();
          const t=now+.16+i*.05;
          osc.type='square'; osc.frequency.setValueAtTime(freq,t);
          gain.gain.setValueAtTime(.028,t); gain.gain.exponentialRampToValueAtTime(.001,t+.08);
          osc.connect(gain);
          if(typeof connectSfxNode==='function') connectSfxNode(gain); else gain.connect(audioCtx.destination);
          osc.start(t); osc.stop(t+.09);
        });
      }
    }catch(err){console.warn('SOLO judgement SFX:',err);}
  }

  function showJudge298(grade,combo){
    const box=ensureJudge298();
    if(!box) return;
    box.dataset.grade=grade;
    const label=box.querySelector('.solo-judge298-label');
    const comboEl=box.querySelector('.solo-judge298-combo');
    if(label) label.textContent=grade;
    if(comboEl){
      if(grade==='MISS') comboEl.textContent=combo>0?'COMBO BREAK':'MISS';
      else comboEl.textContent=`${combo} COMBO`;
    }
    box.classList.remove('is-showing');
    void box.offsetWidth;
    box.classList.add('is-showing');
    clearTimeout(judgeHideTimer298);
    judgeHideTimer298=setTimeout(()=>box.classList.remove('is-showing'),940);
  }

  function pulseHud298(isCorrect){
    const el=document.getElementById('soloHudCorrect');
    if(!el) return;
    el.classList.remove('solo-hud-hit298','solo-hud-miss298');
    void el.offsetWidth;
    el.classList.add(isCorrect?'solo-hud-hit298':'solo-hud-miss298');
    setTimeout(()=>el.classList.remove('solo-hud-hit298','solo-hud-miss298'),340);
  }

  const originalCheck298=window.checkSoloAnswer;
  if(typeof originalCheck298==='function'){
    window.checkSoloAnswer=function(){
      if(gameMode==='SOLO' && soloState.started && !soloState.answerLocked){
        pendingElapsed298=Math.max(0,performance.now()-Number(soloState.timerStartedAt||0));
      }
      return originalCheck298.apply(this,arguments);
    };
  }

  const originalResult298=window.showSoloResult;
  if(typeof originalResult298==='function'){
    window.showSoloResult=function(isCorrect,isTimeout){
      const elapsed=(!isTimeout && Number.isFinite(pendingElapsed298))?pendingElapsed298:null;
      const previousCombo=Math.max(0,Number(soloState.combo298||0));
      const grade=grade298(Boolean(isCorrect),elapsed);
      if(isCorrect){
        soloState.combo298=previousCombo+1;
        soloState.maxCombo298=Math.max(Number(soloState.maxCombo298||0),soloState.combo298);
      }else{
        soloState.combo298=0;
      }
      pendingElapsed298=null;

      const result=originalResult298.apply(this,arguments);
      // Let the normal result DOM settle first, then place the compact pixel judgement on top.
      requestAnimationFrame(()=>{
        showJudge298(grade,Number(soloState.combo298||0) || (grade==='MISS'?previousCombo:0));
        pulseHud298(Boolean(isCorrect));
        /* v300: judgement/combo SFX removed; existing answer/coin SFX remain. */
      });
      return result;
    };
  }

  const originalStart298=window.startSoloGameFromGuide;
  if(typeof originalStart298==='function'){
    window.startSoloGameFromGuide=function(){resetCombo298();return originalStart298.apply(this,arguments);};
  }
  const originalRestart298=window.restartSoloChallengeNow156;
  if(typeof originalRestart298==='function'){
    window.restartSoloChallengeNow156=function(){resetCombo298();return originalRestart298.apply(this,arguments);};
  }

  // Existing runs loaded before this patch still start from a clean chain.
  if(!Number.isFinite(Number(soloState.combo298))) resetCombo298();
})();
</script>

   - result box itself becomes the judgement/combo box
   - PERFECT: ghost + shake + pop
   - GREAT: shake + pop
   - GOOD: pop only
   - MISS: badge only; no combo text
   - live combo: fast fuse/flame orbit on question/result panels and ? block
   ========================================================= */
(function(){
  const FX=['combo-fx-perfect301','combo-fx-great301','combo-fx-good301'];

  function combo301(){ return Math.max(0,Number(soloState && soloState.combo298 || 0)); }
  function duration301(){
    const c=combo301();
    // Faster as the chain grows, but clamp so the flame remains readable.
    return Math.max(.64, 1.34 - Math.min(c,20)*.041);
  }
  function ensureSpark301(host){
    if(!host || !host.isConnected) return;
    host.classList.add('combo-flame-host301');
    host.style.setProperty('--combo-flame-duration301',duration301()+'s');
    let s=host.querySelector(':scope > .combo-orbit-spark301');
    if(!s){
      s=document.createElement('span');
      s.className='combo-orbit-spark301';
      s.setAttribute('aria-hidden','true');
      host.appendChild(s);
    }
  }
  function clearSpark301(host){
    if(!host) return;
    host.classList.remove('combo-flame-host301');
    host.style.removeProperty('--combo-flame-duration301');
    host.querySelectorAll(':scope > .combo-orbit-spark301').forEach(n=>n.remove());
  }
  function modalPanel301(){
    const modal=document.getElementById('modal');
    if(!modal) return null;
    return modal.querySelector('.modal-content,.quiz-modal-card,.modal-card') || modal.firstElementChild || modal;
  }
  function syncFlames301(){
    const alive=gameMode==='SOLO' && !!soloState.started && combo301()>0;
    const block=document.querySelector('#grid .solo-question-block267');
    const result=document.getElementById('resultSection');
    const panel=modalPanel301();
    const resultVisible=!!(result && getComputedStyle(result).display!=='none');
    const questionVisible=document.body.classList.contains('solo-question-open') && !resultVisible;

    [block,result,panel].forEach(h=>{ if(!alive) clearSpark301(h); });
    if(!alive) return;

    // Keep the ? block burning throughout an active chain.
    ensureSpark301(block);
    // The modal panel burns while a question is being answered.
    if(questionVisible) ensureSpark301(panel); else if(panel) clearSpark301(panel);
    // Once the result is shown, move the emphasis to the result box itself.
    if(resultVisible) ensureSpark301(result); else if(result) clearSpark301(result);
  }

  function clearResultFx301(){
    const r=document.getElementById('resultSection');
    if(!r) return;
    FX.forEach(c=>r.classList.remove(c));
    r.classList.remove('combo-result301');
    r.removeAttribute('data-grade301');
    r.querySelectorAll('.solo-result-grade301,.combo-result-ghost301').forEach(n=>n.remove());
  }
  function decorateResult301(grade){
    const r=document.getElementById('resultSection');
    if(!r || !grade) return;
    /* v305: carry the last successful judgement color into the NEXT question. */
    try{
      if(grade==='PERFECT' || grade==='GREAT' || grade==='GOOD') soloState.lastComboGrade305=grade;
      else if(grade==='MISS') soloState.lastComboGrade305='';
    }catch(_){}
    clearResultFx301();
    r.classList.add('combo-result301');
    r.setAttribute('data-grade301',grade);

    const badge=document.createElement('div');
    badge.className='solo-result-grade301';
    badge.dataset.grade301=grade;
    badge.innerHTML='<span class="grade301"></span>' +
      (grade==='MISS' ? '' : '<span class="combo301"></span>');
    badge.querySelector('.grade301').textContent=grade;
    const c=badge.querySelector('.combo301');
    if(c) c.textContent=combo301()+' COMBO';
    r.appendChild(badge);

    if(grade==='PERFECT'){
      const ghost=document.createElement('div');
      ghost.className='combo-result-ghost301';
      r.appendChild(ghost);
      void r.offsetWidth;
      r.classList.add('combo-fx-perfect301');
      ghost.classList.add('run301');
    }else if(grade==='GREAT'){
      void r.offsetWidth;
      r.classList.add('combo-fx-great301');
    }else if(grade==='GOOD'){
      void r.offsetWidth;
      r.classList.add('combo-fx-good301');
    }
    // MISS intentionally has no whole-box combo motion and no combo text.
    syncFlames301();
  }

  function readLegacyGrade301(){
    const old=document.querySelector('.solo-judge298');
    return old && old.dataset ? String(old.dataset.grade||'').toUpperCase() : '';
  }

  const oldResult301=window.showSoloResult;
  if(typeof oldResult301==='function'){
    window.showSoloResult=function(){
      const out=oldResult301.apply(this,arguments);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        const grade=readLegacyGrade301() || (arguments[0] ? 'GOOD' : 'MISS');
        decorateResult301(grade);
      }));
      return out;
    };
  }

  const oldOpen301=window.openSoloQuestion;
  if(typeof oldOpen301==='function'){
    window.openSoloQuestion=function(){
      clearResultFx301();
      const out=oldOpen301.apply(this,arguments);
      requestAnimationFrame(syncFlames301);
      return out;
    };
  }

  const oldClose301=window.closeSoloResult;
  if(typeof oldClose301==='function'){
    window.closeSoloResult=function(){
      const out=oldClose301.apply(this,arguments);
      requestAnimationFrame(()=>{
        clearResultFx301();
        syncFlames301();
      });
      return out;
    };
  }

  const oldStart301=window.startSoloGameFromGuide;
  if(typeof oldStart301==='function'){
    window.startSoloGameFromGuide=function(){
      const out=oldStart301.apply(this,arguments);
      requestAnimationFrame(syncFlames301);
      return out;
    };
  }
  const oldRestart301=window.restartSoloChallengeNow156;
  if(typeof oldRestart301==='function'){
    window.restartSoloChallengeNow156=function(){
      const out=oldRestart301.apply(this,arguments);
      requestAnimationFrame(syncFlames301);
      return out;
    };
  }
  const oldExit301=window.exitSoloToTeamSelect;
  if(typeof oldExit301==='function'){
    window.exitSoloToTeamSelect=function(){
      document.querySelectorAll('.combo-flame-host301').forEach(clearSpark301);
      clearResultFx301();
      return oldExit301.apply(this,arguments);
    };
  }

  // Keep flame speed/targets synchronized when the board/modal changes between states.
  const mo301=new MutationObserver(()=>requestAnimationFrame(syncFlames301));
  mo301.observe(document.body,{attributes:true,attributeFilter:['class']});
  const modal301=document.getElementById('modal');
  if(modal301) mo301.observe(modal301,{attributes:true,attributeFilter:['class']});

  requestAnimationFrame(syncFlames301);
})();

  function orbitDuration302(){

    const maxCombo=20;

      case 3:return q(w-r,h-r,0,arc);
      case 4:return [w-r-d,h];
      case 5:return q(r,h-r,Math.PI/2,arc);
      case 6:return [0,h-r-d];
      default:return q(r,r,Math.PI,arc);
    }
  }
  function orbitFrame302(now){
    orbitHosts302.forEach(host=>{
      if(!host.isConnected){orbitHosts302.delete(host);return;}
      const orb=host.querySelector(':scope > .combo-orbit302');
      if(!orb){orbitHosts302.delete(host);return;}
      const w=host.clientWidth,h=host.clientHeight;
      if(w<4||h<4) return;
      const cs=getComputedStyle(host);
      const raw=parseFloat(cs.borderTopLeftRadius)||12;
      const r=Math.min(raw+4,w*.18,h*.30);
      const total=2*Math.max(0,w-2*r)+2*Math.max(0,h-2*r)+2*Math.PI*r;
      const dur=orbitDuration302()*1000;
      const start=Number(orb.dataset.start302)||now;
      const d=((now-start)%dur)/dur*total;
      const p=roundedPoint302(w,h,r,d);
      /* Center exactly on the border/beam, not inside the panel. */
      orb.style.transform='translate('+(p[0]-11)+'px,'+(p[1]-11)+'px)';
    });
    if(orbitHosts302.size) raf302=requestAnimationFrame(orbitFrame302); else raf302=0;
  }
  function startOrbitLoop302(){if(!raf302) raf302=requestAnimationFrame(orbitFrame302);}

  function fitResultModal302(){
    cancelAnimationFrame(fitRaf302);
    fitRaf302=requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const modal=document.getElementById('modal');
      const result=document.getElementById('resultSection');
      const panel=resultPanel302();
      if(!modal||!result||!panel) return;
      const visible=getComputedStyle(result).display!=='none' && modal.classList.contains('active');
      modal.classList.toggle('combo-result-modal302',visible);
      panel.classList.toggle('combo-result-panel302',visible);
      if(!visible){panel.style.zoom='';return;}

      panel.style.zoom='1';
      const vv=window.visualViewport;
      const vw=vv ? vv.width : window.innerWidth;
      const vh=vv ? vv.height : window.innerHeight;
      const rect=panel.getBoundingClientRect();
      const w=Math.max(panel.scrollWidth,rect.width);
      const h=Math.max(panel.scrollHeight,rect.height);
      /* Leave extra room for the deliberately protruding italic judgement label. */
      const availW=Math.max(240,vw-86);
      const availH=Math.max(220,vh-72);
      const scale=Math.min(1,availW/Math.max(1,w),availH/Math.max(1,h));

      panel.scrollTop=0;panel.scrollLeft=0;

  function moveResultDecor302(){
    const result=document.getElementById('resultSection');
    const modal=document.getElementById('modal');
    const panel=resultPanel302();
    if(!result||!modal||!panel) return;
    const visible=getComputedStyle(result).display!=='none' && modal.classList.contains('active');
    if(!visible){
      modal.classList.remove('combo-result-modal302');
      panel.classList.remove('combo-result-panel302');
      clearOrbit302(panel);
      fitResultModal302();
      return;
    }

    modal.classList.add('combo-result-modal302');
    panel.classList.add('combo-result-panel302');
    const grade=String(result.getAttribute('data-grade301')||'').toUpperCase();
    panel.setAttribute('data-grade301',grade);
    ['combo-result301','combo-fx-perfect301','combo-fx-great301','combo-fx-good301'].forEach(c=>{
      if(result.classList.contains(c)){panel.classList.add(c);result.classList.remove(c);}
    });
    const badge=result.querySelector(':scope > .solo-result-grade301');
    if(badge) panel.appendChild(badge);
    const ghost=result.querySelector(':scope > .combo-result-ghost301');
    if(ghost) panel.appendChild(ghost);

    /* Result window only burns while the combo is alive. MISS has already broken it. */
    clearOrbit302(result);
    if(comboValue302()>0 && grade!=='MISS') ensureOrbit302(panel); else clearOrbit302(panel);
    fitResultModal302();
  }

  function sync302(){
    const alive=(typeof gameMode!=='undefined' && gameMode==='SOLO') &&
      (typeof soloState!=='undefined' && !!soloState.started) && comboValue302()>0;
    const result=document.getElementById('resultSection');
    const resultVisible=!!(result && getComputedStyle(result).display!=='none');
    const panel=resultPanel302();
    const block=document.querySelector('#grid .solo-question-block267');
    if(alive){
      ensureOrbit302(block);
      if(panel && !resultVisible && document.body.classList.contains('solo-question-open')) ensureOrbit302(panel);
      if(resultVisible) moveResultDecor302();
    }else{
      [block,panel,result].forEach(clearOrbit302);

    }
  }

  const oldShow302=window.showSoloResult;
  if(typeof oldShow302==='function'){
    window.showSoloResult=function(){
      const out=oldShow302.apply(this,arguments);
      requestAnimationFrame(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
        moveResultDecor302();sync302();
      })));
      return out;
    };
  }
  const oldOpen302=window.openSoloQuestion;
  if(typeof oldOpen302==='function'){
    window.openSoloQuestion=function(){
      const out=oldOpen302.apply(this,arguments);
      requestAnimationFrame(()=>{fitResultModal302();sync302();});
      return out;
    };
  }
  const oldClose302=window.closeSoloResult;
  if(typeof oldClose302==='function'){
    window.closeSoloResult=function(){
      const panel=resultPanel302();
      if(panel){
        panel.querySelectorAll(':scope > .solo-result-grade301,:scope > .combo-result-ghost301').forEach(n=>n.remove());
        ['combo-result-panel302','combo-result301','combo-fx-perfect301','combo-fx-great301','combo-fx-good301'].forEach(c=>panel.classList.remove(c));
        panel.removeAttribute('data-grade301');
        clearOrbit302(panel);
        panel.style.zoom='';
      }
      const modal=document.getElementById('modal');
      if(modal) modal.classList.remove('combo-result-modal302');
      return oldClose302.apply(this,arguments);
    };
  }

  window.addEventListener('resize',()=>{fitResultModal302();sync302();},{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(()=>{fitResultModal302();sync302();},80),{passive:true});
  if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>{fitResultModal302();sync302();},{passive:true});
  const mo302=new MutationObserver(()=>requestAnimationFrame(sync302));
  mo302.observe(document.body,{attributes:true,attributeFilter:['class']});
  const modal302=document.getElementById('modal');
  if(modal302) mo302.observe(modal302,{attributes:true,attributeFilter:['class']});
  requestAnimationFrame(sync302);
})();

<script>
(function(){
  'use strict';
  // v306 deliberately leaves the existing PERFECT/GREAT/GOOD/MISS element's
  // beam-synchronised blink untouched. We add a short transform pulse to the
  // lettering via Web Animations so it can coexist with the existing CSS animation.
  function isGradeText(el){
    if(!el || el.nodeType !== 1) return false;
    var t=(el.textContent||'').trim().toUpperCase();
    return /^(PERFECT|GREAT|GOOD|MISS)$/.test(t);
  }
  function boing(el){
    if(!isGradeText(el) || el.dataset.smqBoing306==='1') return;
    el.dataset.smqBoing306='1';
    try{
      el.animate([
        { transform:'rotate(-7deg) scale(.72)', offset:0 },
        { transform:'rotate(-7deg) scale(1.16)', offset:.34 },
        { transform:'rotate(-7deg) scale(.96)', offset:.58 },
        { transform:'rotate(-7deg) scale(1.035)', offset:.76 },
        { transform:'rotate(-7deg) scale(1)', offset:1 }
      ],{
        duration:560,
        easing:'cubic-bezier(.18,.9,.24,1.28)',
        fill:'none'
      });
    }catch(e){
      el.classList.add('smq-grade-boing306');
      setTimeout(function(){ el.classList.remove('smq-grade-boing306'); },620);
    }
    setTimeout(function(){ if(el) delete el.dataset.smqBoing306; },700);
  }
  function scan(root){
    if(root && root.nodeType===1 && isGradeText(root)) boing(root);
    if(!root || !root.querySelectorAll) return;
    root.querySelectorAll('*').forEach(function(el){
      if(isGradeText(el)) boing(el);
    });
  }
  var obs=new MutationObserver(function(muts){
    muts.forEach(function(m){
      if(m.type==='characterData') boing(m.target.parentElement);
      m.addedNodes && m.addedNodes.forEach(function(n){ if(n.nodeType===1) scan(n); });
    });
  });
  function start(){
    scan(document.body);
    obs.observe(document.body,{subtree:true,childList:true,characterData:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
</script>

<script>
(function(){
  'use strict';

  function enableCartridgeWheelScroll307(){
    const rail = document.getElementById('cat283Rail');
    if (!rail || rail.dataset.wheelScroll307 === '1') return;
    rail.dataset.wheelScroll307 = '1';

    rail.addEventListener('wheel', function(e){
      // Preserve native horizontal trackpad gestures. Convert ordinary vertical
      // mouse-wheel input only when this catalog rail can actually scroll sideways.
      if (rail.scrollWidth <= rail.clientWidth + 1) return;
      if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
      if (!e.deltaY) return;

      const before = rail.scrollLeft;
      rail.scrollLeft += e.deltaY;

      // Consume the page-level wheel only when the rail itself moved. At either
      // horizontal edge, normal page/ancestor scrolling remains available.
      if (rail.scrollLeft !== before) e.preventDefault();
    }, { passive:false });
  }

  function bootWheelScroll307(){
    enableCartridgeWheelScroll307();
    const modal = document.getElementById('cartridgeSelectModal');
    if (!modal) return;
    new MutationObserver(enableCartridgeWheelScroll307).observe(modal, {
      childList:true,
      subtree:true
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootWheelScroll307, { once:true });
  } else {
    bootWheelScroll307();
  }
})();
</script>

   earlier v308 RC rule without touching catalog data or selection behavior. */
(function(){
  let raf308f2=0;

  function fitLongCatalogTitles308f2(){
    const root=document.getElementById('smqCatalog283');
    if(!root || getComputedStyle(root).display==='none') return;

        (el.scrollWidth>Math.max(1,box.clientWidth-18) ||
         el.scrollHeight>Math.max(1,box.clientHeight-18))){

        el.style.setProperty('font-size',size+'px','important');

  function queueFit308f2(){
    if(raf308f2) cancelAnimationFrame(raf308f2);

    if(!rail) return false;
    new MutationObserver(queueFit308f2).observe(rail,{childList:true,subtree:true});
    queueFit308f2();

  if(!attach308f2()){
    document.addEventListener('DOMContentLoaded',attach308f2,{once:true});

<script>
/* v1.00.308 FIX6 — derive TEAM back position from the actual white header band. */
(function(){
  let raf308f6=0;

  function placeTeamBack308f6(){
    const setup=document.getElementById('setupModal');
    const btn=setup && setup.querySelector('[data-smq-back274="team-select"]');
    if(!setup || !btn || !setup.classList.contains('active')) return;

    const card=btn.closest('.setup-card.mario-stage-select') || btn.parentElement;
    if(!card) return;

    const cardRect=card.getBoundingClientRect();

    /* The blue stage is the large bordered game-preview box. Prefer a known
       stage descendant when available; otherwise pick the largest blue/stage
       child below the header. */
    const selectors=[
      '#teamSelectStage',
      '.team-select-stage',
      '.mario-stage',
      '.stage-preview',
      '.team-stage',
      '.team-stage-wrap',
      '.stage-container'
    ];
    let stage=null;
    for(const sel of selectors){
      const el=card.querySelector(sel);
      if(el){ stage=el; break; }
    }

    if(!stage){
      let best=null, bestArea=0;
      for(const el of card.children){
        if(el===btn) continue;
        const r=el.getBoundingClientRect();
        const area=r.width*r.height;
        if(r.top>cardRect.top+40 && r.width>cardRect.width*.65 && r.height>180 && area>bestArea){
          best=el; bestArea=area;
        }
      }
      stage=best;
    }

    const stageRect=stage ? stage.getBoundingClientRect() : null;

    /* Header band = from the card's top edge to the blue stage's top edge.
       Center the 58x48 shared button inside that real band. */
    const headerTop=cardRect.top;
    const headerBottom=(stageRect && stageRect.top>headerTop+50)
      ? stageRect.top
      : Math.min(cardRect.bottom,headerTop+92);
    const headerHeight=Math.max(58,headerBottom-headerTop);

    const left=Math.round(cardRect.left+18);
    const top=Math.round(headerTop+(headerHeight-48)/2);

    btn.style.setProperty('left',left+'px','important');
    btn.style.setProperty('top',top+'px','important');
    btn.style.setProperty('right','auto','important');
    btn.style.setProperty('bottom','auto','important');
  }

  function queueTeamBack308f6(){
    if(raf308f6) cancelAnimationFrame(raf308f6);
    raf308f6=requestAnimationFrame(()=>{
      raf308f6=0;
      placeTeamBack308f6();
    });
  }

  window.addEventListener('resize',queueTeamBack308f6,{passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',queueTeamBack308f6,{passive:true});
  }

  const setup=document.getElementById('setupModal');
  if(setup){
    new MutationObserver(queueTeamBack308f6).observe(setup,{
      attributes:true,
      attributeFilter:['class'],
      childList:true,
      subtree:true
    });
  }

  document.addEventListener('click',()=>setTimeout(queueTeamBack308f6,0),true);
  queueTeamBack308f6();
})();
</script>

<script>
/* =========================================================
   U1.1 RC1 — shared TEAM/SOLO question fitter
   ========================================================= */
(function(){
  const SHRINK=['u11-shrink1','u11-shrink2','u11-shrink3'];
  let rafU11=0;

  function cardU11(){
    const modal=document.getElementById('modal');
    if(!modal) return null;
    return modal.querySelector('.modal-content,.quiz-modal-card,.modal-card') ||
           modal.firstElementChild || null;
  }

  function questionOpenU11(){
    const modal=document.getElementById('modal');
    if(!modal || !modal.classList.contains('active')) return false;
    const result=document.getElementById('resultSection');
    return !result || getComputedStyle(result).display==='none';
  }

  function viewportU11(){
    const vv=window.visualViewport;
    return {
      w:vv ? vv.width : window.innerWidth,
      h:vv ? vv.height : window.innerHeight
    };
  }

  function overflowU11(card){
    const v=viewportU11();
    const r=card.getBoundingClientRect();
    const w=Math.max(card.scrollWidth,r.width);
    const h=Math.max(card.scrollHeight,r.height);
    return {
      over:w>v.w-28 || h>v.h-28,
      w,h,
      availW:Math.max(280,v.w-28),
      availH:Math.max(240,v.h-28)
    };
  }

  function resetU11(card){
    SHRINK.forEach(c=>card.classList.remove(c));
    card.style.zoom='1';
  }

  function fitU11(){
    if(window.__SMQ_U11_RC4_FIT_OWNER__) return;
    const modal=document.getElementById('modal');
    const card=cardU11();
    if(!modal || !card || !questionOpenU11()) return;

    resetU11(card);
    modal.scrollTop=0;
    card.scrollTop=0;

    /* First sacrifice spacing/type in bounded steps, not the whole dialog. */
    let state=overflowU11(card);
    for(const cls of SHRINK){
      if(!state.over) break;
      SHRINK.forEach(c=>card.classList.remove(c));
      card.classList.add(cls);
      state=overflowU11(card);
    }

    /* Final fallback only: scale the complete card to the real visual viewport. */
    if(state.over){
      const scale=Math.min(
        1,
        state.availW/Math.max(1,state.w),
        state.availH/Math.max(1,state.h)
      );
      card.style.zoom=String(Math.max(.55,scale));
    }

    modal.scrollTop=0;
    card.scrollTop=0;
  }

  function queueU11(){
    cancelAnimationFrame(rafU11);
    rafU11=requestAnimationFrame(()=>requestAnimationFrame(fitU11));
  }

  /* Dynamic TEAM/SOLO question markup changes inside #modal. */
  const modal=document.getElementById('modal');
  if(modal){
    new MutationObserver(queueU11).observe(modal,{
      childList:true,
      subtree:true,
      attributes:true,
      attributeFilter:['class','style']
    });
  }

  /* Refit when the real classroom viewport changes. */
  window.addEventListener('resize',queueU11,{passive:true});
  window.addEventListener('orientationchange',queueU11,{passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',queueU11,{passive:true});
  }

  /* Run after the existing question-open functions without changing their logic. */
  const oldTeam=window.openQuestionModal;
  if(typeof oldTeam==='function'){
    window.openQuestionModal=function(){
      const out=oldTeam.apply(this,arguments);
      queueU11();
      return out;
    };
  }

  const oldSolo=window.openSoloQuestion;
  if(typeof oldSolo==='function'){
    window.openSoloQuestion=function(){
      const out=oldSolo.apply(this,arguments);
      queueU11();
      return out;
    };
  }

  queueU11();
})();
</script>

   ========================================================= */
(function(){
  const RC1=['u11-shrink1','u11-shrink2','u11-shrink3'];
  const RC2=['u11rc2-shrink1','u11rc2-shrink2','u11rc2-shrink3'];
  let raf=0;

  function modal(){
    return document.getElementById('modal');
  }
  function card(){
    const m=modal();
    return m && (m.querySelector('.modal-content,.quiz-modal-card,.modal-card') || m.firstElementChild);
  }
  function questionIsOpen(){
    const m=modal();
    if(!m || !m.classList.contains('active')) return false;
    const result=document.getElementById('resultSection');
    return !result || getComputedStyle(result).display==='none';
  }
  function vp(){
    const vv=window.visualViewport;
    return {w:vv?vv.width:innerWidth,h:vv?vv.height:innerHeight};
  }
  function clear(c){
    RC1.concat(RC2).forEach(x=>c.classList.remove(x));
    c.style.zoom='1';
  }
  function measure(c){
    const v=vp();
    const r=c.getBoundingClientRect();
    const h=Math.max(c.scrollHeight,r.height);
    const w=Math.max(c.scrollWidth,r.width);
    return {
      h,w,
      availH:Math.max(240,v.h-28),
      availW:Math.max(280,v.w-28),
      /* Width gets a small tolerance because borders/font rasterization can
         report a few excess pixels while the dialog is visually fine. */
      overH:h>v.h-28,
      overW:w>v.w-12
    };
  }

  function fit(){
    if(window.__SMQ_U11_RC4_FIT_OWNER__) return;
    const m=modal(), c=card();
    if(!m || !c || !questionIsOpen()) return;

    clear(c);
    let x=measure(c);

    /* Typography is reduced only when HEIGHT does not fit.
       A normal 2-line question with 3/4 choices therefore keeps 46/34px. */
    for(const cls of RC2){
      if(!x.overH) break;
      RC2.forEach(k=>c.classList.remove(k));
      c.classList.add(cls);
      x=measure(c);
    }

    /* Complete-card scaling is genuinely last resort. */
    if(x.overH || x.overW){
      const scale=Math.min(
        1,
        x.availH/Math.max(1,x.h),
        x.availW/Math.max(1,x.w)
      );
      c.style.zoom=String(Math.max(.58,scale));
    }

    m.scrollTop=0;
    c.scrollTop=0;
  }

  function queue(){
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>requestAnimationFrame(fit));
  }

  /* Run after RC1/v304 mutation reactions so RC2 owns the final rendered state. */
  const m=modal();
  if(m){
    new MutationObserver(queue).observe(m,{
      childList:true,subtree:true,attributes:true,
      attributeFilter:['class','style']
    });
  }
  addEventListener('resize',queue,{passive:true});
  addEventListener('orientationchange',queue,{passive:true});
  if(window.visualViewport) visualViewport.addEventListener('resize',queue,{passive:true});

  /* Delayed passes catch question markup and SOLO v304 post-open fitting. */
  document.addEventListener('click',()=>{
    setTimeout(queue,0);
    setTimeout(queue,80);
  },true);

  queue();
})();
</script>

<style>
/* =========================================================
   U1.1 RC4 — STABLE LOW-RES QUESTION FIT
   One fit owner. Fit is finalized before the question card is
   painted; it is not continuously re-fit while the timer runs.
   ========================================================= */
#modal.active .u11rc4-preparing{
  visibility:hidden !important;
}
</style>

<script>
/* =========================================================
   U1.1 RC4 — fit-before-paint + fit lock + final viewport guard

   Why:
   v304 + U1.1 RC1 + RC2 each had their own async/mutation-driven
   fit pass. On a short viewport those passes could alternately
   reset zoom/type classes and re-measure the card, producing the
   visible "breathing/popping" between question layouts. RC4 is
   the sole fit owner. Legacy fitters remain installed for their
   other behavior, but their fit functions return without writing.
   ========================================================= */
(function(){
  window.__SMQ_U11_RC4_FIT_OWNER__=true;

  const ALL_SHRINK=[
    'u11-shrink1','u11-shrink2','u11-shrink3',
    'u11rc2-shrink1','u11rc2-shrink2','u11rc2-shrink3'
  ];
  const RC2=['u11rc2-shrink1','u11rc2-shrink2','u11rc2-shrink3'];
  let resizeTimer=0;
  let subjectTimer=0;

  function modal(){ return document.getElementById('modal'); }
  function card(){
    const m=modal();
    return m && (m.querySelector('.modal-content,.quiz-modal-card,.modal-card') || m.firstElementChild);
  }
  function questionOpen(){
    const m=modal();
    if(!m || !m.classList.contains('active')) return false;
    const result=document.getElementById('resultSection');
    return !result || getComputedStyle(result).display==='none';
  }
  function viewport(){
    const vv=window.visualViewport;
    return {w:vv?vv.width:innerWidth,h:vv?vv.height:innerHeight};
  }
  function available(){
    const v=viewport();
    return {w:Math.max(280,v.w-28),h:Math.max(240,v.h-28)};
  }
  function clearFit(c){
    ALL_SHRINK.forEach(x=>c.classList.remove(x));
    c.style.zoom='1';
  }
  function naturalMeasure(c){
    const a=available();
    const r=c.getBoundingClientRect();
    return {
      w:Math.max(c.scrollWidth,r.width),
      h:Math.max(c.scrollHeight,r.height),
      availW:a.w, availH:a.h
    };
  }
  function finalGuard(c){
    const a=available();
    let r=c.getBoundingClientRect();
    if(r.width<=a.w+.5 && r.height<=a.h+.5) return;

    const current=Math.max(.01,parseFloat(c.style.zoom)||1);
    const correction=Math.min(
      1,
      a.w/Math.max(1,r.width),
      a.h/Math.max(1,r.height)
    );
    c.style.zoom=String(Math.max(.50,current*correction*.995));

    /* One deterministic rounding guard. Never loop/reflow repeatedly. */
    r=c.getBoundingClientRect();
    if(r.width>a.w+1 || r.height>a.h+1){
      const z=Math.max(.01,parseFloat(c.style.zoom)||1);
      const correction2=Math.min(
        1,
        a.w/Math.max(1,r.width),
        a.h/Math.max(1,r.height)
      );
      c.style.zoom=String(Math.max(.48,z*correction2*.99));
    }
  }

  function fitNow(reason){
    const m=modal(), c=card();
    if(!m || !c || !questionOpen()) return;

    clearFit(c);
    m.scrollTop=0; m.scrollLeft=0;
    c.scrollTop=0; c.scrollLeft=0;

    let x=naturalMeasure(c);

    /* Preserve RC2 typography policy: only HEIGHT pressure reduces type. */
    for(const cls of RC2){
      if(x.h<=x.availH) break;
      RC2.forEach(k=>c.classList.remove(k));
      c.classList.add(cls);
      x=naturalMeasure(c);
    }

    /* Whole-card scaling is the last resort for a genuinely short viewport. */
    if(x.h>x.availH || x.w>x.availW){
      const scale=Math.min(
        1,
        x.availH/Math.max(1,x.h),
        x.availW/Math.max(1,x.w)
      );
      c.style.zoom=String(Math.max(.50,scale));
    }

    /* Acceptance invariant: the finished card must be inside the viewport. */
    finalGuard(c);
    c.dataset.u11rc4Fit='locked';
    c.dataset.u11rc4Reason=String(reason||'open');
    m.scrollTop=0; m.scrollLeft=0;
    c.scrollTop=0; c.scrollLeft=0;
  }

  function prepare(){
    const c=card();
    if(c){
      c.classList.add('u11rc4-preparing');
      c.dataset.u11rc4Fit='preparing';
    }
  }
  function finalize(reason){
    const c=card();
    if(!c) return;
    fitNow(reason);
    c.classList.remove('u11rc4-preparing');
  }

  /* Outer wrappers: hide before the legacy opener mutates question markup,
     then fit synchronously in the same JS task, before the browser paints. */
  const oldTeam=window.openQuestion;
  if(typeof oldTeam==='function'){
    window.openQuestion=function(){
      /* openQuestion() is also the public router used by SOLO.
         TEAM owns this wrapper only in TEAM mode; SOLO must fall through
         untouched so openSoloQuestion() remains the single SOLO RC4 owner. */
      if(window.gameMode !== 'TEAM'){
        return oldTeam.apply(this,arguments);
      }
      prepare();
      const out=oldTeam.apply(this,arguments);
      finalize('team-open');
      return out;
    };
  }

  const oldSolo=window.openSoloQuestion;
  if(typeof oldSolo==='function'){
    window.openSoloQuestion=function(){
      prepare();
      const out=oldSolo.apply(this,arguments);
      finalize('solo-open');
      return out;
    };
  }

  /* A real viewport change is allowed to invalidate the lock. Debounced so
     browser chrome/visualViewport chatter cannot make the question breathe. */
  function refitResize(){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>fitNow('viewport-change'),120);
  }
  addEventListener('resize',refitResize,{passive:true});
  addEventListener('orientationchange',refitResize,{passive:true});
  if(window.visualViewport) visualViewport.addEventListener('resize',refitResize,{passive:true});

  /* Subjective answer reveal is a legitimate content-height change after open.
     Observe only that panel, not the whole modal/card styles, to avoid feedback. */
  const answerPanel=document.querySelector('.subjective-answer-panel154');
  if(answerPanel){
    new MutationObserver(()=>{
      clearTimeout(subjectTimer);
      subjectTimer=setTimeout(()=>fitNow('subjective-reveal'),0);
    }).observe(answerPanel,{attributes:true,attributeFilter:['class','style'],childList:true,subtree:true});
  }
})();
</script>
