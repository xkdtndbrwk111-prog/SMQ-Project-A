const activeEmbeddedSfx = new Set();

function playEmbeddedSfx(name, options = {}) {
  if (isMuted) {
    if (typeof options.onEnded === 'function') options.onEnded();
    return null;
  }

  const src = EMBEDDED_SFX[name];
  if (!src) {
    if (typeof options.onEnded === 'function') options.onEnded();
    return null;
  }

  try {
    const audio = new Audio(src);
    audio.preload = 'auto';
    const baseVolume = Math.max(0, Math.min(1, Number(options.volume ?? 0.82)));
    audio.dataset.baseVolume = String(baseVolume);
    audio.volume = Math.max(0, Math.min(1, baseVolume * sfxUserVolume));
    activeEmbeddedSfx.add(audio);

    let doneCalled = false;
    const done = () => {
      if (doneCalled) return;
      doneCalled = true;
      activeEmbeddedSfx.delete(audio);
      if (typeof options.onEnded === 'function') options.onEnded();
    };

    audio.addEventListener('ended', done, { once:true });
    audio.addEventListener('error', done, { once:true });

    const p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.catch(() => done());
    }
    return audio;
  } catch (e) {
    console.warn('Embedded SFX error:', name, e);
    if (typeof options.onEnded === 'function') options.onEnded();
    return null;
  }
}

function stopEmbeddedSfx() {
  activeEmbeddedSfx.forEach(audio => {
    try {
      audio.pause();
      audio.currentTime = 0;
    } catch (e) {}
  });
  activeEmbeddedSfx.clear();
}

function playFinalRoundHurryUpThenFastBgm() {
  stopSpecialAudio();
  stopBGM();
  bgmPlaybackRate = 1.5;

  if (isMuted || gameEnded || isFinalSequence) return;

  playEmbeddedSfx('hurryup', {
    // v1.00.143 — FINAL ROUND cue at half the previous volume.
    volume: 0.45,
    onEnded: () => {
      if (!isMuted && !gameEnded && !isFinalSequence && finalRoundActive) {
        // startBGM() always starts the MIDI sequence from event 0.
        startBGM();
      }
    }
  });
}

const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

let isBgmPlaying = false;
let isMuted = false;

// v1.00.275 — persist BGM/SFX volume across game restarts and page reloads.
const AUDIO_PREF_STORAGE_KEY_275 = 'SMQ_AUDIO_PREFS_V275';

function clampAudio01(value){
  return Math.max(0, Math.min(1, Number(value) || 0));
}

function loadAudioPrefs275(){
  try {
    const raw = localStorage.getItem(AUDIO_PREF_STORAGE_KEY_275);
    if (!raw) return { bgm:1.0, sfx:1.0 };
    const parsed = JSON.parse(raw);
    return {
      bgm: clampAudio01(parsed && parsed.bgm),
      sfx: clampAudio01(parsed && parsed.sfx)
    };
  } catch (_e) {
    return { bgm:1.0, sfx:1.0 };
  }
}

function saveAudioPrefs275(){
  try {
    localStorage.setItem(AUDIO_PREF_STORAGE_KEY_275, JSON.stringify({
      bgm: clampAudio01(bgmUserVolume),
      sfx: clampAudio01(sfxUserVolume)
    }));
  } catch (_e) {}
}

const initialAudioPrefs275 = loadAudioPrefs275();
let bgmUserVolume = initialAudioPrefs275.bgm;
let sfxUserVolume = initialAudioPrefs275.sfx;

function syncAudioSliders(){
  const bgmPct = Math.round(bgmUserVolume * 100);
  const sfxPct = Math.round(sfxUserVolume * 100);
  ['teamBgmVolume','soloBgmVolume'].forEach(id => {
    const el = document.getElementById(id);
    if (el && Number(el.value) !== bgmPct) el.value = bgmPct;
  });
  ['teamSfxVolume','soloSfxVolume'].forEach(id => {
    const el = document.getElementById(id);
    if (el && Number(el.value) !== sfxPct) el.value = sfxPct;
  });
}


let pendingBgmVolume = null;
let pendingSfxVolume = null;
let audioSliderRaf = 0;
let audioPrefsSaveTimer295 = 0;
let lastAudioApply295 = 0;

function scheduleAudioPrefsSave295(){
  if (audioPrefsSaveTimer295) clearTimeout(audioPrefsSaveTimer295);
  // Do not write localStorage for every tiny thumb movement.
  audioPrefsSaveTimer295 = setTimeout(() => {
    audioPrefsSaveTimer295 = 0;
    saveAudioPrefs275();
    // Once dragging settles, mirror the final value to the other mode's HUD.
    syncAudioSliders();
  }, 220);
}

function flushAudioSliderChanges(now295){
  audioSliderRaf = 0;

  // Audio does not need 60+ parameter writes per second. Around 30 Hz keeps
  // the sound response continuous while leaving the browser free to paint the
  // native range thumb smoothly.
  if (now295 && lastAudioApply295 && now295 - lastAudioApply295 < 30) {
    audioSliderRaf = requestAnimationFrame(flushAudioSliderChanges);
    return;
  }
  lastAudioApply295 = now295 || performance.now();

  if (pendingBgmVolume !== null) {
    const next = pendingBgmVolume;
    pendingBgmVolume = null;
    const wasZero = bgmUserVolume <= 0.0001;
    bgmUserVolume = next;

    if (bgmMasterGain && isBgmPlaying) {
      const target = Math.max(0.0001, 0.82 * (currentBgmSong?.gain || 1) * bgmUserVolume);
      try {
        const now = audioCtx.currentTime;

// MAIN keeps the existing volume unchanged (reference = 1.00).
// Other songs are compensated to match the perceived/RMS level of MAIN.
const BGM_SONGS = [
  { id:'main',        label:'MAIN',        tpq:MARIO_MIDI_TPQ,      bpm:MARIO_MIDI_BPM,      loopTicks:MARIO_LOOP_TICKS,      loopSec:MARIO_LOOP_SEC,      events:MARIO_MIDI_EVENTS,      gain:1.000 },

  { id:'castle',      label:'CASTLE',      tpq:CASTLE_MIDI_TPQ,     bpm:CASTLE_MIDI_BPM,     loopTicks:CASTLE_LOOP_TICKS,     loopSec:CASTLE_LOOP_SEC,     events:CASTLE_MIDI_EVENTS,     gain:2.8125, drumGain:0.08 },
  { id:'underwater',  label:'UNDERWATER',  tpq:UNDERWATER_MIDI_TPQ, bpm:UNDERWATER_MIDI_BPM, loopTicks:UNDERWATER_LOOP_TICKS, loopSec:UNDERWATER_LOOP_SEC, events:UNDERWATER_MIDI_EVENTS, gain:0.625 }
];

let currentBgmSong = BGM_SONGS[0];

// v1.00.13 — one theme is chosen once per page load and remains fixed for the whole run.
// Overall probabilities: Overworld Classic 50%, Overworld Part 2 5%, Underground 20%, Underwater 20%, Castle 5%.
const THEMES = {
  overworld:  { id:'overworld',  label:'OVERWORLD',  bgmId:'main' },
  underground:{ id:'underground',label:'UNDERGROUND',bgmId:'underground' },
  underwater: { id:'underwater', label:'UNDERWATER', bgmId:'underwater' },
  castle:     { id:'castle',     label:'CASTLE',     bgmId:'castle' }
};
let currentTheme = THEMES.overworld;
let currentStageVariant = 'classic'; // classic | part2 (Overworld only)

function setThemeBgm(theme) {
  const nextSong = BGM_SONGS.find(song => song.id === theme.bgmId) || BGM_SONGS[0];
  currentBgmSong = nextSong;
}

function applyTheme(themeId, stageVariant = 'classic') {
  const theme = THEMES[themeId] || THEMES.overworld;
  currentTheme = theme;
  currentStageVariant = (theme.id === 'overworld' && stageVariant === 'part2') ? 'part2' : 'classic';
  document.body.dataset.theme = theme.id;
  document.body.dataset.stageVariant = currentStageVariant;
  setThemeBgm(theme);
  applyThemePixelAssets(theme.id);
  updateThemeTestButtons();

  // If SOLO decorations already exist, recolor/rebuild them immediately.
  // This also makes the intro THEME TEST useful before entering SOLO.
  if (typeof refreshSoloThemeDecorations === 'function') {
    refreshSoloThemeDecorations();
  }

  // Refresh the visible intro/team stage immediately when testing or changing themes.
  if (typeof initIntroStage === 'function') initIntroStage();
  if (typeof initTeamSelectStage === 'function') initTeamSelectStage();
}

function chooseRandomTheme() {
  const roll = Math.random() * 100;
  if (roll < 50) return applyTheme('overworld','classic');
  if (roll < 55) return applyTheme('overworld','part2');
  if (roll < 75) return applyTheme('underground');
  if (roll < 95) return applyTheme('underwater');
  return applyTheme('castle');
}

function updateThemeTestButtons() {
  const activeId = (currentTheme?.id === 'overworld' && currentStageVariant === 'part2')
    ? 'overworld2'
    : (currentTheme?.id || 'overworld');
  document.querySelectorAll('.theme-test-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.themeId === activeId);
  });
}

function selectThemeForTest(event, themeId) {
  event?.preventDefault?.();
  event?.stopPropagation?.();
  const theme = THEMES[themeId];
  if (!theme) return;

  const shouldResume = !isMuted;
  stopBGM();
  applyTheme(themeId, 'classic');
  bgmPlaybackRate = 1;

  // The button click is a user gesture, so audio may start immediately during testing.
  if (shouldResume) setTimeout(() => startBGM(), 45);
}

function midiTickToSec(tick) {
  const song = currentBgmSong || BGM_SONGS[0];
  return ((tick / song.tpq) * (60 / song.bpm)) / bgmPlaybackRate;
}

function midiNoteToFreq(note) {
  return 440 * Math.pow(2, (note - 69) / 12);
}

function ensureBgmNoiseBuffer() {
  if (bgmNoiseBuffer) return;
  const len = Math.floor(audioCtx.sampleRate * 0.18);
  bgmNoiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = bgmNoiseBuffer.getChannelData(0);
  for (let i = 0; i < len; i++) {
    data[i] = Math.random() * 2 - 1;
  }
}

function createBgmMaster() {
  bgmMasterGain = audioCtx.createGain();
  bgmMasterGain.gain.setValueAtTime(Math.max(0.0001, 0.82 * (currentBgmSong?.gain || 1) * bgmUserVolume), audioCtx.currentTime);

  if (currentBgmSong?.id === 'castle') {
    // Castle only: catch the dense transient peaks near the end without
    // lowering the ordinary passages.
    bgmCastleLimiter = audioCtx.createDynamicsCompressor();
    bgmCastleLimiter.threshold.setValueAtTime(-10, audioCtx.currentTime);
    bgmCastleLimiter.knee.setValueAtTime(12, audioCtx.currentTime);
    bgmCastleLimiter.ratio.setValueAtTime(12, audioCtx.currentTime);
    bgmCastleLimiter.attack.setValueAtTime(0.002, audioCtx.currentTime);
    bgmCastleLimiter.release.setValueAtTime(0.14, audioCtx.currentTime);

    bgmCastleMakeup = audioCtx.createGain();
    bgmCastleMakeup.gain.setValueAtTime(1.06, audioCtx.currentTime);

    bgmMasterGain.connect(bgmCastleLimiter);
    bgmCastleLimiter.connect(bgmCastleMakeup);
    bgmCastleMakeup.connect(audioCtx.destination);
  } else {
    bgmCastleLimiter = null;
    bgmCastleMakeup = null;
    bgmMasterGain.connect(audioCtx.destination);
  }
}

function scheduleMidiTone(eventTime, track, midiNote, durationTick, velocity) {
  if (!bgmMasterGain) return;

  const freq = midiNoteToFreq(midiNote);
  const rawDur = midiTickToSec(durationTick);

  const dur = Math.max(0.035, rawDur);
  const vel = Math.max(0, Math.min(1, velocity / 127));

  if (track === 4) {
    ensureBgmNoiseBuffer();

    const src = audioCtx.createBufferSource();
    const filter = audioCtx.createBiquadFilter();
    const gain = audioCtx.createGain();

    src.buffer = bgmNoiseBuffer;
    filter.type = 'highpass';
    filter.frequency.setValueAtTime(1800, eventTime);

    const songDrumGain = currentBgmSong?.drumGain ?? 1;

    // Castle has GM percussion note 49 (crash cymbal) layered on top of the
    // kick/hat pattern around 21.33s, 21.83s, etc. Because this NES synth maps
    // every drum note to the SAME noise source, those simultaneous layers can
    // create an artificial speaker "pop". Keep the crash very low.
    const castleCrashGain =
      (currentBgmSong?.id === 'castle' && midiNote === 49) ? 0.12 : 1;

    const peak = (0.018 + (0.018 * vel)) * songDrumGain * castleCrashGain;
    const drumAttackEnd = eventTime + 0.004;
    const drumReleaseEnd = eventTime + Math.min(dur, 0.09);

    // Start the noise envelope near zero instead of at full amplitude.
    // This removes the discontinuity/click when several noise sources begin together.
    gain.gain.setValueAtTime(0.001, eventTime);
    gain.gain.linearRampToValueAtTime(Math.max(0.001, peak), drumAttackEnd);
    gain.gain.exponentialRampToValueAtTime(0.001, Math.max(drumAttackEnd + 0.001, drumReleaseEnd));

    src.connect(filter);
    filter.connect(gain);
    gain.connect(bgmMasterGain);

    src.start(eventTime);
    src.stop(eventTime + Math.min(dur, 0.10));
    return;
  }

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  if (track === 1) {
    osc.type = 'square';
  } else if (track === 2) {
    osc.type = 'square';
  } else {
    osc.type = 'triangle';
  }

  osc.frequency.setValueAtTime(freq, eventTime);

  const baseGain =
    track === 1 ? 0.055 :
    track === 2 ? 0.036 :
                  0.072;

  const peak = Math.max(0.003, baseGain * vel);
  const attackEnd = eventTime + 0.004;
  const releaseStart = Math.max(attackEnd, eventTime + dur - 0.018);

  gain.gain.setValueAtTime(0.001, eventTime);
  gain.gain.linearRampToValueAtTime(peak, attackEnd);
  gain.gain.setValueAtTime(peak, releaseStart);
  gain.gain.exponentialRampToValueAtTime(0.001, eventTime + dur);

  osc.connect(gain);
  gain.connect(bgmMasterGain);

  osc.start(eventTime);
  osc.stop(eventTime + dur + 0.01);
}

function scheduleBgmAhead() {
  if (!isBgmPlaying || isMuted) return;

  const now = audioCtx.currentTime;
  const horizon = now + 0.25;

  while (true) {
    const song = currentBgmSong || BGM_SONGS[0];
    const ev = song.events[bgmEventIndex];
    const eventTime =
      bgmStartTime +
      (bgmLoopCount * (song.loopSec / bgmPlaybackRate)) +
      midiTickToSec(ev[0]);

    if (eventTime > horizon) break;

    if (eventTime >= now - 0.03) {
      scheduleMidiTone(eventTime, ev[1], ev[2], ev[3], ev[4]);
    }

    bgmEventIndex++;

    if (bgmEventIndex >= song.events.length) {
      bgmEventIndex = 0;
      bgmLoopCount++;
    }
  }
}

function startBGM() {
  if (isBgmPlaying || isMuted || bgmUserVolume <= 0.0001) return;

  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  isBgmPlaying = true;
  bgmEventIndex = 0;
  bgmLoopCount = 0;
  bgmStartTime = audioCtx.currentTime + 0.08;

  createBgmMaster();
  ensureBgmNoiseBuffer();

  scheduleBgmAhead();
  bgmScheduler = setInterval(scheduleBgmAhead, 50);
}

function stopBGM() {
  isBgmPlaying = false;

  if (bgmScheduler) {
    clearInterval(bgmScheduler);
    bgmScheduler = null;
  }

  if (bgmMasterGain) {
    try {
      const now = audioCtx.currentTime;
      bgmMasterGain.gain.cancelScheduledValues(now);
      bgmMasterGain.gain.setValueAtTime(Math.max(0.001, bgmMasterGain.gain.value), now);
      bgmMasterGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
      const oldMaster = bgmMasterGain;
      setTimeout(() => {
        try { oldMaster.disconnect(); } catch (e) {}
      }, 80);
    } catch (e) {}
    bgmMasterGain = null;
  }
  try { bgmCastleLimiter?.disconnect(); } catch(e) {}
  try { bgmCastleMakeup?.disconnect(); } catch(e) {}
  bgmCastleLimiter = null;
  bgmCastleMakeup = null;
}

function stopSpecialAudio() {

function scheduleSpecialNoise(startTime, duration, velocity, master) {
  ensureBgmNoiseBuffer();
  const src = audioCtx.createBufferSource();
  const filter = audioCtx.createBiquadFilter();
  const gain = audioCtx.createGain();
  src.buffer = bgmNoiseBuffer;
  filter.type = 'highpass';
  filter.frequency.setValueAtTime(1500, startTime);
  const peak = 0.018 + (velocity / 127) * 0.030;
  gain.gain.setValueAtTime(peak, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + Math.min(duration, 0.11));
  src.connect(filter); filter.connect(gain); gain.connect(master);
  src.start(startTime);
  src.stop(startTime + Math.min(duration, 0.12));
  specialAudioNodes.push(src);
}

function scheduleSpecialTone(startTime, duration, note, velocity, kind, master) {
  if (kind === 9) {

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = (kind === 2) ? 'triangle' : 'square';
  osc.frequency.setValueAtTime(midiNoteToFreq(note), startTime);
  const base = (kind === 2) ? 0.070 : (kind === 1 ? 0.035 : 0.050);
  const peak = Math.max(0.004, base * (velocity / 127));
  const dur = Math.max(0.03, duration);
  gain.gain.setValueAtTime(0.001, startTime);
  gain.gain.linearRampToValueAtTime(peak, startTime + 0.004);
  gain.gain.setValueAtTime(peak, Math.max(startTime + 0.004, startTime + dur - 0.015));
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
  osc.connect(gain); gain.connect(master);
  osc.start(startTime);
  osc.stop(startTime + dur + 0.01);
  specialAudioNodes.push(osc);
}

function initIntroStage() {
  const stageVisuals = getActiveStageVisuals();
  const bg = document.getElementById('introStageBg');
  if (bg) {
    bg.style.setProperty('--team-stage-img', `url("${stageVisuals.stageImg}")`);
    bg.style.setProperty('--stage-q1', `url("${stageVisuals.qFrames[0]}")`);
    bg.style.setProperty('--stage-q2', `url("${stageVisuals.qFrames[1]}")`);
    bg.style.setProperty('--stage-q3', `url("${stageVisuals.qFrames[2]}")`);
    bg.style.setProperty('--stage-ground-tile', `url("${stageVisuals.groundTile}")`);
  }

  const marioFrames = stageVisuals.marioFrames || TEAM_SELECT_MARIO_FRAMES;
  const mario = document.getElementById('introWalkingMario');
  if (!mario || !marioFrames || marioFrames.length < 4) return;

  stopIntroMarioFrameTimer();

  if (introMarioSecondPassTimer) {
    clearTimeout(introMarioSecondPassTimer);
    introMarioSecondPassTimer = null;
  }

  // Critical: Mario must not be visible on the initial title frame.
  mario.classList.remove('intro-walk-pass', 'intro-run-pass');
  mario.style.visibility = 'hidden';
  mario.style.opacity = '1';
  mario.src = marioFrames[1];

  // Start the first walk only after initial layout/paint.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      mario.style.visibility = '';
      mario.classList.add('intro-walk-pass');

      // Normal walking frame speed.
      startIntroMarioFrames(mario, 120, marioFrames);
    });
  });

  const onFirstPassEnd = (event) => {
    if (event.animationName !== 'introMarioWalkLTR') return;

    mario.removeEventListener('animationend', onFirstPassEnd);
    stopIntroMarioFrameTimer();

    mario.classList.remove('intro-walk-pass');
    mario.style.visibility = 'hidden';

    // Wait 2 seconds, then run back from right to left.
    introMarioSecondPassTimer = setTimeout(() => {
      introMarioSecondPassTimer = null;

      mario.classList.add('intro-run-pass');
      mario.style.visibility = '';

      // Second pass: the SAME small Mario runs back from right to left.
      // Motion-frame change speed is 2x: walking 120ms -> running 60ms.
      startIntroMarioFrames(mario, 60, marioFrames, [1, 2, 3, 2]);

      const onSecondPassEnd = (e) => {
        if (e.animationName !== 'introMarioRunRTL') return;

        mario.removeEventListener('animationend', onSecondPassEnd);
        stopIntroMarioFrameTimer();
        mario.classList.remove('intro-run-pass');
        mario.style.visibility = 'hidden';

        // No further reappearance.
      };

      mario.addEventListener('animationend', onSecondPassEnd);
    }, 2000);
  };

  mario.addEventListener('animationend', onFirstPassEnd);
}

function parseGradeSheet151(sheetName) {
  const raw = String(sheetName || '').trim();

  // SOCIAL:
  //   3학년-사회-게임이름  또는  3-사회-게임이름
  //
  // ENGLISH:
  //   5학년-영어-천재함-게임이름  또는  5-영어-천재함-게임이름
  //
  // Only English uses the publisher level.
  // Accept both legacy labels (3학년-사회-...) and Manager canonical labels
  // (3-사회-...). The real sheet name is still preserved when launching.
  const base = raw.match(/^([3-6])\s*(?:학년\s*)?-\s*(사회|영어)\s*-\s*(.+)$/);
  if (!base) return null;

  const grade = Number(base[1]);
  const subject = base[2];
  const tail = base[3].trim();

  if (subject === '영어') {
    const english = tail.match(/^([^-]+?)\s*-\s*(.+)$/);
    if (!english) return null;

    return {
      grade,
      subject,
      publisher: english[1].trim(),
      sheetName: raw,
      displayName: english[2].trim()
    };
  }

  return {
    grade,
    subject,
    publisher: '',
    sheetName: raw,
    displayName: tail
  };
}

function escapeHtml151(value) {

let cartridgeLoadingTimer225 = 0;

function stopCartridgeLoadingAnimation225() {

function getCartridgeLoadingMarioFrames225() {
  const themeId = currentTheme?.id || document.body?.dataset?.theme || 'overworld';
  return SOLO_THEME_MARIO_FRAMES[themeId] || TEAM_SELECT_MARIO_FRAMES;

function startCartridgeLoadingAnimation225(targetLoading225) {
  const loading = targetLoading225 || document.getElementById('gradeLoading151');
  if (!loading) return;

  stopCartridgeLoadingAnimation225();

  const leftMario = loading.querySelector('.cartridge-loading-mario225.left225');
  const rightMario = loading.querySelector('.cartridge-loading-mario225.right225');
  const dots = loading.querySelector('.cartridge-loading-dots225');
  const frames = getCartridgeLoadingMarioFrames225();

  cartridgeLoadingFrame225 = 0;
  cartridgeLoadingDotStep225 = 0;

  function tick225() {
    if (!loading.isConnected || getComputedStyle(loading).display === 'none') {
      stopCartridgeLoadingAnimation225();
      return;
    }

    if (frames && frames.length) {
      const frame = frames[cartridgeLoadingFrame225 % frames.length];
      if (leftMario) leftMario.src = frame;
      if (rightMario) rightMario.src = frame;
      cartridgeLoadingFrame225++;
    }

    if (dots) {
      const seq = ['.', '..', '...', '..'];
      dots.textContent = seq[cartridgeLoadingDotStep225 % seq.length];
      cartridgeLoadingDotStep225++;
    }
  }

  tick225();
  cartridgeLoadingTimer225 = setInterval(tick225, 180);
}

let privateRankingPrearmGenerationRC36 = 0;

function invalidatePrivateRankingPrearmRC36(){

function canPrearmPrivateHardRC36(){

function preparePrivateHardRankingRC36(){
  if(!canPrearmPrivateHardRC36()) return Promise.resolve('');
  const sheet=String(gameState.selectedSheetName||'');
  const token=String(gameState.privateRepositoryToken||'');
  const epoch=repositoryEpochRC3;
  const current=privateRankingPrearmRC36;
  if(current.sheetName===sheet && current.repositoryToken===token && current.repositoryEpoch===epoch){
    if(current.status==='ready' && current.runToken) return Promise.resolve(current.runToken);
    if(current.status==='pending' && current.promise) return current.promise;
  }
  const generation=++privateRankingPrearmGenerationRC36;
  let resolvePromise;
  const promise=new Promise(resolve=>{resolvePromise=resolve;});
  privateRankingPrearmRC36={status:'pending',runToken:'',sheetName:sheet,repositoryToken:token,repositoryEpoch:epoch,generation,promise};
  google.script.run
    .withSuccessHandler(result=>{
      const runToken=String(result&&result.runToken||'');
      const owned=generation===privateRankingPrearmGenerationRC36 && epoch===repositoryEpochRC3 &&
        sheet===String(gameState.selectedSheetName||'') && token===String(gameState.privateRepositoryToken||'');
      if(!owned){resolvePromise('');return;}
      if(!runToken){
        privateRankingPrearmRC36={...privateRankingPrearmRC36,status:'failed',runToken:'',promise:null};
        resolvePromise('');return;
      }
      privateRankingPrearmRC36={...privateRankingPrearmRC36,status:'ready',runToken,promise:null};
      resolvePromise(runToken);
    })
    .withFailureHandler(err=>{
      const owned=generation===privateRankingPrearmGenerationRC36 && epoch===repositoryEpochRC3 &&
        sheet===String(gameState.selectedSheetName||'') && token===String(gameState.privateRepositoryToken||'');
      if(owned){
        privateRankingPrearmRC36={...privateRankingPrearmRC36,status:'failed',runToken:'',promise:null};
        console.error('개인 HARD 랭킹 pre-arm 실패:',err);
      }

}
function consumePreparedPrivateHardRC36(runToken){
  const token=String(runToken||'');
  if(!token || privateRankingPrearmRC36.status!=='ready' || privateRankingPrearmRC36.runToken!==token) return false;
  privateRankingPrearmRC36={...privateRankingPrearmRC36,status:'idle',runToken:'',promise:null};
  return true;
}
function waitForPrivateHardTokenRC36(onReady,onFailure){
  const overlay=ensureSoloDifficultySelectorRC2();
  overlay.querySelectorAll('button').forEach(b=>b.disabled=true);
  const generationAtWait=privateRankingPrearmGenerationRC36;
  preparePrivateHardRankingRC36().then(runToken=>{

    overlay.querySelectorAll('button').forEach(b=>b.disabled=false);

function shuffleCopy(list) {
  const arr = Array.isArray(list) ? list.slice() : [];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function normalizedQuestionType(q) {
  const type = String((q && q.type) || '').trim().toUpperCase();
  if (type === 'SUBJECTIVE' || type === '주관식') return 'SUBJECTIVE';
  if (type === 'OX' || type === 'OX퀴즈') return 'OX';
  return 'MULTIPLE';
}

function prepareMultipleChoiceForPlay(q) {
  const clone = { ...q };
  const originalOptions = Array.isArray(q.options)
    ? q.options.map(v => String(v ?? '').trim()).filter(Boolean)
    : [];

  if (normalizedQuestionType(q) !== 'MULTIPLE' || originalOptions.length === 0) {
    clone.options = originalOptions;
    return clone;
  }

  const rawAnswer = String(q.answer ?? '').trim();
  let correctText = '';

  const answerIndex = Number(rawAnswer);
  if (Number.isInteger(answerIndex) && answerIndex >= 1 && answerIndex <= originalOptions.length) {
    correctText = originalOptions[answerIndex - 1];
  } else {
    correctText = originalOptions.find(opt =>
      opt.trim().toUpperCase() === rawAnswer.toUpperCase()
    ) || rawAnswer;
  }

  const distractors = originalOptions.filter(opt => opt !== correctText);
  const chosenDistractors = shuffleCopy(distractors).slice(0, 2);
  const displayed = shuffleCopy([correctText, ...chosenDistractors].filter(Boolean));

  const displayedCorrectIndex = displayed.findIndex(opt => opt === correctText);
  clone.options = displayed;
  clone.answer = String(displayedCorrectIndex + 1);
  clone.correctText = correctText;
  clone.explanation = displayedCorrectIndex >= 0
    ? `정답: ${displayedCorrectIndex + 1}번 · ${correctText}`
    : (q.explanation || '');

  return clone;
}

/* =========================================================
   v1.00.265 — 묶음문제 family-level selection (Step 4)
   - one family can contribute at most one variant to a game
   - TEAM: OX / 객관식 / 주관식 모두 eligible
   - SOLO: OX / 객관식만 eligible
   - legacy v1 rows already arrive with one unique familyId per row
   - the existing 25-question cap is intentionally preserved in this checkpoint;
     SOLO "all eligible bundles" is a separate follow-up UI/flow change.
   ========================================================= */
function selectOneVariantPerQuestionFamily(sourceQuestions, options = {}) {
  const includeSubjective = options.includeSubjective !== false;
  const source = (Array.isArray(sourceQuestions) ? sourceQuestions : [])
    .filter(q => q && !q.isNull);

  const families = [];
  const familyMap = new Map();

  source.forEach((q, idx) => {
    if (!includeSubjective && normalizedQuestionType(q) === 'SUBJECTIVE') return;

    const rawFamilyId = String(q.familyId || '').trim();
    const familyKey = rawFamilyId || `fallback_${q.sourceNum || q.num || idx + 1}`;

    let family = familyMap.get(familyKey);
    if (!family) {
      family = {
        key: familyKey,
        order: Number(q.familyOrder || families.length + 1),
        variants: []
      };
      familyMap.set(familyKey, family);
      families.push(family);
    }

    family.variants.push({
      ...q,
      sourceNum: Number(q.sourceNum || q.num || idx + 1)
    });
  });

  return families
    .sort((a, b) => a.order - b.order)
    .map(family => {
      const eligible = family.variants.filter(q =>
        includeSubjective || normalizedQuestionType(q) !== 'SUBJECTIVE'
      );
      if (!eligible.length) return null;
      const chosen = eligible[Math.floor(Math.random() * eligible.length)];
      return {
        ...chosen,
        familyId: chosen.familyId || family.key
      };
    })
    .filter(Boolean);
}

function proportionalSampleQuestions(sourceQuestions, limit = 25, options = {}) {
  const includeSubjective = options.includeSubjective !== false;

  const source = (Array.isArray(sourceQuestions) ? sourceQuestions : [])
    .filter(q => q && !q.isNull)
    .map((q, idx) => ({
      ...q,
      sourceNum: Number(q.sourceNum || q.num || idx + 1)
    }))
    .filter(q => includeSubjective || normalizedQuestionType(q) !== 'SUBJECTIVE');

  if (source.length <= limit) return shuffleCopy(source);

  const types = includeSubjective
    ? ['OX', 'MULTIPLE', 'SUBJECTIVE']
    : ['OX', 'MULTIPLE'];

  const groups = {};
  types.forEach(type => {
    groups[type] = source.filter(q => normalizedQuestionType(q) === type);
  });

  const total = source.length;
  const quotaInfo = types.map(type => {
    const exact = (groups[type].length / total) * limit;
    const base = Math.min(groups[type].length, Math.floor(exact));
    return {
      type,
      exact,
      base,
      remainder: exact - Math.floor(exact)
    };
  });

  let assigned = quotaInfo.reduce((sum, q) => sum + q.base, 0);
  let remaining = limit - assigned;

  // Largest-remainder allocation preserves the cartridge's overall type ratio
  // as closely as possible while always producing exactly 25 questions.
  const byRemainder = quotaInfo
    .slice()
    .sort((a, b) => b.remainder - a.remainder || groups[b.type].length - groups[a.type].length);

  while (remaining > 0) {
    let changed = false;
    for (const info of byRemainder) {
      if (remaining <= 0) break;
      if (info.base < groups[info.type].length) {
        info.base += 1;
        remaining -= 1;
        changed = true;
      }
    }
    if (!changed) break;
  }

  const selected = [];
  quotaInfo.forEach(info => {
    selected.push(...shuffleCopy(groups[info.type]).slice(0, info.base));
  });

  // Defensive fill for unusual/malformed type labels.
  if (selected.length < limit) {
    const used = new Set(selected.map(q => q.sourceNum));
    const leftovers = shuffleCopy(source.filter(q => !used.has(q.sourceNum)));
    selected.push(...leftovers.slice(0, limit - selected.length));
  }

  return shuffleCopy(selected.slice(0, limit));
}

function buildRandomizedQuestionBoard(sourceQuestions) {
  const source = (Array.isArray(sourceQuestions) ? sourceQuestions : [])
    .filter(q => q && !q.isNull)
    .map((q, idx) => ({
      ...q,
      sourceNum: Number(q.sourceNum || q.num || idx + 1)
    }));

  const pools = {
    SUBJECTIVE: shuffleCopy(source.filter(q => normalizedQuestionType(q) === 'SUBJECTIVE')),
    OX: shuffleCopy(source.filter(q => normalizedQuestionType(q) === 'OX')),
    MULTIPLE: shuffleCopy(source.filter(q => normalizedQuestionType(q) === 'MULTIPLE'))
  };

  const board = Array(25).fill(null);
  // Multi-cartridge questions may legitimately share the same sourceNum.
  // Deduplicate by the composite runtime identity instead.
  const usedQuestionKeys = new Set();
  const questionKey = (q) =>
    String(q.questionIdentity || (
      q.cartridgeIdentity
        ? `${q.cartridgeIdentity}::${q.sourceNum}`
        : q.sourceNum
    ));

  const takeFromPool = (type) => {
    const pool = pools[type] || [];
    while (pool.length) {
      const q = pool.shift();
      const key = questionKey(q);
      if (!usedQuestionKeys.has(key)) {
        usedQuestionKeys.add(key);
        return q;
      }
    }
    return null;
  };

  const takeAny = (preferredTypes = []) => {
    for (const type of preferredTypes) {
      const q = takeFromPool(type);
      if (q) return q;
    }
    for (const type of shuffleCopy(['MULTIPLE', 'OX', 'SUBJECTIVE'])) {
      const q = takeFromPool(type);
      if (q) return q;
    }
    return null;
  };

  const place = (position, preferredTypes) => {
    if (board[position - 1]) return;
    const q = takeAny(preferredTypes);
    if (q) board[position - 1] = q;
  };

  // Strongest bingo squares: use the selected subjective questions first.
  // If proportional sampling produced fewer than five subjective questions,
  // the remaining strong squares fall back to multiple choice, then O/X.
  shuffleCopy([13, 1, 5, 21, 25]).forEach(pos =>
    place(pos, ['SUBJECTIVE', 'MULTIPLE', 'OX'])
  );

  // Weak edge squares: O/X first.
  shuffleCopy([2,3,4,6,10,11,15,16,20,22,23,24]).forEach(pos =>
    place(pos, ['OX', 'MULTIPLE', 'SUBJECTIVE'])
  );

  // Inner intersections: multiple choice first.
  shuffleCopy([7,9,17,19]).forEach(pos =>
    place(pos, ['MULTIPLE', 'OX', 'SUBJECTIVE'])
  );

  // Remaining inner squares: flexible, with multiple choice preferred.
  shuffleCopy([8,12,14,18]).forEach(pos =>
    place(pos, ['MULTIPLE', 'OX', 'SUBJECTIVE'])
  );

  for (let pos = 1; pos <= 25; pos++) {
    if (!board[pos - 1]) place(pos, ['MULTIPLE', 'OX', 'SUBJECTIVE']);
  }

  return board.map((q, idx) => {
    if (!q) return { num: idx + 1, isNull: true };
    const prepared = prepareMultipleChoiceForPlay(q);
    return {
      ...prepared,
      num: idx + 1,
      boardNum: idx + 1,
      sourceNum: q.sourceNum,
      isNull: false
    };
  });
}

function balancedSampleByCartridge(sourceQuestions, limit, options = {}) {
  const source = Array.isArray(sourceQuestions) ? sourceQuestions.filter(q => q && !q.isNull) : [];
  if (source.length <= limit) return shuffleCopy(source);

  const order = [];
  const groups = new Map();
  source.forEach(q => {
    const key = String(q.cartridgeIdentity || '__single__');
    if (!groups.has(key)) { groups.set(key, []); order.push(key); }
    groups.get(key).push(q);
  });

  const quota = new Map(order.map(k => [k, 0]));
  let assigned = 0;
  while (assigned < limit) {
    let progressed = false;
    for (const key of order) {
      if (assigned >= limit) break;
      const available = groups.get(key).length;
      if (quota.get(key) < available) {
        quota.set(key, quota.get(key) + 1);
        assigned++;
        progressed = true;
      }
    }
    if (!progressed) break;
  }

  const picked = [];
  order.forEach(key => {
    const take = quota.get(key);
    if (!take) return;
    picked.push(...proportionalSampleQuestions(groups.get(key), take, options));
  });
  return shuffleCopy(picked);
}

function randomizeQuestionsForNewGame() {
  const bank = Array.isArray(gameState.questionBank) && gameState.questionBank.length
    ? gameState.questionBank
    : gameState.questions;

  const includeSubjective = gameMode !== 'SOLO';

  // Step 4: choose one eligible variant from each 묶음문제 first.
  const onePerFamily = selectOneVariantPerQuestionFamily(bank, {
    includeSubjective
  });

  // SOLO uses at most 50 eligible 묶음문제, with one random eligible variant
  // already selected above. TEAM keeps the existing 25-question sampling/board.
  if (gameMode === 'SOLO') {
    // Multi remains balanced across cartridges. Single randomly samples its cartridge.
    // If 50 or fewer eligible families exist, slice() naturally keeps them all.
    const soloPool = gameState.isMultiCartridge
      ? balancedSampleByCartridge(onePerFamily, 50, { includeSubjective: false })
      : shuffleCopy(onePerFamily).slice(0, 50);
    gameState.questions = soloPool.map((q, idx) => {
      const prepared = prepareMultipleChoiceForPlay(q);
      return {
        ...prepared,
        num: idx + 1,
        boardNum: idx + 1,
        sourceNum: Number(q.sourceNum || q.num || idx + 1),
        isNull: false
      };
    });
    return;
  }

  const sampled = gameState.isMultiCartridge
    ? balancedSampleByCartridge(onePerFamily, 25, { includeSubjective })
    : proportionalSampleQuestions(onePerFamily, 25, { includeSubjective });

  gameState.questions = buildRandomizedQuestionBoard(sampled);
}

function emitSoloUnderwaterBubble() {

// v1.00.22 — Blooper click easter egg: burst of underwater bubbles.
function emitSoloBlooperBubbleBurst(blooper, count = 18) {
  if (getCurrentSoloThemeId() !== 'underwater') return;
  if (!blooper) return;

  // In SOLO the Blooper is intentionally reparented directly into #soloDecorLeft.
  // Use that visible decoration container as the burst coordinate host.
  const platform = blooper.closest('.solo-decor-platform') || blooper.closest('#soloDecorLeft') || blooper.parentElement;
  if (!platform) return;

  let layer = Array.from(platform.children || []).find(el => el.classList && el.classList.contains('solo-bubble-layer'));
  if (!layer) {
    layer = document.createElement('div');
    layer.className = 'solo-bubble-layer';
    layer.style.position = 'absolute';
    layer.style.inset = '0';
    layer.style.overflow = 'visible';
    layer.style.pointerEvents = 'none';
    layer.style.zIndex = '20';
    platform.appendChild(layer);
  }

  const br = blooper.getBoundingClientRect();
  const pr = platform.getBoundingClientRect();
  const cx = (br.left - pr.left) + br.width * 0.52;
  const cy = (br.top - pr.top) + br.height * 0.42; // follows Blooper's actual raised screen position

  for (let i = 0; i < count; i++) {
    const bubble = document.createElement('img');
    bubble.className = 'solo-air-bubble';
    bubble.src = SOLO_UNDERWATER_BUBBLE;
    bubble.alt = '';

    // Spread the burst around the Blooper, then let each bubble rise independently.
    const angleBias = (Math.random() - 0.5) * br.width * 0.95;
    const verticalBias = (Math.random() - 0.5) * br.height * 0.55;
    bubble.style.left = `${cx + angleBias}px`;
    bubble.style.top = `${cy + verticalBias}px`;
    bubble.style.width = `${7 + Math.random() * 7}px`;
    bubble.style.animationDuration = `${2.5 + Math.random() * 1.25}s`;
    bubble.style.animationDelay = `${Math.random() * 0.42}s`;

    layer.appendChild(bubble);
    setTimeout(() => bubble.remove(), 4300);
  }
}

function initSoloDecorations() {
  const mario = document.getElementById('soloDecorMario');
  const spike = document.getElementById('soloDecorSpike');
  const leftDecor = document.getElementById('soloDecorLeft');

  // Keep the decorative enemy next to Mario on the left platform.
  if (leftDecor && spike && spike.parentElement !== leftDecor) {
    leftDecor.appendChild(spike);
  }

  // Underwater seaweed used to remain inside #soloDecorRight, which SOLO mode hides.
  // Move it into the visible left decoration container so it can sit to Blooper's right.
  const seaweed = document.getElementById('soloUnderwaterSeaweed');
  const seaweedSmall = document.getElementById('soloUnderwaterSeaweedSmall');
  if (leftDecor && seaweed && seaweed.parentElement !== leftDecor) {
    leftDecor.appendChild(seaweed);
  }
  if (leftDecor && seaweedSmall && seaweedSmall.parentElement !== leftDecor) {
    leftDecor.appendChild(seaweedSmall);
  }

  // Left coin and right question-block easter eggs remain intentionally disabled.
  document.querySelectorAll('[data-coin-easter]').forEach(img => {
    img.onclick = null;
  });
  const question = document.getElementById('soloDecorQuestion');
  if (question) question.onclick = null;

  if (spike) {
    spike.onclick = () => {
      // Underwater replaces Spiny/Spike with a Blooper.
      // Clicking the Blooper releases a large bubble burst instead of flipping it.
      if (getCurrentSoloThemeId() === 'underwater') {
        if (!soloEasterReady('spike')) return;
        emitSoloBlooperBubbleBurst(spike, 18);
        return;
      }
      if (!soloEasterReady('spike')) return;

      // v1.00.93 — jump and orientation are independent.
      // The sprite rises exactly one tile; at the apex its orientation switches instantly.
      if (spike.dataset.flipBusy === '1') return;
      const wasFlipped = spike.dataset.flipped === '1';
      spike.dataset.flipBusy = '1';
      spike.classList.remove('easter-hop','ee-flip-to-upside','ee-flip-to-normal');
      // Preserve the landed orientation while ascending.
      spike.classList.toggle('easter-flip', wasFlipped);
      void spike.offsetWidth;
      spike.classList.add('ee-v93-jump');
      playSoloSpikeFlipSound();

      // .76s jump => apex at .38s. Flip is a discrete class change, not an interpolated animation.
      const apexTimer = setTimeout(() => {
        if (!spike.isConnected) return;
        spike.classList.toggle('easter-flip', !wasFlipped);
        spike.dataset.flipped = wasFlipped ? '0' : '1';
      }, 380);

      const finishFlip = () => {
        clearTimeout(apexTimer);
        spike.classList.remove('ee-v93-jump','ee-flip-to-upside','ee-flip-to-normal');
        // Guarantee final orientation even if animationend fires a few ms early/late.
        spike.classList.toggle('easter-flip', !wasFlipped);
        spike.dataset.flipped = wasFlipped ? '0' : '1';
        spike.dataset.flipBusy = '0';
      };
      spike.addEventListener('animationend', finishFlip, {once:true});
    };
  }

  if (mario) {
    mario.onclick = () => {
      if (!soloEasterReady('mario')) return;

      // Underwater Mario never "stops": clicking only turns him around.
      if (getCurrentSoloThemeId() === 'underwater') {
        // v1.00.26 — tiny synthesized underwater swim click SFX (no audio file/base64).
        playSoloUnderwaterSwimClickSound();
        soloUnderwaterFacingLeft = !soloUnderwaterFacingLeft;
        mario.classList.toggle('underwater-facing-left', soloUnderwaterFacingLeft);
        return;
      }

      const frames = getSoloMarioFramesForTheme();
      soloDecorMarioPaused = true;
      mario.src = frames[0];
      mario.classList.add('easter-pause');
      playSoloThunkSound();

      setTimeout(() => {
        soloDecorMarioPaused = false;
        mario.classList.remove('easter-pause');
        const resumeSeq = [1, 2, 3, 2];
        mario.src = frames[
          resumeSeq[soloDecorMarioFramePos % resumeSeq.length] % frames.length
        ];
      }, 700);
    };
  }

  refreshSoloThemeDecorations();
}

    // Find only the nearest exact CORRECT label and retitle it once.
    let scope = correctEl.parentElement;
    for (let depth=0; depth<3 && scope; depth++, scope=scope.parentElement) {
      const nodes = scope.querySelectorAll('*');
      let changed = false;
      for (const node of nodes) {
        if (node.children.length === 0 && String(node.textContent||'').trim() === 'CORRECT') {

          changed = true;

  }
}

/* =========================================================
   U1/U2 — anonymous game-start telemetry client hook
   - Fire-and-forget: gameplay never waits for telemetry.
   - teamCount: SOLO=1, TEAM=selectedTeamCount (2..6).
   ========================================================= */
function makeUsageEventIdU1() {
  try {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
  } catch (_) {}
  return `u1-${Date.now()}-${Math.random().toString(36).slice(2,12)}`;
}

function recordUsageStartFireAndForgetU1(mode) {
  try {
    /* U3 collection-side boundary: PRIVATE games do not call telemetry at all. */
    if (String(gameState.repositoryKind || '').toUpperCase() !== 'PUBLIC') return;

    const normalizedMode = String(mode || '').toUpperCase();
    const names = Array.isArray(gameState.selectedSheetNames)
      ? gameState.selectedSheetNames.map(v => String(v || '').trim()).filter(Boolean)
      : [];
    const cartridgeIds = Array.isArray(gameState.selectedCartridgeIds)
      ? gameState.selectedCartridgeIds.map(v => String(v || '').trim()).filter(Boolean)
      : [];

    /* If the current PUBLIC data payload did not provide stable IDs, fail closed:
       gameplay continues, telemetry is simply skipped. */
    if (!names.length || cartridgeIds.length !== names.length) return;

    const payload = {
      eventId: makeUsageEventIdU1(),
      mode: normalizedMode,
      teamCount: normalizedMode === 'TEAM'
        ? Math.max(2, Math.min(6, Number(selectedTeamCount) || 2))
        : 1,
      repositoryKind: 'PUBLIC',
      grade: selectedGrade151 == null ? '' : Number(selectedGrade151),
      subject: String(selectedSubject152 || ''),
      publisher: String(selectedPublisher154 || ''),
      cartridge: names.join(' | '),       // informational only; server canonicalizes
      cartridgeIds: cartridgeIds.slice(), // server authority boundary
      cartridgeCount: cartridgeIds.length
    };
    google.script.run.recordUsageStartU1(payload);
  } catch (_) {
    // Telemetry must never affect gameplay.
  }
}

function updateResponsiveBoard() {

  if (!grid) return;

  const vv = window.visualViewport;
  const viewportW = (vv && vv.width) ? vv.width : window.innerWidth;
  const viewportH = (vv && vv.height) ? vv.height : window.innerHeight;
  const viewportLeft = (vv && Number.isFinite(vv.offsetLeft)) ? vv.offsetLeft : 0;
  const viewportTop = (vv && Number.isFinite(vv.offsetTop)) ? vv.offsetTop : 0;

  const isSolo =
    document.body.classList.contains('solo-mode') &&
    document.body.classList.contains('solo-game-active');

  // v1.00.269 — SOLO owns the full visual viewport with its five-row stage.
  // Do not run the legacy shared 5×5 board fitter on it.
  if (isSolo) {
    // v273: opening a mobile soft keyboard on the ranking/name UI changes
    // visualViewport.height. Keep the finished SOLO backdrop stable instead of
    // crushing the stage while GAME OVER is open.
    if (!document.body.classList.contains('solo-gameover-open')) {
      updateSoloSingleStageLayout267(viewportW, viewportH, viewportLeft, viewportTop);
    }
    return;
  }

  const gap = 10;
  const cols = 5;
  const rows = 5;
  const hudVisible = document.body.classList.contains('game-hud-ready');

  let leftBound = viewportLeft + 16;
  let rightBound = viewportLeft + viewportW - 16;

  if (hudVisible) {
    const leftBar = document.getElementById('leftGameBar');
    const rightBar = document.getElementById('rightGameBar');

    if (leftBar && rightBar) {
      const leftRect = leftBar.getBoundingClientRect();
      const rightRect = rightBar.getBoundingClientRect();
      const innerGap = Math.max(18, Math.min(30, viewportW * 0.016));
      leftBound = Math.max(leftBound, leftRect.right + innerGap);
      rightBound = Math.min(rightBound, rightRect.left - innerGap);
    } else {
      const rootStyles = getComputedStyle(document.documentElement);
      const sideWidth =
        parseFloat(rootStyles.getPropertyValue('--game-side-width')) || 180;
      const sideGap =
        parseFloat(rootStyles.getPropertyValue('--game-side-gap')) || 24;
      leftBound += sideWidth + sideGap;
      rightBound -= sideWidth + sideGap;
    }
  }

  const availW = Math.max(220, rightBound - leftBound);
  const availH = Math.max(220, viewportH - 44);

  const sizeByW = Math.floor((availW - gap * (cols - 1)) / cols);
  const sizeByH = Math.floor((availH - gap * (rows - 1)) / rows);
  const tileSize = Math.max(28, Math.min(sizeByW, sizeByH, 176));

  grid.style.setProperty('--tile-size', `${tileSize}px`);
  grid.style.setProperty('grid-template-columns', `repeat(5, ${tileSize}px)`, 'important');
  grid.style.setProperty('grid-template-rows', `repeat(5, ${tileSize}px)`, 'important');
  grid.style.setProperty('grid-auto-rows', `${tileSize}px`, 'important');

  const boardW = cols * tileSize + gap * (cols - 1);
  const boardH = rows * tileSize + gap * (rows - 1);

  grid.style.setProperty('width', `${boardW}px`, 'important');
  grid.style.setProperty('height', `${boardH}px`, 'important');
  grid.style.setProperty('max-width', `${boardW}px`, 'important');
  grid.style.setProperty('max-height', `${boardH}px`, 'important');
  grid.style.setProperty('overflow', 'visible', 'important');

  grid.dataset.layout = '5x5';

  const fittedRect242 = grid.getBoundingClientRect();
  const root242 = document.documentElement;
  root242.style.setProperty('--board-ui-top242', `${Math.round(fittedRect242.top)}px`);
  root242.style.setProperty('--board-ui-height242', `${Math.round(fittedRect242.height)}px`);

}

let boardQuestionBlockTimer = null;
let boardQuestionBlockFrame = 0;


/* =========================================================
   v1.00.121 — SHARED QUESTION / COIN FRAME CLOCK
   Exact common phase:
   image 2 = 0.6s
   image 1 = 1.2s
   image 3 = 0.6s
   image 1 = 1.2s
   total   = 3.6s

   All JS-driven question blocks and coins sample this same clock,
   so they cannot drift apart.
   ========================================================= */
const QUESTION_COIN_SYNC_EPOCH_121 = performance.now();

/* =========================================================
   v1.00.124 — BASE FRAME + OVERLAY PULSE CLOCK
   frame 1 is always fully visible.
   wait 1.0s -> frame 2 fades in/out for 0.4s
   wait 1.0s -> frame 3 fades in/out for 0.4s
   repeat (2.8s total)
   ========================================================= */
const QUESTION_COIN_PULSE_CYCLE_124 = 2800;
const QUESTION_COIN_PULSE_MS_124 = 400;

function getQuestionCoinPulse124(now = performance.now()) {
  const t = ((now - QUESTION_COIN_SYNC_EPOCH_121) % QUESTION_COIN_PULSE_CYCLE_124 + QUESTION_COIN_PULSE_CYCLE_124) % QUESTION_COIN_PULSE_CYCLE_124;

  let frame = -1;
  let local = 0;

  if (t >= 1000 && t < 1400) {
    frame = 1; // image 2
    local = t - 1000;
  } else if (t >= 2400 && t < 2800) {
    frame = 2; // image 3
    local = t - 2400;
  }

  if (frame < 0) return { frame:-1, opacity:0 };

  // 0.2s fade in + 0.2s fade out
  const half = QUESTION_COIN_PULSE_MS_124 / 2;
  const opacity = local < half
    ? (local / half)
    : Math.max(0, 1 - ((local - half) / half));

  return { frame, opacity };
}

function emitSoloStageUnderwaterBubble269() {
  if (gameMode !== 'SOLO' || !soloState.started) return;
  if ((currentTheme?.id || document.body?.dataset?.theme) !== 'underwater') return;

  const stage = document.querySelector('#grid.solo-single-stage267 .solo-stage267');
  const mario = stage?.querySelector('.solo-mario267');
  if (!stage || !mario) return;

  const sr = stage.getBoundingClientRect();
  const mr = mario.getBoundingClientRect();
  if (!(sr.width > 0 && sr.height > 0 && mr.width > 0 && mr.height > 0)) return;

  const scale = Math.max(0.01, Number(getComputedStyle(document.getElementById('grid')).getPropertyValue('--solo-scale267')) || 1);
  const bubble = document.createElement('img');
  bubble.className = 'solo-stage-bubble269';
  bubble.src = SOLO_UNDERWATER_BUBBLE;
  bubble.alt = '';

  // v270: the bubble follows the same logical scale as Mario (native canvas 8×16).
  const bubbleW = 8 * scale;
  const bubbleH = 16 * scale;
  bubble.style.width = `${bubbleW}px`;
  bubble.style.height = `${bubbleH}px`;
  const mouthX = (mr.left - sr.left) + mr.width * 0.80 - bubbleW * 0.30;
  const mouthY = (mr.top - sr.top) + mr.height * 0.30 - bubbleH * 0.25;
  bubble.style.left = `${Math.round(mouthX)}px`;
  bubble.style.top = `${Math.round(mouthY)}px`;
  stage.appendChild(bubble);

  // Do not fade/cull early. The bubble remains visible until it rises completely
  // through the top edge of the SOLO viewport.
  const risePx = Math.max(1, mouthY + bubbleH + 2);
  const duration = Math.max(2600, risePx * 9);
  const anim = bubble.animate(
    [
      { transform:'translate(0,0)' },
      { transform:`translate(${3 * scale}px,${-risePx}px)` }
    ],
    { duration, easing:'linear', fill:'forwards' }
  );
  anim.onfinish = () => bubble.remove();
}

function startSoloStageUnderwaterBubbles269() {

  soloStageUnderwaterBubbleStartTimer269 = setTimeout(() => {
    soloStageUnderwaterBubbleStartTimer269 = 0;

function buildSoloWorldProp268() {

      img.alt = '';

    }

  }

}

function updateSoloSingleStageLayout267(viewportW, viewportH, viewportLeft = 0, viewportTop = 0) {
  const grid = document.getElementById('grid');
  if (!grid || !grid.classList.contains('solo-single-stage267')) return;

  // v272: the ORIGINAL five-row structure owns the 92% scale.
  // Row 5 (the ground directly under Mario) remains the layout/alignment bottom.
  // A second ground row continues below it only as visual filler and may be clipped
  // by the viewport; it must never shrink the main five-row composition.
  const safeW = Math.max(1, viewportW);
  const safeH = Math.max(1, viewportH);
  const primaryH = safeH * 0.92;
  const scale = primaryH / 80;
  const tile = 16 * scale;
  const primaryTop = (safeH - primaryH) / 2;
  const stageW = safeW;
  const stageH = safeH;
  const centerX = stageW / 2;

  grid.style.setProperty('--solo-scale267', String(scale));
  grid.style.setProperty('left', `${Math.round(viewportLeft)}px`, 'important');
  grid.style.setProperty('top', `${Math.round(viewportTop)}px`, 'important');
  grid.style.setProperty('width', `${stageW}px`, 'important');
  grid.style.setProperty('height', `${stageH}px`, 'important');
  grid.style.setProperty('max-width', `${stageW}px`, 'important');
  grid.style.setProperty('max-height', `${stageH}px`, 'important');
  grid.style.setProperty('grid-template-columns', 'none', 'important');
  grid.style.setProperty('grid-template-rows', 'none', 'important');
  grid.style.setProperty('grid-auto-rows', 'auto', 'important');
  grid.style.setProperty('overflow', 'hidden', 'important');
  grid.dataset.layout = 'solo-five-layer-full-height';

  const hit = grid.querySelector('.solo-question-hit267');
  const block = grid.querySelector('.solo-question-block267');
  const mario = grid.querySelector('.solo-mario267');
  const coin = grid.querySelector('.solo-coin267');
  const pipe = grid.querySelector('.solo-pipe268');
  const prop = grid.querySelector('.solo-world-prop268');
  const ground = grid.querySelector('.solo-ground268');

  const heroLeft = centerX - tile / 2;
  const blockTop = primaryTop + tile;        // row 2
  const actorTop = primaryTop + tile * 3;    // row 4
  const groundTop = primaryTop + tile * 4;   // row 5

  if (hit) {
    hit.style.left = `${heroLeft}px`;
    hit.style.top = `${blockTop}px`;
    hit.style.width = `${tile}px`;
    hit.style.height = `${tile}px`;
  }
  if (block) {
    block.style.width = `${tile}px`;
    block.style.height = `${tile}px`;
  }
  if (mario) {
    mario.style.left = `${heroLeft}px`;
    mario.style.top = `${actorTop}px`;
    mario.style.width = `${tile}px`;
    mario.style.height = `${tile}px`;
  }
  if (coin) {
    coin.style.width = `${8 * scale}px`;
    coin.style.height = `${16 * scale}px`;
    coin.style.left = `${centerX - 4 * scale}px`;
    coin.style.top = `${4 * scale}px`;
  }
  if (pipe) {
    const pipeSize = 32 * scale;
    pipe.style.width = `${pipeSize}px`;
    pipe.style.height = `${pipeSize}px`;
    // v269: one full logical block farther left than v268.
    pipe.style.left = `${heroLeft - 8 * scale - pipeSize - tile}px`;
    pipe.style.top = `${primaryTop + 32 * scale}px`;
  }
  if (ground) {
    ground.style.top = `${groundTop}px`;
    ground.style.height = `${tile * 2}px`;
    ground.style.backgroundImage = `url("${getSoloStageGround268()}")`;
    ground.style.backgroundSize = `${tile}px ${tile}px`;
  }
  if (prop) {
    const kind = prop.dataset.kind || 'none';
    // v269: one full logical block farther right than v268.
    const propLeft = heroLeft + tile + 8 * scale + tile;
    if (kind === 'bush') {
      prop.style.display = 'block';
      prop.style.left = `${propLeft}px`;
      prop.style.top = `${actorTop}px`;
      prop.style.width = `${48 * scale}px`;
      prop.style.height = `${tile}px`;
      [...prop.querySelectorAll('img')].forEach((img, i) => {
        img.style.left = `${i * tile}px`;
        img.style.top = '0px';
        img.style.width = `${tile}px`;
        img.style.height = `${tile}px`;
      });
    } else if (kind === 'coral') {
      prop.style.display = 'block';
      prop.style.left = `${propLeft}px`;
      prop.style.top = `${primaryTop + tile}px`;
      prop.style.width = `${tile}px`;
      prop.style.height = `${48 * scale}px`;
      [...prop.querySelectorAll('img')].forEach((img, i) => {
        img.style.left = '0px';
        img.style.top = `${i * tile}px`;
        img.style.width = `${tile}px`;

function playSoloBlockHit267(qNum) {
  if (soloStageAnimating267 || gameMode !== 'SOLO' || !soloState.started) return;
  const modal = document.getElementById('modal');
  if (modal && modal.classList.contains('active')) return;
  if (!qNum || soloState.answeredQuestions.has(Number(qNum))) return;

  const grid = document.getElementById('grid');
  const hit = grid && grid.querySelector('.solo-question-hit267');
  const block = grid && grid.querySelector('.solo-question-block267');
  const mario = grid && grid.querySelector('.solo-mario267');
  const coin = grid && grid.querySelector('.solo-coin267');
  if (!grid || !hit || !block || !mario || !coin) return;

  soloStageAnimating267 = true;
  hit.disabled = true;
  const epoch = ++soloStageAnimationEpoch267;
  const scale = Math.max(0.01, Number(getComputedStyle(grid).getPropertyValue('--solo-scale267')) || 4);
  const jumpPx = 16 * scale;
  const bumpPx = 8 * scale;
  const coinRisePx = 14 * scale;
  const themeId = currentTheme?.id || document.body?.dataset?.theme || 'overworld';
  const isUnderwater = themeId === 'underwater';
  if (isUnderwater) stopSoloStageUnderwaterIdleSwim270();

  let swimFrameTimer = 0;
  if (isUnderwater) {
    const frames = SOLO_THEME_MARIO_FRAMES.underwater || [];
    const seq = [0,1,2,3,4,3,2,1];
    let pos = 0;
    if (frames.length) mario.src = frames[0];
    swimFrameTimer = setInterval(() => {
      if (!soloStageAnimationAlive273(epoch, mario)) {
        clearInterval(swimFrameTimer);
        return;
      }
      if (frames.length) {
        pos = (pos + 1) % seq.length;
        mario.src = frames[seq[pos] % frames.length];
      }
    }, 120);
  } else {
    // v269: OVERWORLD uses the supplied jump sprite; UNDERGROUND/CASTLE use
    // exact palette-swapped versions derived from their standing Mario palettes.
    mario.src = getSoloJumpMario269();
  }

  const upDuration = isUnderwater ? 430 : 150;
  const downDuration = isUnderwater ? 430 : 145;
  const upEasing = isUnderwater ? 'ease-in-out' : 'cubic-bezier(.22,.75,.36,1)';
  const downEasing = isUnderwater ? 'ease-in-out' : 'cubic-bezier(.55,.05,.8,.55)';

  const jumpUp = mario.animate(
    [{ transform: 'translateY(0)' }, { transform: `translateY(${-jumpPx}px)` }],
    { duration: upDuration, easing: upEasing, fill: 'forwards' }
  );

  jumpUp.onfinish = () => {
    if (!soloStageAnimationAlive273(epoch, grid, hit, block, mario, coin)) {
      if (swimFrameTimer) clearInterval(swimFrameTimer);
      return;
    }

    playEmbeddedSfx('coin', { volume: 0.90 });

    // Block bump remains exactly 8 logical px / 120 ms.
    hit.animate(
      [
        { transform: 'translateY(0)' },
        { transform: `translateY(${-bumpPx}px)`, offset: 0.5 },
        { transform: 'translateY(0)' }
      ],
      { duration: 120, easing: 'linear' }
    );

    coin.style.display = 'block';
    coin.src = SOLO_SINGLE_COIN_FRAMES_267[0];

    let frame = 0;
    const frameTimer = setInterval(() => {
      if (!soloStageAnimationAlive273(epoch, coin)) {
        clearInterval(frameTimer);
        return;
      }
      coin.src = SOLO_SINGLE_COIN_FRAMES_267[Math.min(frame, 3)];
      frame += 1;
      if (frame >= 4) clearInterval(frameTimer);
    }, 55);

    const coinAnim = coin.animate(
      [{ transform: 'translateY(0)' }, { transform: `translateY(${-coinRisePx}px)` }],
      { duration: 220, easing: 'cubic-bezier(.18,.65,.35,1)', fill: 'forwards' }
    );

    setTimeout(() => {
      if (!soloStageAnimationAlive273(epoch, grid, hit, block, mario, coin)) {
        if (swimFrameTimer) clearInterval(swimFrameTimer);
        return;
      }

      const jumpDown = mario.animate(
        [
          { transform: `translateY(${-jumpPx}px)` },
          { transform: 'translateY(0)' }
        ],
        { duration: downDuration, easing: downEasing, fill: 'forwards' }
      );

      jumpDown.onfinish = () => {
        if (!soloStageAnimationAlive273(epoch, grid, hit, block, mario, coin)) {
          if (swimFrameTimer) clearInterval(swimFrameTimer);
          return;
        }
        if (swimFrameTimer) clearInterval(swimFrameTimer);
        try { coinAnim.cancel(); } catch (_e) {}
        if (!coin.isConnected || !mario.isConnected) return;
        coin.style.display = 'none';
        try { mario.getAnimations().forEach(a => a.cancel()); } catch (_e) {}
        mario.style.transform = 'translateY(0)';
        mario.src = getSoloStandingMario268();
        if (isUnderwater) startSoloStageUnderwaterIdleSwim270();
        soloStageAnimating267 = false;
        openSoloQuestion(qNum, { fromStage267: true });
      };
    }, 75);
  };
}

function getSoloEarnedScore() {
  const elapsedMs = Math.max(0, performance.now() - soloState.timerStartedAt);

  if (soloState.difficulty !== 'EASY') {
    // HARD RC2: preserve the production arithmetic exactly.
    // First 5 seconds: full 10 points.
    if (elapsedMs <= 5000) return 10.0;

    // After 5 seconds, deduct 0.1 point per 0.1 second (= 1 point/sec).
    const penaltyTenths = Math.floor((elapsedMs - 5000) / 100);
    const earned = 10 - (penaltyTenths * 0.1);

    // At 10 seconds the timer becomes a wrong answer, so valid scored answers
    // naturally remain just above 5.0 points.
    return Math.max(5.0, Math.round(earned * 10) / 10);
  }

  // EASY: same 10 -> 5 score curve stretched across the 20-second window.
  // First 10 seconds stay at 10.0; then deduct 0.1 every 0.2 seconds.
  if (elapsedMs <= 10000) return 10.0;
  const penaltyTenths = Math.floor((elapsedMs - 10000) / 200);
  const earned = 10 - (penaltyTenths * 0.1);
  return Math.max(5.0, Math.round(earned * 10) / 10);
}

/* v1.00.221 — spreadsheet cells should render as plain quiz text.
   If an entire cell accidentally contains serialized JSON/array data, do not
   dump that structure into the player UI. */
function safeQuizUiText221(value, kind = 'text') {
  const text = String(value ?? '').trim();
  if (!text) return '';

  const looksStructured =
    (text.startsWith('{') && text.endsWith('}')) ||
    (text.startsWith('[') && text.endsWith(']'));

  if (!looksStructured) return text;

  try {
    const parsed = JSON.parse(text);
    if (parsed && typeof parsed === 'object') {
      console.warn('[v1.00.221] Structured quiz data blocked from UI:', kind);
      return kind === 'question'
        ? '문제 데이터 형식을 확인해주세요.'
        : '보기 데이터 형식을 확인해주세요.';
    }
  } catch (_) {
    /* Not valid JSON: keep the teacher-authored text exactly as written. */
  }
  return text;
}

function generatePipeItem(allowNegative, turn) {
  const coinScores = [10, 20, 30, 40, 50];
  const shellScores = [10, 20, 30];
  const goombaScores = [10, 20, 30];
  const coin = () => ({ type:'COIN', value:coinScores[Math.floor(Math.random()*coinScores.length)] });
  const shell = () => ({ type:'SHELL', value:shellScores[Math.floor(Math.random()*shellScores.length)] });
  const goomba = () => ({ type:'GOOMBA', value:goombaScores[Math.floor(Math.random()*goombaScores.length)] });

  if (turn === 1) return coin();

  const peachAvailable = getPeachSelectableQuestions().length > 0;
  let pool = [];

  if (turn === 2) {
    pool = [
      [0.50, coin],
      [0.25, shell],
      [0.25, goomba]
    ];
  } else if (allowNegative) {
    pool = [
      [0.10, () => ({type:'STAR'})],
      [0.10, () => ({type:'BOMB'})],
      [0.10, () => ({type:'PEACH'})],
      [0.175, coin],
      [0.175, shell],
      [0.175, goomba],
      [0.175, () => ({type:'BOWSER'})]
    ];
  } else {
    pool = [
      [0.10, () => ({type:'STAR'})],
      [0.10, () => ({type:'PEACH'})],
      [0.40, coin],
      [0.40, shell]
    ];
  }

  if (!peachAvailable) {
    pool = pool.filter(([w, make]) => make().type !== 'PEACH');
    const sum = pool.reduce((s,[w]) => s+w,0);
    pool = pool.map(([w,make]) => [w/sum, make]);
  }

  let r=Math.random();
  for (const [weight,make] of pool) {
    r-=weight;
    if (r<0) return make();
  }
  return pool[pool.length-1][1]();
}

function getPeachSelectableQuestions() {
  const myIdx = gameState.currentTeamIdx;

  return gameState.solvedList.filter(qNum => {
    const q = gameState.questions[qNum - 1];
    if (!q || q.isNull) return false;

    const actualOwner = gameState.tileOwners[qNum];
    const hasPeachOwner = Object.prototype.hasOwnProperty.call(gameState.bingoOwners, qNum);
    const peachOwner = hasPeachOwner ? gameState.bingoOwners[qNum] : null;

    // 이미 피치 효과로 우리 팀 빙고 칸이 된 곳은 다시 선택 불가
    if (peachOwner === myIdx) return false;

    // 우리 팀이 실제로 정답을 맞힌 칸도 이미 우리 빙고 칸이므로 선택 불가
    if (
      actualOwner &&
      actualOwner.isCorrect === true &&
      actualOwner.teamIdx === myIdx &&
      !hasPeachOwner
    ) {
      return false;
    }

    // 나머지 해결된 칸:
    // - 다른 팀 정답
    // - 오답(검은색), 우리 팀 오답 포함
    // - 다른 팀이 피치로 가져간 칸
    // 모두 선택 가능
    return true;
  });
}

function applyItemEffectOptimistically(itemData, targetTeamIdx) {
  const me = gameState.currentTeamIdx;
  const teams = gameState.teams;
  if (!teams || !teams[me]) return;

  switch (itemData.type) {
    case 'COIN':
      teams[me].score += Number(itemData.value || 0);
      break;

    case 'GOOMBA':
      teams[me].score = Math.max(0, teams[me].score - Number(itemData.value || 0));
      break;

    case 'BOMB':
      teams[me].score = 0;
      break;

    case 'SHELL':
      if (targetTeamIdx >= 0 && teams[targetTeamIdx]) {
        const wanted = Number(itemData.value || 0);
        const stolen = Math.min(wanted, Math.max(0, Number(teams[targetTeamIdx].score || 0)));
        teams[targetTeamIdx].score -= stolen;
        teams[me].score += stolen;
      }
      break;

    case 'BOWSER':
    case 'STAR':
      if (targetTeamIdx >= 0 && teams[targetTeamIdx] && targetTeamIdx !== me) {
        const temp = teams[me].score;
        teams[me].score = teams[targetTeamIdx].score;
        teams[targetTeamIdx].score = temp;
      }
      break;
  }

  renderScoreboard();
  renderGrid();
}

function executeItemWithTarget(itemData, targetTeamIdx) {
  if (itemEffectProcessing) return;
  itemEffectProcessing = true;

  if (itemData && itemData.type === 'SHELL') {
    playEmbeddedSfx('kickkill', { volume: 0.92 });
  }

  const qNumToApply = gameState.currentQ ? gameState.currentQ.num : 0;
  const activeTeamIdx = gameState.currentTeamIdx;
  // Lock any target buttons immediately so repeated taps cannot submit twice.
  const buttons = document.querySelectorAll('#targetTeamArea .target-btn');
  buttons.forEach(btn => {
    btn.disabled = true;
    btn.style.opacity = '0.5';
    btn.style.cursor = 'not-allowed';
  });

  // Mark the solved tile locally right away.
  if (qNumToApply > 0) {
    if (!gameState.solvedList.includes(qNumToApply)) {
      gameState.solvedList.push(qNumToApply);
    }
    gameState.tileOwners[qNumToApply] = {
      teamIdx: activeTeamIdx,
      isCorrect: true
    };
  }

  // Apply the item locally first. The player sees the score/result immediately.
  applyItemEffectOptimistically(itemData, targetTeamIdx);
  showItemAppliedImmediately();

  // v1.00.184 — keep the entire TEAM score transaction in this browser session.
  // No shared-sheet reconciliation: another active game can no longer overwrite
  // this game's scores when its server response arrives.
  renderScoreboard();
  renderGrid();

  // v1.00.227 — keep this transaction locked until CONTINUE closes the modal.
  // The old code released it immediately, leaving a tiny stale-handler window
  // where an already queued target tap could apply the same item twice.
}

function getRemainingQuestions() {
  return gameState.questions.filter(q => {
    if (q.isNull) return false;
    const solvedByList = gameState.solvedList.includes(q.num);
    const solvedByOwner = Object.prototype.hasOwnProperty.call(gameState.tileOwners || {}, q.num);
    return !solvedByList && !solvedByOwner;
  });
}

function advanceTurn(completedQuestionNum) {
  if (gameEnded || gameMode !== 'TEAM') return;

  const qNum = Number(completedQuestionNum || (gameState.currentQ && gameState.currentQ.num) || 0);

  // v1.00.170 — A board question is a turn. Never let the same question
  // advance TEAM state twice, even if a button/event fires twice or an async
  // result finishes late.
  if (qNum > 0) {
    if (teamCommittedQuestionNums170.has(qNum)) return;
    teamCommittedQuestionNums170.add(qNum);
    gameState.totalTurnsPlayed = teamCommittedQuestionNums170.size;
  } else {
    // Defensive fallback only. Normal TEAM play always has currentQ.
    gameState.totalTurnsPlayed += 1;
  }

  if (gameState.teams.length > 0) {
    gameState.currentTeamIdx =
      (gameState.currentTeamIdx + 1) % gameState.teams.length;
  }

  renderScoreboard();

  const turnLimit = getCurrentTeamTurnLimit156();
  const finalStartTurn = Number(gameState.finalRoundStartTurn170 || 0);

  // The end boundary wins. No banner, round announcement, or next-team state
  // may run after the pre-calculated fair turn limit.
  if (turnLimit > 0 && gameState.totalTurnsPlayed >= turnLimit) {
    triggerGameEnd();
    return;
  }

  // FINAL ROUND is a fixed boundary, not a "remaining <= teams" heuristic.
  // It fires once, immediately after the preceding complete round finishes.
  if (!finalRoundShown && finalStartTurn > 0 &&
      gameState.totalTurnsPlayed === finalStartTurn) {
    showFinalRoundBanner();
    return;
  }

  const continueBtn = document.getElementById('continueBtn');
  if (continueBtn) {
    continueBtn.disabled = false;
    continueBtn.style.display = 'inline-block';
  }

  const ended = checkGameOver();
  if (ended) return;

  const totalTeams = gameState.teams.length;
  const isRoundComplete =
    totalTeams > 0 &&
    gameState.totalTurnsPlayed > 0 &&
    gameState.totalTurnsPlayed % totalTeams === 0;

  if (isRoundComplete && !finalRoundActive && !gameEnded) {
    setTimeout(announceRoundIfNeeded, 250);
  } else {
    updateSideRoundDisplay();
  }
}

  return Math.floor(gameState.totalTurnsPlayed / teamCount) + 1;

  updateSideRoundDisplay();

// v1.00.144 — TEAM keeps all board cells active, but the match ends
// at the last complete round that every team can receive equally.
function getFairTeamTurnLimit144() {
  const totalTeams = Math.max(1, gameState.teams.length);
  const activeQuestionCount = gameState.questions.filter(q => !q.isNull).length;

  if (gameMode !== 'TEAM' || totalTeams <= 1) {
    return activeQuestionCount;
  }

  return Math.floor(activeQuestionCount / totalTeams) * totalTeams;
}

function getCurrentTeamTurnLimit156() {
  if (gameMode === 'TEAM' && Number(gameState.teamTurnLimit156) > 0) {
    return Number(gameState.teamTurnLimit156);
  }
  return getFairTeamTurnLimit144();
}

function maybeStartFinalRound() {
  if (gameEnded || finalRoundShown) return false;

  const totalTeams = gameState.teams.length;
  if (totalTeams === 0) return false;

  if (gameMode === 'TEAM') {
    const finalStartTurn = Number(gameState.finalRoundStartTurn170 || 0);
    if (finalStartTurn > 0 && gameState.totalTurnsPlayed === finalStartTurn) {
      showFinalRoundBanner();
      return true;
    }
    return false;
  }

  const remainingCount = getRemainingQuestions().length;
  if (remainingCount >= totalTeams && remainingCount < totalTeams * 2) {
    showFinalRoundBanner();
    return true;
  }

  return false;
}

function checkGameOver() {
  if (gameEnded) return true;

  const totalTeams = gameState.teams.length;
  if (totalTeams === 0) return false;

  const activeQuestionCount = gameState.questions.filter(q => !q.isNull).length;
  if (activeQuestionCount === 0) return false;

  const remainingCount = getRemainingQuestions().length;

  if (gameMode === 'TEAM') {
    const fairTurnLimit = getCurrentTeamTurnLimit156();

    // v1.00.170 — TEAM uses only the boundaries frozen at game start.
    if (fairTurnLimit > 0 && gameState.totalTurnsPlayed >= fairTurnLimit) {
      triggerGameEnd();
      return true;
    }

    // Safety fallback only for genuinely exhausted boards. This must never
    // decide FINAL ROUND timing.
    if (remainingCount === 0) {
      triggerGameEnd();
      return true;
    }

    return false;
  }

  if (remainingCount === 0) {
    triggerGameEnd();
    return true;
  }

  maybeStartFinalRound();
  return false;
}

function calculateBingoCount(teamIdx) {
  const owned = new Set();

  Object.entries(gameState.tileOwners).forEach(([qNum, owner]) => {
    const n=Number(qNum);
    if (Object.prototype.hasOwnProperty.call(gameState.bingoOwners,n)) {
      if (gameState.bingoOwners[n] === teamIdx) owned.add(n);
    } else if (owner && owner.teamIdx === teamIdx && owner.isCorrect === true) {
      owned.add(n);
    }
  });

  const lines=[];
  for(let row=0;row<5;row++) lines.push([1,2,3,4,5].map(x=>row*5+x));
  for(let col=0;col<5;col++) lines.push([1,6,11,16,21].map(x=>x+col));
  lines.push([1,7,13,19,25],[5,9,13,17,21]);

  return lines.reduce((count,line)=>count+(line.every(n=>owned.has(n))?1:0),0);
}

function buildFinalResults() {
  return gameState.teams.map((t, idx) => {
    let correctCount = 0;

    Object.values(gameState.tileOwners).forEach(owner => {
      if (owner.teamIdx === idx && owner.isCorrect) correctCount++;
    });

    const correctBonus = correctCount * 10;
    const bingoLines = calculateBingoCount(idx);
    const bingoBonus = bingoLines * 100;

    return {
      name: t.name,
      teamIdx: idx,
      baseScore: t.score,
      correctCount,
      correctBonus,
      bingoLines,
      bingoBonus,
      finalScore: t.score + correctBonus + bingoBonus,
      displayScore: t.score
    };
  });
}

function animateTeamScores(targetSelector, getTargetScore, bonusRenderer, isBingo, onDone) {
  if (!finalRevealState) return;
  const generation = finalRevealGeneration188;
  const results = finalRevealState.results;
  const starts = results.map(r => r.displayScore);
  const targets = results.map(getTargetScore);
  const maxDelta = Math.max(...targets.map((t, i) => Math.abs(t - starts[i])), 0);
  const duration = maxDelta > 0 ? 1350 : 450;
  const startTime = performance.now();
  let lastTickAt = 0;

  results.forEach((r, i) => {
    const card = document.getElementById(`finalTeamCard-${r.teamIdx}`);
    if (targets[i] !== starts[i]) card.classList.add('rolling');
    const bonusEl = document.getElementById(`finalBonus-${r.teamIdx}`);
    bonusEl.innerHTML = bonusRenderer(r);
  });

  function frame(now) {
    if (generation !== finalRevealGeneration188 || !finalRevealState || !winnerModalOpened188) {
      finalRevealRaf188 = 0;
      return;
    }

    const p = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - p, 3);

    results.forEach((r, i) => {
      const value = Math.round(starts[i] + (targets[i] - starts[i]) * eased);
      document.getElementById(`finalScore-${r.teamIdx}`).innerText = value;
    });

    if (now - lastTickAt > 70 && p < 0.96 && maxDelta > 0) {
      playBonusTick(isBingo ? 1.6 : 1);
      lastTickAt = now;
    }

    if (p < 1) {
      finalRevealRaf188 = requestAnimationFrame(frame);
    } else {
      finalRevealRaf188 = 0;
      results.forEach((r, i) => {
        r.displayScore = targets[i];
        document.getElementById(`finalScore-${r.teamIdx}`).innerText = targets[i];
        document.getElementById(`finalTeamCard-${r.teamIdx}`).classList.remove('rolling');
      });
      playBonusFinish(isBingo);
      finalRevealDoneTimer188 = setTimeout(() => {
        finalRevealDoneTimer188 = 0;
        if (generation !== finalRevealGeneration188 || !finalRevealState || !winnerModalOpened188) return;
        onDone();
      }, 220);
    }
  }

  finalRevealRaf188 = requestAnimationFrame(frame);
}

function revealFinalWinner() {
  finalRevealState.busy = true;
  const btn = document.getElementById('finalNextBtn');
  btn.disabled = true;

  const sorted = [...finalRevealState.results].sort((a, b) => b.finalScore - a.finalScore);

  const winners = sorted.filter(r => r.finalScore === topScore);

  document.getElementById('finalStageKicker').innerText = 'FINAL RESULT';
  document.getElementById('finalStageTitle').innerText =
    winners.length > 1 ? 'DRAW!' : `${winners[0].name} WINNER!`;

  finalRevealState.results.forEach(res => {
    const card = document.getElementById(`finalTeamCard-${res.teamIdx}`);
    const isWinner = winners.some(w => w.teamIdx === res.teamIdx);
    card.classList.toggle('winner', isWinner);
    card.classList.toggle('loser', !isWinner);
    document.getElementById(`finalBonus-${res.teamIdx}`).innerHTML =
      `<strong>최종 ${res.finalScore}점</strong>`;

  document.getElementById('finalStageMessage').innerText =
    winners.length > 1
      ? `${winners.map(w => w.name).join(' · ')} 공동 우승!`
      : `축하합니다! ${winners[0].name} 우승!`;

  // v1.00.188 — keep the same off-beat rhythm, but tie every delayed SFX
  // to this exact winner sequence so stale timers can never survive a reset/reload path.
  scheduleFinalWinnerSfx188(2000);
  scheduleFinalWinnerSfx188(2430);
  scheduleFinalWinnerSfx188(3180);

  playSpecialMidi('levelComplete', false);

  finalRevealState.stage = 3;

}

function advanceFinalReveal() {
  if (!finalRevealState || finalRevealState.busy) return;

}
