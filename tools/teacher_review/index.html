<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOJA · 교사용 플레이 검수</title><style>
*{box-sizing:border-box}body{margin:0;background:#102b3c;color:#eff7fb;font:16px system-ui,sans-serif}header{padding:14px 22px;background:#173b4e}h1{font-size:22px;margin:0}main{padding:20px;max-width:1200px;margin:auto}section{background:#204b5b;border:2px solid #efcf87;border-radius:14px;padding:18px;margin-bottom:14px}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:10px;border-radius:8px}button{background:#f5cf76;font-weight:bold;cursor:pointer;border:2px solid #332b20}button:disabled{opacity:.5}#info{display:flex;gap:14px;flex-wrap:wrap}#game{width:100%;height:70vh;border:2px solid #efcf87;background:#10283a}#game[hidden]{display:none}#notice{color:#ffe48d}textarea{width:100%;font:inherit;padding:8px;min-height:60px}</style></head><body><header><h1>HOJA · 교사용 플레이 검수</h1></header><main>
<section><p>교사가 직접 조작하는 시험판입니다. 실제 학생 정보 없이 내장 시험 문제를 사용합니다.</p><label>검수 방식 <select id="mode"><option value="campaign">전체 게임 처음부터</option><option value="stage">스테이지별 검수</option><option value="course">신규 기믹 시험 코스</option><option value="windcourse">바람 장애물 시험 코스</option><option value="brickcourse">이어지는 벽돌 발판 시험 코스</option></select></label><label id="stageRow" hidden>시작 스테이지 <select id="stage"><option value="0">초원</option><option value="1">가을</option><option value="2">열대</option><option value="3">겨울</option><option value="4">동굴</option></select></label><label>맵 시드 (0~4294967295) <input id="seed" type="number" min="0" max="4294967295" step="1" value="314159"></label><button id="start">검수 시작 / 같은 설정으로 다시 시작</button><p id="notice" role="status">이동 A/D · 위/입장 W · 아래/토관 S · 달리기 , · 점프 . · 확인 Enter · 도움말 H</p></section>
<section><div id="info">검수 시작 전입니다.</div><label>문제 지점 메모 <textarea id="memo" maxlength="500" placeholder="현재 위치에 관한 짧은 메모"></textarea></label><button id="mark" disabled>현재 위치 메모 추가</button> <button id="download" disabled>검수 기록 저장</button> <button id="stop" disabled>검수 중단</button><p>스테이지 선택은 유도 시작이며 전체 게임 자연 완주와 구분됩니다. 신규 기믹 코스는 오른쪽 골인 표시까지 이동하세요. 게임 중 위치나 시간을 바꾸는 기능은 없습니다.</p></section><iframe id="game" title="HOJA 검수 게임" hidden></iframe></main><script src="teacher-review.js"></script></body></html>
